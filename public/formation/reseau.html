 {i:"Building2",h:"Le NAT de l'opérateur : CGNAT",p:[D(F(B("Téléphone","10.x (privé)",'b'),B("NAT du téléphone","si partage de connexion",'n'),B("CGNAT opérateur","100.64.x.x → publique",'o'),B("Internet","une adresse pour des centaines de clients",'g'))),"Sur les réseaux mobiles, et chez de plus en plus d'opérateurs fixes, il n'y a même plus d'adresse publique par client. L'opérateur place un énorme NAT devant ses clients, le [[CGNAT]] : chaque client reçoit une adresse de la plage 100.64.0.0/10, et des centaines de clients partagent une même adresse publique.","Conséquences : impossible d'ouvrir un port vers chez soi ; un site qui bannit une adresse publique bannit tous ceux qui la partagent ; et pour retrouver qui a fait quoi, l'opérateur doit garder l'adresse, le port et l'heure de chaque traduction."]},
 {q:"Un serveur voit 1 000 requêtes par minute venir de la même adresse publique d'un opérateur mobile. Est-ce forcément un seul client ?",o:["Oui, une adresse = un client","Non : derrière un CGNAT, des centaines de clients partagent la même adresse publique","Oui, sinon ce serait IPv6"],a:1,e:"Limiter ou bannir par adresse IP peut toucher des centaines d'utilisateurs innocents derrière le même CGNAT."},
 {i:"Phone",h:"Se parler à travers deux NAT",p:["Deux téléphones, chacun derrière son NAT, veulent s'appeler en vidéo directement. Aucun ne peut joindre l'autre : chacun bloque les entrées. Les applications utilisent alors le [[NAT traversal]] : chacun demande à un serveur public (STUN) « sous quelle adresse et quel port me vois-tu ? », puis les deux s'envoient des paquets en même temps pour ouvrir chacun une entrée dans son propre NAT.","Quand ça échoue (NAT trop strict), le trafic passe par un relais public (TURN), au prix d'un peu de latence."]},
 {i:"Info",h:"Ce que le NAT casse",p:["Le NAT réécrit les en-têtes IP et TCP. Les protocoles qui écrivent des adresses IP à l'intérieur de leurs données (FTP actif, certains protocoles de voix SIP) ne fonctionnent plus sans aide. Les journaux d'un serveur ne montrent plus l'adresse réelle du client, seulement celle du NAT (d'où l'en-tête HTTP X-Forwarded-For, ajouté par les proxys).","IPv6 a été pensé pour se passer du NAT : chaque machine a une adresse publique, et le pare-feu décide de ce qui entre."]},
 {q:"Dans les journaux d'un portail, toutes les requêtes semblent venir de la même adresse 10.30.197.5. Que se passe-t-il probablement ?",o:["Un seul client utilise le portail","Un répartiteur ou un proxy fait du NAT devant les serveurs : l'adresse réelle du client est dans un en-tête comme X-Forwarded-For","Le DNS est mal configuré"],a:1,e:"Le serveur voit l'adresse de l'intermédiaire. Il faut lire l'en-tête ajouté par celui-ci pour retrouver le vrai client."},
 {r:["Sans entrée dans la table NAT, une connexion entrante est jetée.","DNAT / redirection de port : règle fixe pour exposer un serveur interne.","CGNAT : l'opérateur fait le NAT, des centaines de clients par adresse publique.","Le NAT masque l'adresse réelle du client et gêne certains protocoles ; IPv6 s'en passe."]}
]},

/* ───────────── M6 · Le transport ───────────── */
{id:"r12",t:"Ports, TCP et UDP",cards:[
 {i:"DoorOpen",h:"L'adresse mène à la machine, le port au programme",p:["Une même machine fait tourner plusieurs services : un serveur web, un accès SSH, une base de données. L'adresse IP amène le paquet jusqu'à la machine ; le [[Port|port]], un numéro de 0 à 65 535, dit à quel programme il est destiné.","Le serveur écoute sur un port connu (443 pour HTTPS). Le client, lui, utilise un [[Port éphémère|port éphémère]] choisi au hasard. Une connexion est ainsi identifiée par cinq éléments : protocole, IP source, port source, IP destination, port destination. C'est ce qui permet à ton navigateur d'ouvrir vingt connexions vers le même site sans les mélanger."]},
 {i:"List",h:"Les ports à connaître",p:[D(TB(["Port","Service","Transport"],[["22","SSH (administration)","TCP"],["25 / 587","SMTP (envoi de mails)","TCP"],["53","DNS","UDP, et TCP pour les grosses réponses"],["80","HTTP","TCP"],["123","NTP (l'heure)","UDP"],["161 / 162","SNMP (supervision / alarmes)","UDP"],["443","HTTPS","TCP (et UDP pour HTTP/3)"],["3306 / 5432","MySQL / PostgreSQL","TCP"]],1)),"Les ports sous 1024 sont réservés aux services connus. On voit les ports en écoute sur une machine avec ss -ltn sous Linux, ou netstat -an sous Windows."]},
 {i:"Mail",h:"Deux façons de transporter",p:[D(C(P("TCP","b",["une connexion ouverte d'abord","tout arrive, dans l'ordre","renvoi de ce qui est perdu","régule son débit","web, API, SSH, bases de données"]),P("UDP","o",["pas de connexion","chaque message est seul","pas de renvoi, pas d'ordre","très léger, très rapide","DNS, voix, vidéo en direct, jeux"]))),"[[TCP]] garantit que tout arrive, dans l'ordre, ou prévient que la connexion a échoué. [[UDP]] envoie et oublie. Pourquoi voudrait-on UDP ? Parce que dans un appel, un morceau de voix qui arrive en retard ne sert plus à rien : mieux vaut un petit trou qu'un silence d'attente. Et une question DNS tient dans un seul paquet : ouvrir une connexion coûterait plus cher que de reposer la question."]},
 {q:"Pourquoi un appel vocal utilise-t-il plutôt UDP que TCP ?",o:["UDP est chiffré","Un morceau de voix en retard est inutile : mieux vaut le perdre que tout bloquer pour le renvoyer","TCP ne passe pas le NAT"],a:1,e:"TCP attendrait le paquet perdu et bloquerait la suite : la voix hacherait. UDP laisse l'application décider."},
 {i:"Smartphone",h:"Qui écoute, qui appelle",p:[D(F(B("Client","10.1.1.5 : 52314",'b'),B("Connexion TCP","",'n'),B("Serveur","10.30.0.10 : 443",'g'))),"Le serveur « écoute » sur son port et attend. Le client « appelle » depuis un port éphémère. Les règles de pare-feu se décrivent donc presque toujours ainsi : « autoriser 10.1.1.0/24 vers 10.30.0.10, port TCP 443 », sans se soucier du port source du client, qui change à chaque fois."]},
 {q:"Combien d'éléments identifient une connexion de façon unique ?",o:["2 : IP source et IP destination","5 : protocole, IP et port source, IP et port destination","1 : le port"],a:1,e:"Le « 5-tuple ». Deux connexions du même client vers le même serveur ne diffèrent que par le port source."},
 {q:"Une règle de pare-feu doit permettre à des postes de joindre un serveur PostgreSQL. Que précise-t-on ?",o:["Le port source des postes","Les adresses des postes, l'adresse du serveur et le port TCP 5432","L'adresse MAC du serveur"],a:1,e:"On filtre sur le port de destination, celui où le service écoute. Le port source est éphémère."},
 {r:["Le port (0 à 65 535) désigne le programme ; le serveur écoute, le client appelle depuis un port éphémère.","Une connexion = protocole + IP et port source + IP et port destination.","TCP : fiable, ordonné ; UDP : léger, sans garantie.","22 SSH, 53 DNS, 80 HTTP, 123 NTP, 443 HTTPS."]}
]},
{id:"r13",t:"TCP en détail",cards:[
 {i:"Handshake",h:"La poignée de main en trois temps",p:[D(F(B("SYN","« je veux te parler »",'b'),B("SYN-ACK","« d'accord, moi aussi »",'v'),B("ACK","« c'est parti »",'g'))),"Avant d'envoyer la moindre donnée, TCP ouvre la connexion : c'est la [[Poignée de main|poignée de main]]. Le client envoie un [[SYN]], le serveur répond SYN-ACK, le client confirme par un [[ACK]]. Les deux s'échangent au passage leurs numéros de départ.","Cela coûte un aller-retour complet avant le premier octet utile. Sur une liaison à 150 ms, c'est 150 ms de perdus à chaque nouvelle connexion : d'où l'intérêt de garder les connexions ouvertes et de les réutiliser."]},
 {i:"ListOrdered",h:"Tout est numéroté",p:["Chaque octet envoyé porte un numéro. Le destinataire répond par des accusés : « j'ai tout reçu jusqu'à l'octet 4 000 ». S'il manque un morceau, il le signale, et l'expéditeur renvoie. Si aucun accusé n'arrive dans le délai prévu, l'expéditeur renvoie aussi : c'est la [[Retransmission|retransmission]].","Les numéros permettent aussi de remettre dans l'ordre des paquets arrivés en désordre, et de jeter les doublons."]},
 {w:"sim_tcp"},
 {i:"TrendingUp",h:"La fenêtre : accélérer sans saturer",p:["TCP n'attend pas un accusé après chaque paquet : il envoie une série, sa [[Fenêtre TCP|fenêtre]], puis attend. Au début, la fenêtre est petite ; tant que tout arrive, TCP l'agrandit, et le débit monte. À la première perte, il la réduit nettement : il suppose que le réseau est saturé.","C'est ainsi que des millions de connexions se partagent internet sans chef d'orchestre. Conséquence : 1 % de pertes suffit à faire chuter fortement le débit d'une connexion TCP, surtout sur une liaison à forte latence."]},
 {q:"Un lien perd 2 % des paquets. Le débit d'un téléchargement TCP s'effondre alors que le lien est loin d'être plein. Pourquoi ?",o:["TCP réduit sa fenêtre à chaque perte, pensant que le réseau est saturé","Le serveur est lent","Le DNS est en panne"],a:0,e:"Pour TCP, une perte = congestion : il ralentit. Un lien qui perd des paquets sans être plein est donc très pénalisant (câble, Wi-Fi, radio)."},
 {i:"OctagonX",h:"Timeout ou refus : la différence qui aide à diagnostiquer",p:[D(C(P("Connexion refusée","r",["réponse immédiate (RST)","la machine est joignable","mais personne n'écoute sur ce port","→ regarder le service"]),P("Timeout","o",["aucune réponse, attente","le SYN s'est perdu ou a été jeté","pare-feu, route absente, machine éteinte","→ regarder le chemin"]))),"Quand une connexion échoue, la façon dont elle échoue est un indice. Un refus immédiat ([[RST]]) veut dire que la machine a répondu : « personne ici ». Un [[Timeout|timeout]] veut dire que personne n'a répondu : quelque chose sur le chemin a jeté le paquet, en silence. C'est le comportement normal d'un pare-feu qui bloque."]},
 {i:"PowerOff",h:"Fermer une connexion",p:["Pour fermer proprement, chaque côté envoie un FIN et reçoit un ACK. Celui qui ferme en premier garde la connexion quelque temps dans l'état TIME_WAIT, pour absorber les paquets retardataires. Un serveur qui ouvre et ferme des milliers de connexions par seconde peut accumuler des dizaines de milliers de TIME_WAIT : c'est normal, tant que les ports ne s'épuisent pas.","ss -tan montre l'état de chaque connexion : LISTEN (en écoute), ESTABLISHED (ouverte), SYN-SENT (en attente de réponse), TIME_WAIT…"]},
 {q:"curl répond « Connection refused » instantanément. Que peut-on en déduire ?",o:["Un pare-feu bloque en silence","La machine est joignable, mais aucun programme n'écoute sur ce port","Le câble est débranché"],a:1,e:"Un refus immédiat est une réponse de la machine. On vérifie que le service tourne et écoute bien sur ce port et cette adresse."},
 {q:"Avant le premier octet d'une réponse HTTPS, combien d'allers-retours faut-il au minimum avec TCP et TLS 1.3 ?",o:["Aucun","Un pour TCP, un pour TLS, puis la requête : environ trois","Dix"],a:1,e:"Poignée de main TCP (1), négociation TLS 1.3 (1), puis la requête et sa réponse (1). À 150 ms par aller-retour, 450 ms avant la première réponse."},
 {r:["SYN, SYN-ACK, ACK : un aller-retour avant la première donnée.","Tout est numéroté et accusé ; ce qui manque est retransmis.","La fenêtre grandit tant que tout va bien et chute à la première perte.","Refus immédiat = rien n'écoute ; timeout = quelque chose jette sur le chemin."]}
]},

/* ───────────── M7 · Internet et DNS ───────────── */
{id:"r14",t:"L'architecture d'internet",cards:[
 {i:"Globe",h:"Un réseau de réseaux",p:[D(F(B("Ton téléphone","",'n'),B("Ton opérateur (FAI)","réseau d'accès",'b'),B("Transitaires et IXP","échange entre réseaux",'v'),B("Hébergeur du site","son data center",'g'),B("Serveur","",'n'))),"Ton [[FAI]] (l'opérateur) relie ton téléphone ou ta box à son réseau. Mais il n'a pas le monde entier dans son réseau : il est relié à d'autres réseaux, qui sont reliés à d'autres. Chacun est un [[AS]], et BGP leur permet de savoir qui peut joindre quoi.","Il n'y a pas de centre. Si un réseau tombe, les autres font passer le trafic ailleurs, si un autre chemin existe."]},
 {i:"Handshake",h:"Transit et peering",p:[D(C(P("Transit","o",["un petit réseau paie un grand","pour joindre tout internet à travers lui","comme un abonnement"]),P("Peering","g",["deux réseaux échangent directement","leur trafic mutuel, souvent gratuitement","parce que ça arrange les deux"]))),"Le [[Transit|transit]] est un service payant : « fais passer mon trafic vers le reste du monde ». Le [[Peering|peering]] est un échange entre égaux : « ton trafic vers mes clients, et le mien vers les tiens, directement ». Les opérateurs combinent les deux pour réduire leurs coûts et leur latence."]},
 {i:"Building2",h:"Les points d'échange",p:["Un [[IXP]] (Internet Exchange Point) est un lieu, souvent un data center, où des dizaines ou des centaines de réseaux branchent leurs routeurs sur un même switch géant pour échanger leur trafic.","Sans IXP local, deux opérateurs d'un même pays peuvent être obligés de faire passer leur trafic par l'Europe : un message entre deux voisins fait des milliers de kilomètres aller-retour. Les IXP africains (Johannesburg, Lagos, Nairobi, Dakar…) ont fortement réduit la latence et les coûts sur le continent."]},
 {q:"Deux opérateurs d'un même pays n'ont pas de point d'échange local. Leur trafic passe par un autre continent. Quel effet ?",o:["Aucun effet","Une latence bien plus forte et un coût plus élevé pour un échange pourtant local","Un meilleur chiffrement"],a:1,e:"Le trafic fait des milliers de kilomètres inutiles. Un IXP local le garde dans le pays."},
 {i:"Waves",h:"Les câbles sous-marins",p:["Presque tout le trafic entre continents passe par des [[Câble sous-marin|câbles sous-marins]] : des fibres optiques posées au fond des océans, de quelques centimètres d'épaisseur, sur des milliers de kilomètres. Les satellites en portent une part minime.","Une coupure (ancre de bateau, glissement de terrain sous-marin) ralentit parfois des pays entiers : le trafic se reporte sur les câbles restants, qui saturent. En 2024, plusieurs câbles coupés au large de l'Afrique de l'Ouest ont ralenti une dizaine de pays pendant des jours."]},
 {i:"Server",h:"Rapprocher le contenu : CDN et anycast",p:["Les grands sites ne servent pas tout depuis un seul data center. Un [[CDN]] garde une copie des contenus (images, vidéos, fichiers) dans des centaines de villes. Ton téléphone télécharge la vidéo depuis un serveur dans ton pays, pas depuis l'autre bout du monde.","Avec l'[[Anycast|anycast]], une même adresse IP est annoncée depuis plusieurs endroits : BGP envoie chaque utilisateur vers le plus proche. C'est ainsi que 1.1.1.1 ou 8.8.8.8 répondent vite partout."]},
 {q:"Pourquoi une vidéo d'un grand site se charge-t-elle vite, même si le siège de l'entreprise est sur un autre continent ?",o:["La vidéo est compressée","Elle est servie par un serveur de CDN proche de toi","Le Wi-Fi est plus rapide la nuit"],a:1,e:"Le CDN rapproche le contenu de l'utilisateur : moins de distance, moins de latence, moins de câbles intercontinentaux chargés."},
 {q:"Un câble sous-marin est coupé. Internet fonctionne toujours, mais plus lentement. Pourquoi ?",o:["Le trafic passe par les autres câbles, qui saturent, ou par des chemins plus longs","Les satellites prennent le relais à 100 %","C'est une coïncidence"],a:0,e:"BGP trouve d'autres chemins, mais leur capacité est limitée et leur trajet souvent plus long."},
 {r:["Internet = des dizaines de milliers d'AS reliés par BGP, sans centre.","Transit : on paie pour joindre le monde ; peering : on échange directement.","IXP : les réseaux échangent localement ; câbles sous-marins entre continents.","CDN et anycast rapprochent le contenu de l'utilisateur."]}
]},
{id:"r15",t:"Le DNS : l'annuaire d'internet",cards:[
 {i:"BookOpen",h:"Des noms pour les humains, des adresses pour les machines",p:["Personne ne retient 198.51.100.20. On retient www.exemple.com. Le [[DNS]] traduit l'un en l'autre. Ce n'est pas un seul serveur : c'est un annuaire distribué sur des millions de serveurs, organisé en arbre.","On lit un nom de droite à gauche : www.exemple.com. se lit « racine (le point final, invisible) → com → exemple → www »."]},
 {i:"Workflow",h:"Une résolution, étape par étape",p:[D(F(B("Ton téléphone","« www.exemple.com ? »",'n'),B("Résolveur","fait le tour pour toi",'b')),F(B("Racine","« .com ? va voir là »",'v'),B("Serveur .com","« exemple.com ? va voir là »",'o'),B("Serveur d'exemple.com","« 198.51.100.20 »",'g'))),"Ton téléphone pose la question à un [[Résolveur|résolveur]] (celui de l'opérateur, de la box, ou 8.8.8.8). Le résolveur ne connaît pas la réponse : il interroge un [[Serveur racine|serveur racine]], qui l'oriente vers les serveurs de .com, qui l'orientent vers ceux d'exemple.com : le [[Serveur faisant autorité|serveur faisant autorité]], qui donne la réponse.","Le résolveur garde tout en cache : la question suivante pour un nom en .com sautera la racine, et la même question sera servie instantanément."]},
 {w:"sim_dns"},
 {i:"List",h:"Les enregistrements",p:[D(TB(["Type","Ce qu'il dit","Exemple"],[["A","nom → adresse IPv4","www → 198.51.100.20"],["AAAA","nom → adresse IPv6","www → 2001:db8::20"],["CNAME","alias vers un autre nom","api → lb.hebergeur.net"],["MX","serveur de messagerie du domaine","mail.exemple.com"],["NS","serveurs DNS du domaine","ns1.exemple.com"],["TXT","texte (preuves, anti-spam)","v=spf1 …"],["PTR","adresse → nom (inverse)","20.100.51.198 → www"]],1)),"Chaque ligne est un [[Enregistrement DNS|enregistrement]]. Chacun porte un [[TTL DNS|TTL]] : la durée pendant laquelle on peut le garder en cache."]},
 {i:"Clock",h:"Le TTL : pourquoi les changements prennent du temps",p:["Tu changes l'adresse de ton site. Certains utilisateurs arrivent sur la nouvelle, d'autres sur l'ancienne pendant encore une heure : leurs résolveurs ont gardé l'ancienne réponse en cache, comme le TTL le leur permettait.","Avant une migration, on baisse donc le TTL (par exemple à 300 secondes) un jour à l'avance. Après, on le remonte : un TTL court multiplie les requêtes DNS."]},
 {q:"Un site change d'adresse IP. Une heure après, certains clients arrivent toujours sur l'ancienne. Pourquoi ?",o:["Le DNS est en panne","Leurs résolveurs gardent l'ancienne réponse en cache jusqu'à la fin de son TTL","Le NAT de la box garde l'ancienne adresse"],a:1,e:"Le cache est respecté jusqu'à expiration du TTL. On le baisse avant une migration."},
 {q:"Qui interroge les serveurs racine, .com, puis le serveur faisant autorité ?",o:["Ton navigateur directement","Le résolveur récursif, pour le compte de ta machine","Le routeur de la box"],a:1,e:"Ta machine pose une seule question au résolveur ; c'est lui qui fait le tour et met tout en cache."},
 {i:"TriangleAlert",h:"Quand le DNS casse, tout casse",p:["Si le DNS ne répond plus, rien ne semble marcher : ni les sites, ni les applications, ni les API, alors que le réseau fonctionne parfaitement. Symptôme typique : ping 8.8.8.8 répond, mais ping www.exemple.com donne « nom inconnu ».","Dans une plateforme comme Mobile Money, les services se trouvent souvent par leur nom : une panne du DNS interne peut faire tomber en cascade des services pourtant en bonne santé. D'où le dicton des équipes réseau : « c'est toujours le DNS »."]},
 {q:"ping 8.8.8.8 répond, mais aucun site ne s'ouvre et ping www.exemple.com donne « nom inconnu ». Où est le problème ?",o:["La connexion internet est coupée","La résolution DNS : le réseau fonctionne, mais les noms ne sont plus traduits","Le site est en panne"],a:1,e:"Joindre une adresse IP prouve que le réseau marche. C'est la traduction des noms qui échoue : vérifier les serveurs DNS configurés."},
 {r:["Le DNS traduit les noms en adresses ; il est distribué en arbre.","Résolveur → racine → TLD (.com) → serveur faisant autorité.","A, AAAA, CNAME, MX, NS, TXT, PTR ; chaque réponse a un TTL de cache.","Ping d'une IP OK mais noms inconnus : c'est le DNS."]}
]},
{id:"r16",t:"Le voyage d'une requête",cards:[
 {i:"MousePointerClick",h:"Tu tapes une adresse et tu appuies sur Entrée",p:["Entre l'appui sur Entrée et l'affichage de la page, il se passe en une fraction de seconde presque tout ce que tu as vu dans ce cours. Suivons-le étape par étape, avec ton téléphone en Wi-Fi à la maison qui ouvre https://www.exemple.com/solde."]},
 {w:"sim_journey"},
 {i:"ListOrdered",h:"Le résumé",p:[D(TB(["Étape","Protocole","Couche"],[["Trouver l'adresse du site","DNS (UDP 53)","application"],["Trouver la MAC de la box","ARP","accès"],["Sortir avec l'adresse publique","NAT de la box","internet"],["Traverser les réseaux","IP, BGP entre les AS","internet"],["Ouvrir la connexion","TCP (SYN, SYN-ACK, ACK)","transport"],["Chiffrer et vérifier le site","TLS (certificat)","transport et application"],["Demander la page","HTTP (GET)","application"]],1)),"Chaque étape peut échouer, et chacune donne un symptôme différent. C'est tout l'intérêt de connaître le parcours : savoir où chercher."]},
 {q:"Dans quel ordre se passent ces étapes ?",o:["TCP, DNS, TLS, HTTP","DNS, TCP, TLS, HTTP","HTTP, TLS, TCP, DNS"],a:1,e:"Il faut l'adresse (DNS) pour ouvrir la connexion (TCP), qu'on chiffre (TLS) avant d'y envoyer la requête (HTTP)."},
 {q:"Pendant tout le trajet, quelle adresse source voit le serveur web ?",o:["192.168.1.10","L'adresse publique de la box (ou du CGNAT de l'opérateur)","L'adresse MAC du téléphone"],a:1,e:"Le NAT a remplacé l'adresse privée dès la sortie de la maison."},
 {q:"Le navigateur affiche « Ce site est inaccessible : DNS_PROBE_FINISHED_NXDOMAIN ». À quelle étape cela a-t-il échoué ?",o:["DNS : le nom n'existe pas ou n'a pas pu être résolu","TCP : le serveur a refusé","HTTP : la page n'existe pas"],a:0,e:"NXDOMAIN = « ce nom n'existe pas » : on n'est même pas allé jusqu'au serveur."},
 {r:["DNS → ARP → NAT → routage → TCP → TLS → HTTP.","Chaque étape échoue avec un symptôme qui lui est propre.","Le serveur ne voit que l'adresse publique du NAT."]}
]},

/* ───────────── M8 · Web et sécurité ───────────── */
{id:"r17",t:"HTTP, HTTPS et TLS",cards:[
 {i:"AppWindow",h:"HTTP : une question, une réponse",p:[D(C(P("Requête","b",["GET /api/solde HTTP/1.1","Host: www.exemple.com","Authorization: Bearer …","(corps vide)"]),P("Réponse","g",["HTTP/1.1 200 OK","Content-Type: application/json","Cache-Control: no-store","{\"solde\": 12500}"]))),"[[HTTP]] est le protocole du web et de presque toutes les API. Le client envoie une méthode (GET pour lire, POST pour créer, PUT pour remplacer, DELETE pour supprimer), un chemin et des en-têtes. Le serveur répond par un code, des en-têtes et un contenu.","HTTP ne garde aucune mémoire d'une requête à l'autre : l'identité de l'utilisateur voyage à chaque fois, dans un cookie ou un jeton."]},
 {i:"ListOrdered",h:"Les codes de réponse",p:[D(TB(["Code","Sens","Qui est en cause ?"],[["200, 201","réussi, créé","personne"],["301, 302","redirection vers une autre adresse","personne"],["400","requête mal formée","le client"],["401, 403","non identifié, interdit","le client (droits)"],["404","n'existe pas","le client (adresse)"],["429","trop de requêtes","le client (limite atteinte)"],["500","erreur interne","le serveur"],["502","le proxy a reçu une mauvaise réponse du serveur derrière","le serveur derrière"],["503","service indisponible (surcharge, maintenance)","le serveur"],["504","le proxy n'a pas eu de réponse à temps","le serveur derrière"]],2)),"Le premier chiffre suffit souvent : 4xx, le client a demandé quelque chose de faux ; 5xx, le serveur n'a pas su répondre. Un 502 ou un 504 vient presque toujours d'un intermédiaire (répartiteur, proxy, passerelle d'API) qui n'arrive pas à joindre le serveur derrière lui."]},
 {q:"Une API renvoie 504 Gateway Timeout. Que comprendre ?",o:["Le client a fait une erreur de syntaxe","Un intermédiaire (répartiteur, passerelle) a attendu le serveur derrière lui, sans réponse dans le délai","Le mot de passe est faux"],a:1,e:"504 : l'intermédiaire est joignable, c'est le service derrière qui est trop lent ou injoignable."},
 {i:"LockKeyhole",h:"HTTPS : HTTP dans un tunnel chiffré",p:["Sans chiffrement, n'importe quel équipement sur le chemin (Wi-Fi public, opérateur, routeur compromis) peut lire et modifier les requêtes. [[HTTPS]] place HTTP dans une connexion [[TLS]] : le contenu, le chemin, les en-têtes et les cookies sont illisibles en route.","Ce qui reste visible : les adresses IP, le port, et le nom du site (envoyé en clair au début de la connexion, sauf avec les extensions les plus récentes)."]},
 {i:"Handshake",h:"La négociation TLS",p:[D(F(B("Client","« bonjour, voici ce que je sais faire, et ma part de clé »",'b'),B("Serveur","« voici mon certificat, ma part de clé, et tout est chiffré à partir d'ici »",'v'),B("Client","vérifie le certificat, puis envoie la requête chiffrée",'g'))),"En TLS 1.3, un seul aller-retour suffit. Le client et le serveur s'échangent chacun une moitié de clé ; en les combinant, ils obtiennent une clé secrète commune que personne d'autre ne peut calculer, même en ayant tout écouté. Le certificat prouve que le serveur est bien celui qu'il prétend être."]},
 {i:"IdCard",h:"Le certificat",p:["Le [[Certificat|certificat]] est une carte d'identité du serveur : le nom de domaine, une clé publique, une date d'expiration, et la signature d'une [[Autorité de certification|autorité de certification]] que le navigateur connaît. Le navigateur vérifie trois choses : la signature est valable, le nom correspond au site demandé, la date n'est pas dépassée.","Erreurs classiques : certificat expiré (personne n'a pensé au renouvellement), nom qui ne correspond pas (on appelle le serveur par son adresse IP ou par un autre nom), chaîne incomplète (le serveur n'envoie pas le certificat intermédiaire)."]},
 {q:"Un matin, une API partenaire est rejetée par tous les clients avec une erreur de certificat, alors que rien n'a changé. Quelle cause est la plus probable ?",o:["Une panne de fibre","Le certificat a expiré dans la nuit","Le port 443 a été fermé"],a:1,e:"Un certificat a une date de fin. C'est l'une des pannes les plus fréquentes, et la plus évitable : on surveille les dates d'expiration."},
 {q:"Sur un Wi-Fi public, qu'est-ce qu'un espion peut voir d'une connexion HTTPS ?",o:["Tout, y compris le mot de passe","Les adresses IP, le port et en général le nom du site, mais pas le contenu","Rien du tout"],a:1,e:"Le contenu est chiffré. Les métadonnées de connexion restent visibles."},
 {r:["HTTP : méthode, chemin, en-têtes → code, en-têtes, contenu.","4xx : le client ; 5xx : le serveur ; 502/504 : l'intermédiaire n'a pas eu de bonne réponse.","HTTPS = HTTP dans TLS ; TLS 1.3 en un aller-retour.","Certificat : nom, clé, date, signature ; l'expiration est une panne classique."]}
]},
{id:"r18",t:"Pare-feux, VPN, proxys et répartiteurs",cards:[
 {i:"BrickWall",h:"Le pare-feu : tout est interdit sauf ce qui est permis",p:[D(TB(["N°","Source","Destination","Port","Action"],[["1","10.1.0.0/16","10.30.0.10","TCP 443","autoriser"],["2","10.1.0.0/16","10.30.0.20","TCP 5432","autoriser"],["3","toutes","10.30.0.0/16","TCP 22","refuser"],["…","toutes","toutes","toutes","refuser (par défaut)"]],4)),"Un [[Pare-feu|pare-feu]] lit ses règles dans l'ordre et applique la première qui correspond. La dernière, implicite, refuse tout le reste. Il jette en général le paquet sans répondre : côté client, cela donne un timeout, pas un refus."]},
 {i:"RefreshCcw",h:"Le pare-feu à états",p:["Faut-il une règle pour laisser revenir les réponses ? Non : un [[Pare-feu à états|pare-feu à états]] suit chaque connexion. Il a vu partir le SYN du client vers le port 443 ; il laisse donc passer les réponses de cette connexion-là, et seulement celles-là. C'est le même mécanisme que la table NAT, et les deux fonctions vivent souvent dans le même équipement.","D'où une règle simple pour écrire une demande d'ouverture de flux : on décrit seulement le sens de l'appel (qui appelle qui, sur quel port)."]},
 {q:"Un client joint un serveur sur le port 443 à travers un pare-feu à états. Faut-il une règle pour le trafic de retour ?",o:["Oui, du serveur vers le client sur tous les ports","Non, le pare-feu suit la connexion et laisse passer ses réponses","Oui, une règle ICMP"],a:1,e:"Les réponses d'une connexion autorisée passent automatiquement : on ne décrit que le sens de l'ouverture."},
 {i:"Layers",h:"La DMZ",p:[D(F(B("Internet","",'n'),B("Pare-feu externe","",'r'),B("DMZ","portails, répartiteurs",'o'),B("Pare-feu interne","",'r'),B("Réseau interne","applications, bases",'g'))),"Les serveurs exposés à internet sont placés dans une zone tampon, la [[DMZ]], entre deux pare-feux. Si l'un d'eux est compromis, l'attaquant doit encore franchir le pare-feu interne, qui n'autorise que quelques flux précis vers les applications."]},
 {i:"LockKeyhole",h:"Le VPN : un câble virtuel à travers internet",p:["Un [[VPN]] crée un tunnel chiffré à travers internet. Un poste en déplacement se retrouve « dans » le réseau de l'entreprise, avec une adresse interne ; deux sites, ou une entreprise et sa banque, sont reliés comme par un câble privé (souvent en IPSec, entre pare-feux).","Le tunnel ajoute ses propres en-têtes : la place pour les données diminue (la [[MTU]] effective baisse). Symptôme classique : les petites requêtes passent, les grosses restent bloquées, parce que les gros paquets sont trop grands pour le tunnel."]},
 {i:"Shuffle",h:"Proxy et répartiteur de charge",p:[D(C(P("Proxy (sortant)","v",["devant les clients","filtre et journalise les sorties","le site voit l'adresse du proxy"]),P("Répartiteur / proxy inverse","b",["devant les serveurs","une adresse virtuelle (VIP)","répartit entre plusieurs serveurs","retire ceux qui ne répondent plus"]))),"Un [[Proxy|proxy]] d'entreprise fait les requêtes à la place des postes : il filtre, met en cache, journalise. Un [[Répartiteur de charge|répartiteur de charge]] fait l'inverse, devant les serveurs : le client ne connaît que l'adresse virtuelle ; le répartiteur choisit un serveur en bonne santé, souvent après avoir déchiffré le TLS.","C'est lui qui répond 502 ou 503 quand aucun serveur derrière ne va bien."]},
 {q:"Une demande d'ouverture de flux est faite, mais l'application ne joint toujours pas la base : la connexion part en timeout. Que vérifier en premier ?",o:["Que la règle a été appliquée sur le bon pare-feu, avec les bonnes adresses et le bon port","Le certificat de la base","Le cache DNS du navigateur"],a:0,e:"Un timeout signale un paquet jeté sur le chemin : souvent une règle manquante, incomplète ou sur le mauvais équipement (il y a parfois deux pare-feux à traverser)."},
 {q:"À travers un VPN, la connexion à une application s'établit, les petites pages passent, mais les gros transferts restent bloqués. Que suspecter ?",o:["Un problème de MTU : les gros paquets ne passent pas dans le tunnel","Un mauvais mot de passe","Une panne DNS"],a:0,e:"Le tunnel réduit la taille utile. Si les paquets trop gros sont jetés sans avertissement, seules les petites réponses passent."},
 {r:["Pare-feu : règles lues dans l'ordre, refus par défaut, paquets jetés en silence (timeout).","Pare-feu à états : les réponses d'une connexion autorisée passent seules.","DMZ entre deux pare-feux pour les serveurs exposés.","VPN = tunnel chiffré (attention à la MTU) ; répartiteur = VIP devant plusieurs serveurs."]}
]},

/* ───────────── M9 · Diagnostiquer ───────────── */
{id:"r19",t:"Les outils du diagnostic",cards:[
 {i:"Terminal",h:"ping : est-ce que ça répond ?",p:["[[ping]] envoie des échos ICMP et affiche le temps d'aller-retour ([[RTT]]). Il répond à trois questions : la machine est-elle joignable au niveau IP ? Quelle est la latence ? Y a-t-il des pertes ?","Attention à ses limites : beaucoup de pare-feux bloquent ICMP. Un ping sans réponse ne prouve pas que la machine est éteinte, et un ping qui répond ne prouve pas que le service fonctionne."]},
 {i:"Waypoints",h:"traceroute : par où ça passe ?",p:["[[traceroute]] (tracert sous Windows) envoie des paquets avec un TTL de 1, puis 2, puis 3… Le premier routeur détruit le premier paquet et se dénonce, le deuxième détruit le deuxième, et ainsi de suite. On obtient la liste des routeurs traversés, avec la latence jusqu'à chacun.","Des étoiles (* * *) sur une ligne veulent souvent dire que ce routeur ne répond pas aux traceroutes, pas qu'il est en panne. Ce qui compte : la ligne à partir de laquelle plus rien ne répond, ou à partir de laquelle la latence saute."]},
 {w:"sim_trace"},
 {i:"Search",h:"nslookup, dig : que dit le DNS ?",p:["[[nslookup]] www.exemple.com (ou dig www.exemple.com) montre quelle adresse renvoie le DNS, et quel serveur a répondu. On peut interroger un serveur précis : nslookup www.exemple.com 8.8.8.8. Si la réponse diffère selon le serveur, c'est un problème de cache ou de configuration DNS."]},
 {i:"SquareTerminal",h:"curl, nc : est-ce que le service répond ?",p:["[[curl]] -v https://www.exemple.com/sante montre tout le parcours : l'adresse résolue, la connexion TCP, la négociation TLS et le certificat, puis la requête et le code de réponse. C'est l'outil le plus complet pour tester une API.","Pour tester seulement qu'un port est ouvert : nc -vz 10.30.0.10 5432 (ou Test-NetConnection 10.30.0.10 -Port 5432 sous Windows). La réponse arrive en trois saveurs : succès, refus immédiat, ou timeout."]},
 {i:"ScanSearch",h:"ss et tcpdump : ce qui se passe vraiment",p:["Sur le serveur, ss -ltnp liste les ports en écoute et le programme derrière chacun : on vérifie que le service écoute bien, sur la bonne adresse. ss -tan montre les connexions et leur état.","[[tcpdump]] capture les paquets eux-mêmes : tcpdump -n host 10.1.1.5 and port 443. On voit si le SYN arrive, si une réponse part. C'est l'arbitre final quand chacun accuse l'autre : « le réseau ne m'envoie rien » contre « l'application ne répond pas »."]},
 {q:"ping vers un serveur ne répond pas, mais curl vers son API fonctionne. Que conclure ?",o:["Le serveur est en panne","ICMP est bloqué par un pare-feu, mais le service est joignable","Le DNS est faux"],a:1,e:"ping n'est qu'un test parmi d'autres, et ICMP est souvent filtré. Le test qui compte est celui du service lui-même."},

function mergeState(r){if(!r)return false;var before=JSON.stringify(st);
  Object.keys(r.done||{}).forEach(function(k){if(r.done[k])st.done[k]=true});
  Object.keys(r.pos||{}).forEach(function(k){if(!st.done[k]&&(st.pos[k]||0)<r.pos[k])st.pos[k]=r.pos[k]});
  Object.keys(st.pos).forEach(function(k){if(st.done[k])delete st.pos[k]});
  Object.keys(r.best||{}).forEach(function(k){if(st.best[k]==null||r.best[k]>st.best[k])st.best[k]=r.best[k]});
  (r.days||[]).forEach(function(d){if(st.days.indexOf(d)<0)st.days.push(d)});
  (r.miss||[]).forEach(function(m){if(st.miss.indexOf(m)<0)st.miss.push(m)});
  if((r.xp||0)>st.xp)st.xp=r.xp;if(r.xpInit)st.xpInit=1;
  function dnum(s){if(!s)return 0;var p=s.split('-');return +p[0]*10000+ +p[1]*100+ +p[2]}
  if(dnum(r.last)>dnum(st.last)||(r.last===st.last&&(r.streak||0)>(st.streak||0))){st.last=r.last;st.streak=r.streak||0}
  return JSON.stringify(st)!==before}

function toast(txt,icn){var t=document.createElement('div');t.className='toast';t.innerHTML=ico(icn||'Zap',16)+txt;document.body.appendChild(t);setTimeout(function(){t.remove()},1500)}
function addXP(n){st.xp+=n}
function scoreAnswer(ctx,c,k){var ok=k===c.a,mi=st.miss.indexOf(c.key);
  if(ok){ctx.good++;ctx.combo++;var gain=10+(ctx.combo>1?5:0);addXP(gain);toast('+'+gain+' XP','Zap');if(mi>=0&&ctx.mode!=='lesson')st.miss.splice(mi,1)}
  else{ctx.combo=0;addXP(2);if(mi<0)st.miss.push(c.key)}
  save();return ok}
function qHTML(c,label,ans){var h='<span class="qtag pastel">'+esc(label)+'</span><h2 class="qq">'+rich(c.q)+'</h2><div class="opts">'+c.o.map(function(o,k){var cls='opt';if(ans){if(k===c.a)cls+=' good';else if(k===ans.k)cls+=' bad'}return '<button class="'+cls+'" data-k="'+k+'"'+(ans?' disabled':'')+'>'+rich(o)+'</button>'}).join('')+'</div>';
  h+='<div class="exp'+(ans?' show':'')+'">'+(ans?expHTML(c,ans.ok):'')+'</div>';return h}
function expHTML(c,ok){return '<span class="ei" style="color:'+(ok?'var(--good)':'var(--accent)')+'">'+ico(ok?'CircleCheck':'Lightbulb',20)+'</span><span><b>'+(ok?'Exact.':'Pas tout à fait.')+'</b> '+rich(c.e)+'</span>'}
function bindQ(box,c,ctx,idx,after){[].forEach.call(box.querySelectorAll('.opt'),function(b){b.onclick=function(e){e.stopPropagation();if(ctx.ans[idx])return;var k=+b.dataset.k,ok=scoreAnswer(ctx,c,k);ctx.ans[idx]={k:k,ok:ok};
  [].forEach.call(box.querySelectorAll('.opt'),function(x){x.disabled=true;if(+x.dataset.k===c.a)x.classList.add('good')});if(!ok)b.classList.add('bad');
  var ex=box.querySelector('.exp');ex.innerHTML=expHTML(c,ok);ex.classList.add('show');bindTerms(ex);if(after)after(ok)}})}
function coverHTML(c,small){
  if(typeof c.i==='string'&&c.i.charAt(0)==='#')return '<div class="cover pastel'+(small?' small':'')+'"><span class="dots"></span><span class="bigico"><span class="num">'+c.i.slice(1)+'</span></span></div>';
  return '<div class="cover pastel'+(small?' small':'')+'" aria-hidden="true"><span class="dots"></span><span class="bigico">'+ico(c.i,44,1.7)+'</span></div>'}
function bindTerms(el){[].forEach.call(el.querySelectorAll('.term'),function(t){t.onclick=function(e){e.stopPropagation();showTerm(t.dataset.k)}})}
function finishSession(ctx){var s=ctx.sess,nq=s.cards.filter(function(c){return c.q}).length,firstTime=!st.done[s.key];
  if(firstTime){addXP(30);if(nq&&ctx.good===nq)addXP(20)}
  bump();st.done[s.key]=true;delete st.pos[s.key];save();
  return {nq:nq,L:lvl(st.xp),gained:st.xp-ctx.xp0,up:lvl(st.xp).n>ctx.lv0,nx:s.mod.S[s.mod.S.indexOf(s)+1]||null}}

function start(m,t,sub,canCourse){lastFocusStory=document.activeElement;story.setAttribute('style',hueVars(m));var si=document.getElementById('sIc');si.innerHTML=ico(m.ic,20);si.className='rbtn pastel';si.style.color='var(--deep)';
  document.getElementById('sTitle').innerHTML=esc(t)+'<small>'+esc(sub)+'</small>';comboEl.className='combo';
  document.getElementById('toCourse').classList.toggle('hidden',!canCourse);
  segs.innerHTML=S.cards.map(function(){return '<div class="seg"></div>'}).join('');
  story.classList.remove('hidden');document.body.style.overflow='hidden';
  if(!storyPushed){try{history.pushState({v:'story',from:route},'');storyPushed=true}catch(e){}}
  draw(1);document.getElementById('sClose').focus({preventScroll:true})}
function closeStoryUI(){if(story.classList.contains('hidden'))return;story.classList.add('hidden');document.body.style.overflow='';if(lastFocusStory&&document.body.contains(lastFocusStory))lastFocusStory.focus({preventScroll:true})}
function closeStory(){if(storyPushed){history.back()}else{closeStoryUI();apply(route)}}
document.getElementById('sClose').onclick=closeStory;
document.getElementById('toCourse').onclick=function(){var s=S.sess,k=Math.min(S.idx,S.cards.length-1);C=newCtx(s,'lesson');C.ans=S.ans;C.good=S.good;st.pos[s.key]=Math.max(st.pos[s.key]||0,k);storyPushed=false;closeStoryUI();try{history.replaceState({v:'course',s:s.key},'')}catch(e){}route={v:'course',s:s.key};st.pref='course';save();renderCourse(s);var t=document.getElementById('c'+k);if(t)setTimeout(function(){t.scrollIntoView({block:'start'})},40)};
function go(d){var n=S.idx+d;if(n<0||n>S.cards.length)return;var c=S.cards[S.idx];if(d>0&&c&&c.q&&!S.ans[S.idx])return;S.idx=n;if(S.mode==='lesson'&&S.sess&&n<S.cards.length){st.pos[S.sess.key]=Math.max(st.pos[S.sess.key]||0,n);save()}draw(d)}
var sPrev=document.getElementById('sPrev'),sNext=document.getElementById('sNext'),sCount=document.getElementById('sCount');
sPrev.onclick=function(){go(-1)};sNext.onclick=function(){go(1)};
function navUI(){var c=S.cards[S.idx];sPrev.disabled=S.idx===0;var locked=c&&c.q&&!S.ans[S.idx];sNext.disabled=!c||locked;
  sNext.innerHTML=(S.idx>=S.cards.length-1?'Terminer':'Suivant')+' '+ico('ChevronRight',18);sCount.textContent=Math.min(S.idx+1,S.cards.length)+' / '+S.cards.length;
  document.querySelector('.snav').classList.toggle('hidden',S.idx>=S.cards.length)}
function draw(dir){
  [].forEach.call(segs.children,function(x,i){x.classList.toggle('on',i<=S.idx)});
  card.className='card';void card.offsetWidth;card.className='card '+(dir<0?'bk':'in');card.scrollTop=0;
  if(S.idx>=S.cards.length){navUI();return end()}
  var c=S.cards[S.idx];card.dataset.nav=(c.q||c.w)?'0':'1';
  if(c.q){var qm=S.mode==='lesson'?'Question':'Question '+(S.idx+1)+' / '+S.cards.length+(c.mod&&S.mod&&S.mod.id!==c.mod.id?' · '+c.mod.t:'');
    card.innerHTML='<div class="cbody">'+qHTML(c,qm,S.ans[S.idx])+'</div>';
    bindQ(card,c,S,S.idx,function(ok){comboEl.innerHTML=ico('Flame',14)+' Combo ×'+S.combo;comboEl.className='combo'+(S.combo>1?' on':'');navUI();sNext.focus({preventScroll:true});var ex=card.querySelector('.exp');if(ex.scrollIntoView)ex.scrollIntoView({block:'nearest',behavior:'smooth'})});
  } else if(c.w){card.innerHTML='<div class="cbody">'+widgetHTML(c)+'</div>';bindWidgets(card)}
  else if(c.r){card.innerHTML=coverHTML({i:'ListChecks'},true)+'<div class="cbody"><h2>À retenir</h2><ul class="recap">'+c.r.map(function(x){return '<li><span class="rk">'+ico('Check',14,3)+'</span><span>'+rich(x)+'</span></li>'}).join('')+'</ul></div>'}
  else{var first=S.idx===0;card.innerHTML=coverHTML(c)+'<div class="cbody"><h2>'+rich(c.h)+'</h2>'+c.p.map(function(x){return '<p>'+rich(x)+'</p>'}).join('')+(c.m?'<button class="morebtn">'+ico('ChevronDown',16)+' Aller plus loin</button><div class="more">'+rich(c.m)+'</div>':'')+(first?'<div class="hint">Avance avec Suivant, un glissement ou les flèches du clavier. Les mots en couleur s\'expliquent au toucher.</div>':'')+'</div>'}
  bindTerms(card);navUI();
}
card.addEventListener('click',function(e){
  if(e.target.closest('.term,.opt,.cta,.widget,button,label,input'))return;
  var mb=e.target.closest('.morebtn');if(mb)return;
  if(card.dataset.nav!=='1')return;if(window.getSelection&&String(window.getSelection()).length)return;
  var r=card.getBoundingClientRect();go(e.clientX<r.left+r.width*0.3?-1:1)});
card.addEventListener('click',function(e){var mb=e.target.closest('.morebtn');if(!mb)return;var mo=mb.nextElementSibling;mo.classList.toggle('show');mb.innerHTML=mo.classList.contains('show')?ico('ChevronUp',16)+' Masquer':ico('ChevronDown',16)+' Aller plus loin'},true);
var sx=null,sy=null;card.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
card.addEventListener('touchend',function(e){if(sx==null)return;var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;if(e.target.closest('.widget'))return;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5){go(dx<0?1:-1)}});
addEventListener('keydown',function(e){if(!document.getElementById('scrim').classList.contains('hidden')){if(e.key==='Escape')hideTerm();return}
  if(story.classList.contains('hidden'))return;if(e.key==='Escape')return closeStory();
  if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
function end(){card.dataset.nav='0';comboEl.className='combo';var nq=S.cards.filter(function(c){return c.q}).length,msg,nx=null,r=null;
  if(S.mode==='lesson'){r=finishSession(S);nx=r.nx;msg=S.good===nq?'Sans faute, rien à revoir.':'Tes erreurs t\'attendent dans Révision.'}
  else{bump();if(S.mode==='final'&&S.mod&&(st.best[S.mod.id]==null||S.good>st.best[S.mod.id]))st.best[S.mod.id]=S.good;save();
    msg=S.mode==='review'?'Les questions réussies ont quitté ta liste.':S.good>=Math.ceil(nq*0.85)?'Excellent niveau, c\'est maîtrisé.':S.good>=Math.ceil(nq*0.6)?'Bonne base. Revois les sessions où tu as hésité.':'Reprends les sessions concernées, puis retente.'}
  var L=lvl(st.xp),gained=st.xp-S.xp0,up=L.n>S.lv0,good=!nq||S.good>=Math.ceil(nq*0.6);
  card.className='card in';
  card.innerHTML=coverHTML({i:good?'Trophy':'Target'})+'<div class="cbody end"><h2 style="margin:0">'+(S.mode==='lesson'?'Session terminée':S.mode==='review'?'Révision faite':'Résultat')+'</h2>'+(nq?'<div class="score">'+S.good+'/'+nq+'</div>':'')+'<p style="color:var(--muted);margin:0 0 4px">'+msg+'</p><div class="endstats"><span>'+ico('Zap',15)+' +'+gained+' XP</span><span>'+ico('Flame',15)+' '+st.streak+' jour'+(st.streak>1?'s':'')+'</span><span>'+ico('Award',15)+' Niv. '+L.n+'</span></div>'+(up?'<div class="levelup pastel">'+ico('Trophy',18)+' Nouveau niveau : '+esc(L.name)+' !</div>':'')+(nx?'<button class="cta" id="nxt">Suivante : '+esc(nx.t)+'</button>':'')+'<button class="cta alt" id="rvw">'+ico('ChevronLeft',16)+' Revoir les cartes</button><button class="cta'+(nx?' alt':'')+'" id="bk2">Retour</button></div>';
  document.getElementById('bk2').onclick=function(e){e.stopPropagation();closeStory()};
  document.getElementById('rvw').onclick=function(e){e.stopPropagation();S.idx=0;draw(-1)};
  if(nx)document.getElementById('nxt').onclick=function(e){e.stopPropagation();openSession(nx,0)};
}

var scrim=document.getElementById('scrim'),sheet=document.getElementById('sheet'),lastFocus=null;
function showTerm(k){var g=G[k];if(!g)return;lastFocus=document.activeElement;
  sheet.innerHTML='<div class="grab"></div><span class="cat">'+esc(g.c)+'</span><h3>'+esc(k)+'</h3><p>'+esc(g.d)+'</p>'+(g.a?'<p class="an">'+ico('Lightbulb',15)+' '+esc(g.a)+'</p>':'')+'<button class="cta" id="tok">Compris</button>';
  scrim.classList.remove('hidden');var tk=document.getElementById('tok');tk.focus();tk.onclick=hideTerm}
function hideTerm(){scrim.classList.add('hidden');if(lastFocus)lastFocus.focus({preventScroll:true})}
scrim.addEventListener('click',function(e){if(e.target===scrim)hideTerm()});
try{history.replaceState({v:'home'},'')}catch(e){}render();initSync();

</script>
</body>
</html>
