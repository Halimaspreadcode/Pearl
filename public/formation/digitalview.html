var G={
/* Protocoles */
'SNMP':{c:'Protocole',d:'Simple Network Management Protocol. Le langage standard pour superviser des équipements réseau : on lit leurs valeurs (CPU, état des ports…) et eux peuvent envoyer des alertes. Port 161 côté équipement.',a:'Comme un questionnaire standard que tous les équipements savent remplir.'},
'trap':{c:'Protocole',d:'Un message SNMP envoyé spontanément par un équipement pour signaler un événement (panne, alarme), sans qu\'on lui ait rien demandé. DigitalView reçoit les traps sur le port UDP 10162.',a:'Au lieu d\'attendre qu\'on l\'appelle, l\'équipement sonne à la porte.'},
'SNMPv3':{c:'Protocole',d:'Version sécurisée de SNMP avec authentification et chiffrement. Dans la doc, le mode recommandé est Auth_Priv, avec SHA2_512 pour l\'authentification et AES_256 pour le chiffrement.'},
'Auth_Priv':{c:'Sécurité',d:'Mode de sécurité SNMPv3 le plus fort : les messages sont à la fois authentifiés (on sait qui parle) et chiffrés (personne ne peut lire).'},
'SFTP':{c:'Protocole',d:'SSH File Transfer Protocol. Transfert de fichiers sécurisé, passant par un canal SSH chiffré. DigitalView l\'utilise pour les fichiers nord (performance, logs, topologie) et pour les sauvegardes.',a:'Un camion blindé pour les fichiers.'},
'FTPS':{c:'Protocole',d:'FTP sécurisé par TLS. Autre façon de transférer des fichiers de manière chiffrée, proposée comme alternative à SFTP pour l\'interface nord.'},
'FTP':{c:'Protocole',d:'File Transfer Protocol, l\'ancien protocole de transfert de fichiers, non chiffré. Ses versions sécurisées sont SFTP et FTPS.'},
'SSH':{c:'Protocole',d:'Secure Shell. Connexion à distance chiffrée à un serveur pour taper des commandes. Port 22. C\'est ce que tu utilises avec PuTTY pour te connecter en sysomc.',a:'Un tunnel privé vers le clavier d\'un serveur distant.'},
'HTTPS':{c:'Protocole',d:'Le protocole du web, chiffré par TLS. Tu accèdes à l\'interface DigitalView en HTTPS depuis ton navigateur, par défaut sur le port 31943.'},
'TLS':{c:'Sécurité',d:'Transport Layer Security. La couche de chiffrement utilisée par HTTPS, FTPS, etc. Si TLS 1.2 n\'est pas activé dans le navigateur, la page DigitalView peut refuser de s\'ouvrir.'},
'NTP':{c:'Protocole',d:'Network Time Protocol. Synchronise l\'horloge de toutes les machines sur une source commune. Sans NTP, les heures des alarmes et des logs ne concordent plus.'},
'LDAP':{c:'Protocole',d:'Protocole d\'annuaire. Permet à DigitalView d\'utiliser les comptes de l\'annuaire central du client pour l\'authentification (IF5).',a:'Le registre central des employés, consulté à chaque entrée.'},
'SSO':{c:'Sécurité',d:'Single Sign-On. Un seul login pour accéder à plusieurs systèmes. Dans DigitalView : via CAS ou SAML (IF6). À ne pas combiner avec l\'authentification LDAP selon la doc.'},
'CAS':{c:'Protocole',d:'Central Authentication Service. Un protocole de SSO : un serveur central valide ton identité pour les autres applications.'},
'SAML':{c:'Protocole',d:'Security Assertion Markup Language. Autre protocole de SSO basé sur des jetons XML signés.'},
'SMTP':{c:'Protocole',d:'Simple Mail Transfer Protocol. Le protocole d\'envoi d\'e-mails. DigitalView l\'utilise pour envoyer les notifications d\'alarmes par mail (IF8).'},
'SMPP':{c:'Protocole',d:'Short Message Peer-to-Peer. Le protocole pour envoyer des SMS via un centre SMS (SMSC). Utilisé pour les notifications SMS (IF7).'},
'SMSC':{c:'Réseau',d:'Short Message Service Center. Le serveur de l\'opérateur qui achemine les SMS.'},
'REST':{c:'Protocole',d:'Style d\'API web : on appelle des URL en HTTP(S) pour lire ou modifier des données (souvent en JSON). DigitalView expose des interfaces REST au nord et en utilise au sud.',a:'Un guichet où chaque URL est un service.'},
'OpenAPI':{c:'Protocole',d:'API ouvertes et documentées que des systèmes tiers peuvent appeler (IF4), par exemple un VNFM.'},
'SOAP':{c:'Protocole',d:'Ancien format d\'API web basé sur XML, encore utilisé par certains équipements pour la supervision sud.'},
'MML':{c:'Protocole',d:'Man-Machine Language. Le langage de commandes Huawei pour piloter les équipements télécoms (commandes du type LST, MOD…). DigitalView a un MML Center.'},
'JDBC':{c:'Protocole',d:'Java Database Connectivity. La façon dont un programme Java se connecte à une base de données. Utilisé pour superviser Oracle, MySQL, GaussDB.'},
'IPMI':{c:'Protocole',d:'Intelligent Platform Management Interface. Permet de gérer un serveur physique au niveau matériel (alimentation, capteurs), même OS éteint. Port 623.'},
'Syslog':{c:'Protocole',d:'Standard pour envoyer des logs vers un serveur central. DigitalView peut transférer ses logs (sécurité, opération, système) vers un serveur Syslog en UDP, TCP ou TLS.'},
'socket':{c:'Réseau',d:'Une connexion réseau directe entre deux programmes (IP + port). L\'interface nord peut envoyer les alarmes en temps réel via socket.'},
'TCP':{c:'Réseau',d:'Protocole de transport fiable : chaque paquet est confirmé. Utilisé par SSH, HTTPS, SFTP.'},
'UDP':{c:'Réseau',d:'Protocole de transport rapide mais sans confirmation. Utilisé par SNMP et les traps. Un trap perdu en UDP n\'est pas renvoyé.'},
'port':{c:'Réseau',d:'Un numéro qui identifie un service sur une machine. Exemples : 22 = SSH, 161 = SNMP, 623 = IPMI, 31943 = interface web DigitalView.',a:'L\'IP est l\'adresse de l\'immeuble, le port est le numéro de l\'appartement.'},
'ping':{c:'Commande',d:'Commande qui envoie un petit paquet (ICMP) pour tester si une machine répond. « Request timed out » = pas de réponse ; « Destination host unreachable » = pas de route.'},
'floating IP':{c:'Réseau',d:'IP flottante. Une adresse partagée par deux nœuds d\'un cluster : elle est portée par le nœud actif et « saute » sur le standby en cas de bascule. On se connecte toujours via elle.'},
/* Réseau & télécom */
'NE':{c:'Concept',d:'Network Element. Tout élément supervisé : serveur, VM, base de données, switch, application… L\'unité de base gérée par DigitalView.'},
'MO':{c:'Concept',d:'Managed Object. Un objet géré par le système de supervision. Dans la pratique, souvent synonyme de NE dans les pages d\'alarmes.'},
'NMS':{c:'Concept',d:'Network Management System. Un système de supervision. « Upper-layer NMS » = le système au-dessus de DigitalView, à qui il rend compte (côté nord).'},
'EMS':{c:'Concept',d:'Element Management System. Un système qui gère un type d\'équipement. DigitalView joue ce rôle pour ses NE.'},
'OMC':{c:'Concept',d:'Operation and Maintenance Center. Centre d\'exploitation d\'un équipement ou d\'un réseau.'},
'NBI':{c:'Concept',d:'Northbound Interface. L\'interface « nord » : ce que DigitalView envoie vers le NMS du dessus (alarmes, fichiers de performance, logs, MO, comptes).'},
'SBI':{c:'Concept',d:'Southbound Interface. L\'interface « sud » : comment DigitalView parle aux équipements supervisés.'},
'pull':{c:'Concept',d:'Mode où le NMS du dessus vient chercher lui-même les fichiers sur DigitalView (il est client SFTP).'},
'push':{c:'Concept',d:'Mode où DigitalView dépose lui-même les fichiers chez le NMS du dessus (DigitalView est client SFTP).'},
'VM':{c:'Infra',d:'Virtual Machine. Un ordinateur simulé par logiciel sur un serveur physique. Plusieurs VM partagent une même machine hôte.'},
'BMS':{c:'Infra',d:'Bare Metal Server. Un serveur physique utilisé directement, sans couche de virtualisation.'},
'NFV':{c:'Infra',d:'Network Functions Virtualization. Faire tourner les fonctions réseau comme logiciels sur des serveurs standard, au lieu de boîtiers dédiés.'},
'VNF':{c:'Infra',d:'Virtualized Network Function. Une fonction réseau en version logicielle (sur VM ou conteneur). Son équivalent matériel est la PNF.'},
'PNF':{c:'Infra',d:'Physical Network Function. Une fonction réseau réalisée par un équipement physique dédié.'},
'VNFM':{c:'Infra',d:'VNF Manager. Le système qui déploie et gère le cycle de vie des VNF. DigitalView peut s\'y connecter (IF4).'},
'NFVO':{c:'Infra',d:'NFV Orchestrator. L\'orchestrateur global des fonctions virtualisées, au-dessus des VNFM.'},
'Kubernetes':{c:'Infra',d:'K8s. La plateforme qui orchestre des conteneurs : elle les lance, les redémarre et les répartit sur des nœuds. DigitalView peut être déployé en conteneurs et superviser des clusters K8s.'},
'pod':{c:'Infra',d:'La plus petite unité dans Kubernetes : un ou plusieurs conteneurs qui tournent ensemble. Commande utile : kubectl get pods -owide -n dv-server.'},
'container':{c:'Infra',d:'Conteneur. Une application empaquetée avec tout ce dont elle a besoin, isolée des autres. Plus léger qu\'une VM.'},
'load balancer':{c:'Réseau',d:'Répartiteur de charge. Il distribue les requêtes entrantes entre plusieurs serveurs pour qu\'aucun ne sature.',a:'Le vigile qui oriente chaque client vers le guichet le moins chargé.'},
'NSLB':{c:'Réseau',d:'Le service de répartition de charge (load balancer) de la plateforme DigitalFoundry, successeur du SLB. Dans la doc, il apparaît dans des alarmes liées aux certificats et à l\'espace disque (/run). Son composant s\'appuie sur nginx.'},
'SLB':{c:'Réseau',d:'Server Load Balancer. Ancien répartiteur de charge, remplacé par le NSLB sur DigitalFoundry.'},
'nginx':{c:'Infra',d:'Serveur web et proxy très répandu, souvent utilisé comme répartiteur de charge ou porte d\'entrée HTTPS.'},
'DigitalFoundry':{c:'Huawei',d:'Plateforme Huawei (PaaS) qui héberge et gère le cycle de vie des applications. DigitalView peut s\'y connecter pour synchroniser les NE.'},
'HVS':{c:'Huawei',d:'Hybrid Video Solution. Solution vidéo Huawei, supervisée par DigitalView.'},
'CBS':{c:'Huawei',d:'Convergent Billing System. Solution Huawei de facturation convergente. Certaines fonctions AIOps ne s\'appliquent qu\'à CBS et MM.'},
'4A':{c:'Sécurité',d:'Account, Authentication, Authorization, Audit. Plateforme centrale de gestion des comptes et des accès chez l\'opérateur. DigitalView peut s\'y interconnecter (DVMaintenance).'},
/* Composants DigitalView */
'UniEP':{c:'DigitalView',d:'CloudSOP-UniEP, le Management plane. Il gère DigitalView lui-même : installation, sauvegarde/restauration, santé des nœuds et des bases, collecte d\'infos de panne. Ce n\'est pas lui qui supervise tes NE.'},
'CloudSOP':{c:'DigitalView',d:'Le socle cloud de Huawei sur lequel DigitalView est bâti : bus, messages, tâches planifiées, certificats, bases de données, module d\'alarmes.'},
'UniAgent':{c:'DigitalView',d:'L\'agent installé sur les machines supervisées. Il remonte alarmes et performances, et exécute les commandes et scripts envoyés par DigitalView. Processus normaux : Uni-Agent, Watchdog (+ flume et workbench si installés).'},
'DMU':{c:'DigitalView',d:'Device Management Unit. Le module qui dialogue avec les équipements et les agents. Dans le paramétrage d\'un NE, le « Med Gateway » est le nom du DMU (ex. DMU1). Les UniAgent s\'y connectent sur le port 31360.'},
'OMU':{c:'DigitalView',d:'Operation and Maintenance Unit. Module central de System Monitoring qui pilote les DMU. Alarme associée : ALM-440066001 OMU Disconnected from DMU.'},
'Med Node':{c:'DigitalView',d:'Le nœud de médiation (DVMediation). Par lui transitent les notifications venant des NE (alarmes, effacements) et les commandes envoyées vers eux.'},
'UOA':{c:'DigitalView',d:'Unified O&M Agent. Un agent de supervision utilisé par certains NE Huawei pour se connecter à DigitalView.'},
'System Monitoring':{c:'DigitalView',d:'La partie « supervision de base » de DigitalView (ex-I2000) : ressources, alarmes, performance, topologie, NBI. Ses processus se gèrent avec startapp, stopapp, p.'},
'I2000':{c:'DigitalView',d:'L\'ancien nom du moteur de supervision de DigitalView. On le retrouve dans les chemins ($I2000_HOME) et la commande i2kadm.'},
'HOFS':{c:'DigitalView',d:'Le stockage de fichiers distribué du socle cloud. Les fichiers nord y sont stockés (nbibucket).'},
'MQS':{c:'DigitalView',d:'Message Queue Service. Le service de messagerie du socle, basé sur Kafka. S\'il tombe, les alarmes et performances ne circulent plus.'},
'Kafka':{c:'Infra',d:'Une file de messages à très haut débit. Les microservices s\'y déposent et s\'y lisent des messages. Si les consommateurs ne suivent pas, les messages s\'empilent (LAG).',a:'Un tapis roulant de colis : si personne ne les prend, ils s\'accumulent.'},
'LAG':{c:'Infra',d:'Dans Kafka, le nombre de messages en attente pas encore lus par un consommateur. Un LAG qui grandit = un traitement qui ne suit pas.'},
'Elasticsearch':{c:'Infra',d:'Moteur de recherche et d\'analyse pour de gros volumes de données (logs). DigitalView l\'utilise (DVElasticsearch/OpenSearch) pour l\'O&M avancée.'},
'Flume':{c:'Infra',d:'Outil de collecte et d\'acheminement de logs. Utilisé par le service LMStreaming pour les logs de call chain et tracing.'},
'Zookeeper':{c:'Infra',d:'Service de coordination entre composants distribués (qui est actif, configurations partagées). Ses fichiers de données corrompus causent des pannes de services.'},
'Redis':{c:'Infra',d:'Base de données en mémoire, très rapide, utilisée pour du cache.'},
'GaussDB':{c:'Infra',d:'La base de données relationnelle de Huawei, utilisée par DigitalView pour stocker ses données. Répertoire typique : /opt/zenith.'},
'Jetty':{c:'Infra',d:'Serveur web Java utilisé par System Monitoring. Trop de threads Jetty (plus de 100) peut provoquer une erreur 502.'},
'502':{c:'Web',d:'Erreur HTTP « Bad Gateway » : la porte d\'entrée web n\'arrive pas à joindre le service derrière. Pour DigitalView, souvent un processus System Monitoring arrêté.'},
'DVEngineeringService':{c:'DigitalView',d:'Le service d\'ingénierie de System Monitoring (assets, configuration, comptes). L\'arrêter ailleurs que par UniEP, la console ou i2kadm stop déclenche ALM-505001305.'},
'iCnfg':{c:'DigitalView',d:'L\'outil de gestion de configuration de DigitalView (versions, tâches, verrous de configuration).'},
'infocollect':{c:'Commande',d:'Commande (infocollect.sh) qui collecte les logs de diagnostic selon le scénario de panne. Fichiers produits par défaut dans /opt/oss/infocollect/data_log.'},
/* Concepts O&M */
'O&M':{c:'Concept',d:'Operations and Maintenance. Exploitation et maintenance : tout ce qui fait tourner un système au quotidien.'},
'AIOps':{c:'Concept',d:'Artificial Intelligence for IT Operations. Utiliser l\'IA (apprentissage sur l\'historique) pour détecter, corréler et prédire les problèmes.'},
'KPI':{c:'Performance',d:'Key Performance Indicator. Un indicateur qui résume la qualité d\'un service. Ex. : taux de succès d\'envoi SMS = (total − échecs réseau − échecs utilisateur) / total.'},
'counter':{c:'Performance',d:'Compteur de mesure. Une valeur brute mesurée, par exemple l\'usage CPU. Plusieurs counters se combinent pour faire un KPI.'},
'measurement unit':{c:'Performance',d:'Unité de mesure. Un groupe de counters liés (ex. trafic entrant) avec leurs objets mesurés et leur période de collecte.'},
'measurement object':{c:'Performance',d:'Objet mesuré. Ce qu\'on mesure : une carte, un port, un CPU précis, une tablespace…'},
'threshold':{c:'Performance',d:'Seuil. Si une mesure dépasse (ou passe sous) le seuil, DigitalView lève une alarme de dépassement (threshold-crossing alarm).'},
'rmuid':{c:'DigitalView',d:'Identifiant unique d\'une ressource dans DigitalView. Supprimer puis reconnecter un NE change son rmuid.'},
'DN':{c:'DigitalView',d:'Distinguished Name. L\'identifiant hiérarchique d\'un NE. S\'il dépasse 128 caractères, les données de performance peuvent ne pas s\'afficher.'},
'DR':{c:'Fiabilité',d:'Disaster Recovery. Un site de secours distant qui peut reprendre le service si le site principal tombe (bascule, takeover).'},
'active-active':{c:'Fiabilité',d:'Deux sites actifs en même temps qui se partagent le travail. Certaines fonctions (comme Message Trace) y sont masquées ou limitées.'},
'two-node cluster':{c:'Fiabilité',d:'Cluster à deux nœuds, un actif et un standby. En cas de panne de l\'actif, le standby prend le relais (switchover).'},
'switchover':{c:'Fiabilité',d:'Bascule volontaire ou automatique du nœud actif vers le standby.'},
'HA':{c:'Fiabilité',d:'High Availability, haute disponibilité : l\'architecture est conçue pour qu\'une panne unique n\'arrête pas le service.'},
'backup':{c:'Fiabilité',d:'Sauvegarde. Dans DigitalView : OS, applications et données produit, envoyés vers un serveur de sauvegarde en SFTP.'},
'SLA':{c:'Concept',d:'Service Level Agreement. Contrat de niveau de service qui fixe les délais et engagements de support.'},
'iCare':{c:'Huawei',d:'Le portail Huawei pour ouvrir des demandes de support et des demandes de changement (change request).'},
'certificate':{c:'Sécurité',d:'Certificat numérique : une carte d\'identité électronique qui prouve l\'identité d\'un serveur et permet le chiffrement. Il a une date d\'expiration.'},
'CRL':{c:'Sécurité',d:'Certificate Revocation List. La liste des certificats révoqués avant leur date d\'expiration.'},
'license':{c:'Concept',d:'Licence. Fichier qui autorise les fonctions, la capacité et la durée d\'utilisation du système. Liée à l\'ESN.'},
'ESN':{c:'Concept',d:'Equipment Serial Number. Le numéro unique auquel une licence est rattachée.'},
'baseline':{c:'Sécurité',d:'Configuration de référence attendue. La vérification de configuration de sécurité compare l\'état réel à cette baseline.'},
'RBAC':{c:'Sécurité',d:'Contrôle d\'accès basé sur les rôles : on donne des permissions à un rôle, puis on rattache les utilisateurs au rôle.'},
/* Linux */
'root':{c:'Linux',d:'Le super-administrateur Linux, avec tous les droits. Sur un système durci, on ne s\'y connecte pas directement : on se connecte en sysomc puis on bascule (su - root).'},
'sysomc':{c:'Linux',d:'L\'utilisateur de maintenance de l\'hôte, celui avec lequel on se connecte en SSH avant de basculer vers ossuser ou root.'},
'ossuser':{c:'Linux',d:'L\'utilisateur qui installe, fait tourner et met à niveau System Monitoring. C\'est lui qui lance startapp, stopapp, p.'},
'ossadm':{c:'Linux',d:'L\'utilisateur de gestion de la plateforme (management). Il exécute ipmc_adm pour démarrer ou vérifier les services. Si son mot de passe expire, UniEP perd la supervision.'},
'inode':{c:'Linux',d:'L\'entrée qui décrit un fichier sur le disque. On peut manquer d\'inodes (trop de petits fichiers) même avec de l\'espace libre.'},
'LVM':{c:'Linux',d:'Logical Volume Manager. Gère les disques en volumes logiques : PV (disques physiques) → VG (groupe) → LV (volume monté). Commandes : vgs, lvs, vgchange.'},
'swap':{c:'Linux',d:'Espace disque utilisé comme mémoire de secours quand la RAM est pleine. La doc demande au moins 8 Go sur SUSE.'},
'core dump':{c:'Linux',d:'Fichier écrit quand un processus plante, qui contient l\'état de sa mémoire. Utile pour l\'analyse, mais il prend de la place.'},
'kill -9':{c:'Linux',d:'Commande qui tue un processus brutalement, sans lui laisser le temps de s\'arrêter proprement. Interdite sur DigitalView en production.'},
'JVM':{c:'Infra',d:'Java Virtual Machine. Le moteur qui exécute les programmes Java. Beaucoup de services DigitalView en sont.'},
'Full GC':{c:'Infra',d:'Full Garbage Collection : la JVM s\'arrête pour nettoyer toute sa mémoire. Des Full GC fréquents signalent souvent une fuite mémoire.'},
'DST':{c:'Temps',d:'Daylight Saving Time, l\'heure d\'été. Les heures qui « sautent » peuvent faire manquer des alarmes dans une recherche par heure NE.'},
'UTC':{c:'Temps',d:'Temps universel coordonné. Le serveur d\'alarmes travaille en UTC en interne, puis affiche en heure locale.'},
'CPU':{c:'Infra',d:'Le processeur. Un usage CPU élevé et durable ralentit tout le système.'},
'crontab':{c:'Linux',d:'Planificateur de tâches Linux. Ajouter une tâche non validée est une opération à risque.'},
'tcpdump':{c:'Linux',d:'Outil de capture de paquets réseau. Opération à risque « Major » : il dégrade les performances et remplit le disque.'}
 ,'sandbox':{c:'DigitalView',d:'Bac à sable : environnement isolé dans lequel l\'UniAgent exécute les scripts personnalisés. Pas de réseau, lecture seule sur une liste de dossiers (config_monitor_custom.cfg).'}
 ,'pré-vérification':{c:'DigitalView',d:'Script optionnel lancé avant le script principal d\'une alarme ou d\'un KPI personnalisé. Il doit répondre true ou false. Disponible à partir de V800R024C30.'}
 ,'measUnit':{c:'Performance',d:'Dans un script de KPI personnalisé, l\'ID de l\'unité de mesure. Il doit être identique au Task ID de la tâche de collecte.'}
 ,'JSON':{c:'Web',d:'Format de données texte avec des paires clé : valeur entre accolades. Les scripts personnalisés renvoient leur résultat en JSON.'}
 ,'Top N':{c:'Dashboard',d:'Vue qui classe les N éléments ayant les plus fortes valeurs (5 à 100), en tableau, barres ou courbe.'}
 ,'honeycomb':{c:'Dashboard',d:'Vue en nid d\'abeille : des hexagones regroupés par catégorie ou indicateur pour comparer d\'un coup d\'œil.'}
 ,'drilldown':{c:'Dashboard',d:'Clic sur une valeur d\'une vue qui ouvre une autre vue ou page (ex. alarmes courantes) avec le bon filtre.'}
 ,'period-on-period':{c:'Performance',d:'Comparaison d\'une valeur avec celle d\'une période passée (période, jour, semaine, mois), en % ou en différence.'}
};
var M1=[
{id:'o1',t:'C\'est quoi DigitalView ?',cards:[
 {i:'Satellite',h:'Une tour de contrôle',p:['DigitalView est une solution d\'[[O&M]] centralisée pour les produits logiciels Huawei et la solution vidéo [[HVS]], en cloud comme hors cloud.','Un seul endroit pour <b>voir</b>, <b>comprendre</b> et <b>réparer</b> tout un parc de logiciels, serveurs, [[VM]] et équipements réseau.']},
 {i:'Plane',h:'L\'image à garder',p:['Pense à la tour de contrôle d\'un aéroport.','Elle ne pilote pas les avions : les [[NE]] font leur travail. Elle les voit tous, reçoit leurs alertes, suit leur trajet et coordonne la réaction.']},
 {q:'Dans cette image, les « avions » sont…',o:['Les équipes O&M','Les éléments supervisés (NE)','Les clients finaux'],a:1,e:'Un NE, c\'est tout ce qui est supervisé : serveur, VM, base de données, application, switch.'},
 {i:'Flame',h:'Avant : le pompier',p:['L\'O&M passive : on attend la panne, puis on court.','Beaucoup de manuel, des alertes ratées ou fausses, des pannes qu\'on ne voit pas venir.']},
 {i:'Stethoscope',h:'Après : le médecin',p:['L\'O&M proactive : on repère les signaux faibles, on prédit, on répare automatiquement.','L\'objectif final affiché par Huawei : une O&M <b>entièrement automatisée</b>.']},
 {i:'BrainCircuit',h:'Son carburant',p:['Le big data et l\'[[AIOps]].','Surveillance intelligente, analyse, localisation de panne : le but est d\'améliorer l\'efficacité et de réduire les coûts d\'O&M.']},
 {q:'Quel est l\'objectif de fond de DigitalView ?',o:['Remplacer le NMS de l\'opérateur','Passer d\'une O&M passive à proactive, puis automatique','Facturer les services'],a:1,e:'Toutes les fonctions servent ce passage : moins subir, plus anticiper.'},
 {i:'Puzzle',h:'Base + options',p:['DigitalView fournit une supervision de base, plus des fonctions <b>optionnelles</b> : analyse O&M, service assurance, AIOps.','Selon le site et la licence, tu n\'auras pas forcément tous les menus.'],m:'Certaines fonctions ne s\'appliquent qu\'à certaines solutions. Par exemple, la corrélation d\'anomalies ne concerne que [[CBS]] et MM, et l\'évaluation de capacité intelligente BES et MM.'},
 {i:'Map',h:'Sa place dans le réseau',p:['Au-dessus : le [[NMS]] de l\'opérateur, auquel DigitalView rend compte.','En dessous : les NE métier, les [[VNF]]/[[PNF]], les NE radio et cœur de réseau.','À côté : le [[NFVO]] dans les scénarios [[NFV]].']},
 {q:'Le « NMS du dessus » (upper-layer NMS), c\'est…',o:['Le système auquel DigitalView rend compte','Un NE supervisé par DigitalView','La base de données interne'],a:0,e:'DigitalView supervise ses NE et remonte ce qu\'il voit au NMS du dessus.'},
 {i:'Target',h:'Les scénarios couverts',p:['Installation et mise en service, maintenance courante, dépannage, upgrade, extension de capacité.','Avec un accès sécurisé : droits par rôle, par domaine, et données chiffrées.']},
 {r:['DigitalView = O&M centralisée pour les produits logiciels Huawei et HVS.','Objectif : O&M passive → proactive → automatique.','NE = tout élément supervisé. NMS du dessus = celui à qui on rend compte.','Des fonctions de base, et des options selon licence et solution.']}
]},
{id:'o2',t:'Les 5 familles de fonctions',cards:[
 {i:'Hand',h:'Cinq familles',p:['Toutes les fonctions se rangent en 5 familles.','Moyen mnémo : <b>Voir, Comprendre, Réparer, Anticiper, Protéger</b>.']},
 {w:'families'},
 {i:'Eye',h:'1. Surveiller',p:['<b>System monitoring</b>, le socle.','Équipements, ressources, alarmes, performance, topologie, configuration, message tracing, notifications, interface nord, sécurité.']},
 {i:'Search',h:'2. Analyser',p:['<b>O&M analysis</b> : comprendre ce qui se passe à l\'intérieur.','Service de logs, call chain, service tracing, tests automatiques (cloud automated testing).']},
 {q:'Tu fouilles des millions de lignes de logs. Quelle famille ?',o:['Surveiller','Analyser','Protéger'],a:1,e:'Le Log service appartient à O&M analysis.'},
 {i:'Wrench',h:'3. Réparer',p:['<b>Service assurance</b> : agir vite et à distance.','Flow orchestration, Workbench, collecte d\'informations de panne.']},
 {i:'Zap',h:'Flow orchestration',p:['Certaines pannes se règlent toujours par la même procédure.','On associe la procédure à l\'alarme : quand l\'alarme arrive, la procédure se lance seule. Diagnostic et auto-réparation <b>en minutes</b>.']},
 {i:'MousePointerClick',h:'Workbench',p:['Exécuter des commandes et scripts <b>en masse, en un clic</b>, à distance, sur une interface graphique.','Pratique pour les tâches répétitives sur beaucoup de VM.']},
 {q:'Une alarme déclenche seule son processus de réparation. Quelle fonction ?',o:['Workbench','Flow orchestration','Call chain'],a:1,e:'Flow orchestration (service DVIhealing). Le Workbench, c\'est toi qui lances.'},
 {i:'Sparkles',h:'4. Anticiper',p:['<b>AIOps Service</b> : surveillance sans humain.','Détection d\'anomalies, compression d\'alarmes, corrélation d\'anomalies, prédiction de tendances.']},
 {i:'ShieldCheck',h:'5. Protéger',p:['<b>Security O&M</b>.','Situational awareness : détecter les menaces sur les assets. Configuration check : comparer la config réelle à une [[baseline]].']},
 {q:'Regrouper automatiquement des alarmes en incidents, c\'est…',o:['Alarm compression (Anticiper)','Workbench (Réparer)','Topologie (Surveiller)'],a:0,e:'Alarm compression utilise des règles pour transformer beaucoup d\'alarmes en quelques incidents, dans le bon ordre de traitement.'},
 {r:['Surveiller = System monitoring. Analyser = O&M analysis.','Réparer = Service assurance (Flow orchestration, Workbench, Fault info collection).','Anticiper = AIOps. Protéger = Security O&M.','Flow orchestration se déclenche seule, le Workbench c\'est toi.']}
]},
{id:'o3',t:'L\'architecture en immeuble',cards:[
 {i:'Building',h:'Un immeuble à étages',p:['L\'architecture logique est faite de couches.','Chaque étage s\'appuie sur celui du dessous. On monte de la cave au toit.']},
 {w:'building'},
 {i:'BrickWall',h:'Fondations',p:['<b>Infrastructure</b> : le cloud et le système d\'exploitation sur lesquels DigitalView est installé.']},
 {i:'Pipette',h:'Plomberie',p:['<b>Socle cloud</b> ([[CloudSOP]]) : bus, messages, tâches planifiées, certificats, environnement microservices et base de données.','Services : CRON (planification), HRS (relais HTTP), FEBS, RHM, [[MQS]] (messages).']},
 {i:'Plug',h:'Câblage',p:['<b>Couche driver</b> : relie DigitalView aux équipements.','DVMediation (médiation sud), DVNats (messagerie légère), DVController (pipelines de fichiers et de tâches), DVOMA, DVFoundation, DVElasticsearch.']},
 {q:'DVMediation sert à…',o:['Envoyer des SMS','Dialoguer avec les équipements (sud)','Faire tourner l\'IA'],a:1,e:'Couche driver = câblage. DVMediation est la médiation sud : c\'est par elle que passent les données des NE.'},
 {i:'Handshake',h:'Services partagés',p:['<b>Couche services communs</b> : ce dont tous les métiers ont besoin.','DVEAM (ressources), DVCommon (accès base, etc.), DVSolution (personnalisation produit), DVSM (sécurité).']},
 {i:'Briefcase',h:'Bureaux métiers',p:['<b>Couche services de domaine</b>, le cœur, en trois blocs.','<b>Monitoring</b> : DVEngineeringServicePackage, DVAlarm, DVTopo, DVPM.','<b>Assurance</b> : DVMaintenance, DVWorkbench, DVIhealing, DVInfocollect.','<b>Analyse</b> : DVCallchain, DVCat, DVLogmatrix, DVLogtrace, DVLogmatrixStreaming, DVAnalysisEngine (AIOps).']},
 {i:'AppWindow',h:'Vitrine',p:['<b>Couche applicative</b> : ce qu\'on voit.','DVDashboard (tableaux de bord), DVNBI (interface nord), packages de développement spécifique.']},
 {q:'DVAlarm, DVTopo et DVPM sont dans…',o:['Les services de domaine (Monitoring)','Le socle cloud','La couche driver'],a:0,e:'Alarmes, topologie, performance : les trois piliers de la supervision.'},
 {i:'KeyRound',h:'Le syndic : Management plane',p:['[[UniEP]] gère <b>DigitalView lui-même</b> : point d\'entrée unique, surveillance de ses nœuds, sauvegarde et restauration, installation, maintenance.','Ce n\'est <b>pas</b> lui qui supervise tes NE.']},
 {i:'ShieldCheck',h:'Le gardien : Security plane',p:['Gestion des [[certificate|certificats]] et situational awareness de sécurité.']},
 {i:'RadioTower',h:'Les capteurs : Agents',p:['[[UniAgent]] + plug-ins de collecte, installés côté machines supervisées.','Ils remontent alarmes et performances et exécutent les commandes et scripts envoyés.']},
 {q:'Qui gère la sauvegarde de DigitalView lui-même ?',o:['DVAlarm','CloudSOP-UniEP','UniAgent'],a:1,e:'Le Management plane administre la plateforme, pas les NE.'},
 {r:['Du bas vers le haut : infrastructure → socle cloud → driver → services communs → services de domaine → applicatif.','Management plane (UniEP) = gère DigitalView lui-même.','Security plane = certificats et situational awareness.','Agents (UniAgent) = capteurs chez les NE.']}
]},
{id:'o4',t:'Les 5 déploiements',cards:[
 {i:'Package',h:'Même produit, 5 tailles',p:['Deux questions décident : <b>quelle capacité ?</b> et <b>besoin de haute disponibilité ([[HA]]) ?</b>','Tous les modes supportent IPv4, IPv6 et le double stack.']},
 {w:'deploy'},
 {i:'Box',h:'All-In-One',p:['Tout sur un seul nœud : monitoring, analyse, assurance, AIOps, sécurité, UniEP, base.','Pour les petits sites sans exigence locale de haute dispo. Si le nœud tombe, tout tombe.'],m:'En All-In-One, la doc précise que l\'OS n\'a pas besoin d\'être sauvegardé.'},
 {i:'FlaskConical',h:'Multi-Node Single-Server',p:['Un nœud par fonction, mais un seul exemplaire de chaque.','Pour les démos et tests compétitifs. Pas de redondance.']},
 {q:'Petit site, pas besoin de haute dispo. Quel mode ?',o:['Cluster','All-In-One','Large-Capacity'],a:1,e:'All-In-One : compact, sans redondance.'},
 {i:'Repeat',h:'Cluster',p:['Redondance : System Monitoring ≥ 2, Data Service ≥ 2, O&M Analysis ≥ 2, Security ≥ 2, Service Assurance ≥ 1, AIOps ≥ 1.','Pour les nouveaux déploiements et upgrades avec exigence de fiabilité.']},
 {i:'Building2',h:'Large-Capacity',p:['Pour les très gros sites.','Clusters dédiés en plus : Performance ≥ 2, [[Elasticsearch|Esearch]] ≥ 3, [[Flume]] ≥ 2, Security ≥ 2, Advanced O&M ≥ 2.']},
 {i:'Puzzle',h:'Merge Cluster',p:['3 nœuds qui portent chacun plusieurs services.','Petit budget, co-déploiement [[BMS]], machines physiques.']},
 {q:'Où Esearch et Flume ont-ils leurs propres clusters ?',o:['Merge Cluster','Large-Capacity','Cluster'],a:1,e:'Seulement en Large-Capacity, parce que le volume le justifie.'},
 {i:'FolderArchive',h:'Qui tourne où ?',p:['Monitoring Service : DVEngineeringServicePackage, DVAlarm, DVTopo, DVPM, DVDashboard, DVNBI.','Database Service : DVIpModify, DVZookeeper, DVMaintenance (interconnexion [[4A]]).','Cloud-based : CRON, HRS, HOFS, MQS, OMMHA (seulement en [[two-node cluster]]).']},
 {q:'OMMHA n\'est déployé que…',o:['En All-In-One','Dans un cluster à deux nœuds','Sur les agents'],a:1,e:'OMMHA gère la haute disponibilité entre les deux nœuds d\'un two-node cluster.'},
 {r:['All-In-One : petit site, zéro redondance.','Multi-Node Single-Server : démo, zéro redondance.','Cluster : redondance ≥ 2 sur les fonctions clés.','Large-Capacity : clusters dédiés Performance, Esearch, Flume.','Merge Cluster : 3 nœuds fusionnés, économique.']}
]},
{id:'o5',t:'Les interfaces IF1 à IF9',cards:[
 {i:'Compass',h:'Nord et sud',p:['DigitalView a 9 interfaces.','Repère clé : <b>sud = on écoute les équipements</b>, <b>nord = on rend compte au système du dessus</b>.']},
 {w:'compass'},
 {i:'Laptop',h:'IF1 : toi',p:['Accès utilisateur en [[HTTPS]] depuis un navigateur.','Port par défaut : <b>31943</b>. Navigateurs : Chrome 118+, Firefox ESR 115.4+, Edge 100+.']},
 {i:'ArrowUpFromLine',h:'IF2 : le nord',p:['Vers le [[NMS]] du dessus.','Alarmes en [[SNMP]] ou [[socket]]. Fichiers de performance, logs, topologie et comptes en [[SFTP]]. API [[REST]]. Commandes reçues en [[SSH]]. Logs en [[Syslog]].']},
 {q:'DigitalView remonte ses alarmes au NMS. Quelle interface ?',o:['IF9','IF2','IF1'],a:1,e:'Nord = vers le haut = IF2 (SNMP ou socket pour les alarmes).'},
 {i:'Timer',h:'IF3 : l\'horloge',p:['Synchronisation [[NTP]].','Sans heure commune, impossible de remettre alarmes et logs dans le bon ordre. Plusieurs cas de panne de la doc viennent d\'un écart d\'heure.']},
 {i:'Handshake',h:'IF4 : systèmes tiers',p:['Intégration en HTTPS via [[OpenAPI]], par exemple avec un [[VNFM]].']},
 {i:'LockKeyhole',h:'IF5 et IF6 : l\'identité',p:['<b>IF5</b> : [[LDAP]], vers le centre de sécurité du client pour centraliser comptes et authentification.','<b>IF6</b> : [[SSO]] ([[CAS]]/[[SAML]]) avec les autres systèmes O&M.']},
 {i:'Mail',h:'IF7 et IF8 : prévenir',p:['<b>IF7</b> : SMS via [[SMPP]] et le [[SMSC]].','<b>IF8</b> : e-mail via [[SMTP]].']},
 {i:'ArrowDownToLine',h:'IF9 : le sud',p:['Vers les équipements supervisés : applications, plateformes, middleware, équipements physiques, VNF/PNF.','Protocoles : [[SSH]], [[SNMP]], [[REST]], [[SOAP]], [[MML]], [[SFTP]]… Alarmes et performances.']},
 {q:'Un switch envoie un trap SNMP à DigitalView. Quelle interface ?',o:['IF2','IF9','IF5'],a:1,e:'Ça vient d\'un équipement supervisé : c\'est le sud, IF9.'},
 {i:'Package',h:'Pull ou push ?',p:['Pour les fichiers nord, deux modes.','[[pull|Pull]] : le NMS vient chercher les fichiers. [[push|Push]] : DigitalView les dépose chez lui.'],m:'En pull, le NMS est client SFTP/FTPS et se connecte à DigitalView. En push, DigitalView devient client et se connecte au NMS. Seuls les utilisateurs avec droits SFTP/FTPS peuvent récupérer les fichiers.'},
 {r:['IF1 HTTPS (31943) = toi. IF3 NTP = l\'heure.','IF2 = nord (SNMP, socket, SFTP, REST, SSH, Syslog).','IF9 = sud (SSH, SNMP, REST, SOAP, MML, SFTP).','IF5 LDAP, IF6 SSO, IF7 SMS, IF8 mail, IF4 OpenAPI.']}
]},
{id:'o6',t:'Le voyage d\'une alarme',cards:[
 {i:'Luggage',h:'Suivons une alarme',p:['Pour tout comprendre, suivons une alarme de sa naissance à ton écran.','Tu vas croiser les briques techniques clés de DigitalView.'],m:'C\'est un chemin simplifié, reconstitué à partir de plusieurs pages de la doc (agents, DMU, effacement via Med Node, dépendance à Kafka). Le détail exact varie selon le type de NE.'},
 {i:'Bomb',h:'1. Le problème',p:['Sur un serveur supervisé, le disque se remplit.','L\'[[UniAgent]] installé sur ce serveur le détecte.']},
 {i:'RadioTower',h:'2. L\'agent remonte',p:['L\'UniAgent envoie l\'info vers le [[DMU]] (Device Management Unit), qui gère le dialogue avec les agents.','Les UniAgent s\'y connectent sur le port 31360.'],m:'Un équipement réseau sans agent envoie plutôt un [[trap]] SNMP, reçu par DigitalView sur le port UDP 10162.'},
 {i:'Shuffle',h:'3. La médiation',p:['Le [[Med Node]] (DVMediation) reçoit et normalise l\'info.','C\'est le traducteur entre les NE et le reste du système.']},
 {i:'Inbox',h:'4. La file de messages',p:['Le message passe par [[Kafka]] (le service [[MQS]]).','Si Kafka tombe, les nouvelles alarmes ne s\'affichent plus : c\'est l\'alarme ALM-505005324.']},
 {q:'Kafka est en panne. Quel effet visible ?',o:['Plus aucune connexion SSH','Les nouvelles alarmes n\'apparaissent plus','La licence expire'],a:1,e:'Alarmes, performance et nord dépendent de Kafka.'},
 {i:'Calculator',h:'5. Le module d\'alarmes',p:['Le module d\'alarmes de [[CloudSOP]] applique les règles : masquage, corrélation, agrégation…','Puis l\'alarme est stockée en base ([[GaussDB]]).']},
 {i:'Monitor',h:'6. Ton écran',p:['L\'alarme apparaît dans Current Alarms, avec couleur et son selon sa sévérité.','Elle peut aussi partir par SMS/mail, et vers le NMS du dessus via le nord.']},
 {i:'Repeat',h:'Le retour',p:['Quand le disque est nettoyé, le NE envoie une notification d\'effacement, par le même chemin via le Med Node.','L\'alarme passe à « cleared ».']},
 {q:'Dans quel ordre passe l\'alarme ?',o:['UniAgent → DMU → Med Node → Kafka → module d\'alarmes','Kafka → UniAgent → écran','UniEP → DVNBI → UniAgent'],a:0,e:'Agent, gestion des agents, médiation, file de messages, traitement. Retiens ce chemin : il guide tout le dépannage.'},
 {r:['Chemin : NE/UniAgent → DMU (31360) → Med Node → Kafka/MQS → module d\'alarmes → base → écran.','Traps SNMP reçus sur UDP 10162.','Kafka en panne = plus de nouvelles alarmes.','Pour dépanner, remonte ce chemin maillon par maillon.']}
]}
];
var M2=[
{id:'a1',t:'Alarme, événement, sévérité',cards:[
 {i:'Siren',h:'Deux types de notifications',p:['Quand un système ou un [[MO]] détecte une exception ou un changement important, il envoie une notification.','Elle arrive soit comme <b>alarme</b>, soit comme <b>événement</b>.']},
 {i:'CircleAlert',h:'L\'alarme',p:['Il y a une exception ou une panne.','Elle <b>doit être traitée</b>, sinon le service sera impacté. On peut l\'acquitter et l\'effacer.']},
 {i:'CircleDot',h:'L\'événement',p:['Le système tourne normalement, il informe d\'un changement.','Pas besoin de le traiter : il sert à analyser et localiser. On ne peut <b>ni l\'acquitter ni l\'effacer</b>.']},
 {q:'Une bascule de cluster réussie génère plutôt…',o:['Une alarme de panne','Un événement','Une alarme Critical'],a:1,e:'Tout s\'est bien passé : c\'est une information, donc un événement. La doc cite justement la bascule réussie comme exemple.'},
 {i:'Siren',h:'Critical',p:['Le service est touché.','Réparation <b>immédiate</b>, sinon interruption du service ou crash du système.']},
 {i:'OctagonAlert',h:'Major',p:['Le service est touché.','Réparation rapide, sinon des services importants seront affectés.']},
 {i:'CircleAlert',h:'Minor',p:['Impact faible sur le service.','Il faut trouver la cause et corriger avant que ça s\'aggrave.']},
 {i:'Info',h:'Warning',p:['Un risque potentiel ou imminent est détecté, mais le service n\'est pas encore touché.','On corrige selon l\'état du réseau et du NE.']},
 {w:'severity'},
 {q:'Le service est touché et une interruption est possible si on attend. Sévérité ?',o:['Warning','Minor','Critical'],a:2,e:'Critical = service touché, action immédiate. Major = service touché, action rapide.'},
 {i:'Palette',h:'Sévérité modifiable, mais…',p:['Tu peux redéfinir la sévérité, le type et même le nom d\'une alarme dans DigitalView.','Ces changements <b>ne sont pas envoyés au NE</b>. Ils ne modifient que l\'affichage côté DigitalView.']},
 {i:'Volume2',h:'Chaque sévérité a sa couleur et son son',p:['Sons par défaut : Critical.mp3, Major.mp3, Minor.mp3, Warning.mp3.','Tu peux aussi définir un son pour une alarme précise (Sound by alarm name).'],m:'Sur Chrome, le son peut ne pas jouer tant que tu n\'as pas cliqué sur la page : le navigateur bloque la lecture automatique. Sur Firefox, après avoir coupé le son, fais F5.'},
 {r:['Alarme = panne, à traiter, acquittable et effaçable.','Événement = information, ni acquittable ni effaçable.','Critical et Major : service touché. Minor : impact faible. Warning : risque sans impact.','Redéfinir sévérité ou nom ne change rien côté NE.']}
]},
{id:'a2',t:'Les statuts d\'une alarme',cards:[
 {i:'Tag',h:'Quatre étiquettes à la fois',p:['Chaque alarme porte en même temps :','un statut d\'<b>acquittement</b>, d\'<b>effacement</b>, de <b>maintenance</b> et de <b>validité</b>.']},
 {i:'Hand',h:'Acquitter',p:['Acquitter = dire « je m\'en occupe ».','Ton nom s\'affiche dans <b>Acknowledged By</b>. Ça évite que deux personnes traitent la même alarme.']},
 {i:'RefreshCcw',h:'Désacquitter',p:['Si l\'alarme doit être reprise par un collègue, ou traitée plus tard, on la désacquitte.','Elle redevient « Unacknowledged ». On peut aussi désigner un <b>Handler</b> précis.']},
 {q:'L\'ingénieur B veut traiter une alarme acquittée par A. Il…',o:['Ne peut rien faire','La désacquitte, puis la prend','L\'efface directement'],a:1,e:'C\'est exactement le cas prévu par la doc.'},
 {i:'CircleCheck',h:'Effacer',p:['Cleared = la panne à l\'origine de l\'alarme est réparée.','Une alarme effacée a un <b>fond vert</b> dans la liste.']},
 {i:'FolderArchive',h:'Courante ou historique ?',p:['Une alarme devient <b>historique</b> seulement si elle est <b>acquittée ET effacée</b>.','Sont courantes : non acquittée + non effacée, acquittée + non effacée, non acquittée + effacée.']},
 {w:'status'},
 {q:'Une alarme effacée mais pas acquittée est…',o:['Historique','Courante','Masquée'],a:1,e:'Il faut les deux conditions pour passer en historique.'},
 {i:'Hammer',h:'Maintenance',p:['Pour les alarmes générées pendant des travaux, pas par une vraie panne.','Valeurs : <b>INSTALL</b>, <b>EXPAND</b>, <b>UPGRADE</b>, <b>TESTING</b>. Sinon : NORMAL.']},
 {i:'Ban',h:'Validité',p:['Une alarme jugée inutile par expérience peut être marquée <b>invalid</b>.','Ensuite, tu filtres les alarmes en maintenance ou invalides pour te concentrer sur l\'essentiel.']},
 {q:'Pendant un upgrade, des alarmes attendues arrivent. Meilleur réflexe ?',o:['Les passer en Critical','Les marquer en maintenance (UPGRADE), idéalement par une règle d\'identification','Les effacer à la main une par une'],a:1,e:'Une règle d\'identification le fait automatiquement pour toutes les alarmes concernées. Attention, elle ne s\'applique qu\'aux alarmes reçues après son activation.'},
 {i:'ClipboardList',h:'Les 5 pages d\'alarmes',p:['<b>Current Alarms</b> : le temps réel. <b>Historical Alarms</b> : acquittées et effacées.','<b>Alarm Logs</b> : courantes + historiques, avec filtres. <b>Masked Alarms</b> : les masquées conservées. <b>Event Logs</b> : les événements.'],m:'Par défaut, 20 000 lignes maximum s\'affichent. Au-delà, affine les filtres. Les nouvelles alarmes arrivent en gras. Tu ne vois que les alarmes des MO sur lesquels tu as des droits.'},
 {r:['Acquitter = je m\'en occupe (Acknowledged By).','Historique = acquittée ET effacée. Tout le reste est courant.','Maintenance : INSTALL, EXPAND, UPGRADE, TESTING.','Invalid = jugée inutile. On filtre les deux.']}
]},
{id:'a3',t:'Effacer : ADAC ou ADMC',cards:[
 {i:'Eraser',h:'Qui efface l\'alarme ?',p:['Quand la panne est réparée, deux cas.','Soit le système efface seul, soit c\'est à toi de le faire.']},
 {i:'Bot',h:'ADAC',p:['<b>Auto Detected, Auto Cleared</b>.','Le système détecte la panne et sa réparation. Une notification d\'effacement arrive seule.']},
 {i:'Hand',h:'ADMC',p:['<b>Auto Detected, Manually Cleared</b>.','La panne est détectée automatiquement, mais une fois réparée, <b>aucun effacement n\'est envoyé</b>. Tu vérifies, puis tu effaces à la main.']},
 {q:'Une alarme reste affichée alors que la panne est réparée. Cause la plus probable ?',o:['C\'est une ADMC','C\'est un événement','Le NE est en Warning'],a:0,e:'C\'est la réponse de la FAQ officielle « Why cannot current alarms be automatically cleared? ».'},
 {i:'RadioTower',h:'L\'effacement automatique',p:['Le NE réparé envoie une notification via le [[Med Node]].','Le module d\'alarmes CloudSOP la reçoit, l\'alarme passe à « Cleared », puis si elle est acquittée, elle part en historique. L\'écran se met à jour.']},
 {i:'Pointer',h:'L\'effacement manuel',p:['Tu cliques sur Clear. DigitalView prépare la demande, la transmet au module CloudSOP, qui passe par une sonde (Probe) et le Med Node pour envoyer une <b>commande d\'effacement au NE</b>.','Utile aussi si la notification auto s\'est perdue à cause du réseau.']},
 {q:'Quand tu effaces manuellement une alarme, que se passe-t-il côté NE ?',o:['Rien, c\'est seulement visuel','Une commande d\'effacement lui est envoyée','Il redémarre'],a:1,e:'Contrairement à la redéfinition de sévérité, l\'effacement manuel envoie une commande au NE.'},
 {i:'Fingerprint',h:'Qui a effacé ?',p:['<b>&lt;NE operator&gt;</b> : effacée automatiquement après réparation.','<b>&lt;System operator&gt;</b> : traitée par une règle système (cache plein, auto-acquittement).','Un nom d\'utilisateur : quelqu\'un l\'a fait à la main.']},
 {i:'SquarePlus',h:'Événement → alarme ADMC',p:['Un événement important peut être converti en <b>alarme ADMC</b> par une règle.','Il apparaît dans Current Alarms, et doit être effacé à la main.']},
 {q:'Tu veux voir un certain événement dans les alarmes courantes. Que fais-tu ?',o:['Une règle « Set events as ADMC alarms »','Une règle de masquage','Tu redéfinis sa sévérité'],a:0,e:'Le seul moyen de faire apparaître un événement dans Current Alarms.'},
 {r:['ADAC = s\'efface seule. ADMC = effacement manuel obligatoire.','Effacement auto : NE → Med Node → module CloudSOP.','Effacement manuel : commande envoyée jusqu\'au NE.','<NE operator> = auto. <System operator> = règle système.']}
]},
{id:'a4',t:'Les règles anti-bruit',cards:[
 {i:'BellOff',h:'Trop d\'alarmes tue l\'alarme',p:['Des centaines d\'alarmes cachent la vraie panne.','DigitalView propose des règles pour ne garder que l\'essentiel. Chemin : Monitor > Alarms > Alarm Settings.'],m:'Point commun de presque toutes les règles : elles ne s\'appliquent qu\'aux alarmes reçues <b>après</b> leur activation. Les anciennes ne sont pas retraitées.'},
 {i:'EyeOff',h:'Masquage (masking)',p:['Cache les alarmes prévisibles pendant maintenance, tests, déploiement.','Deux choix : <b>Discard</b> (jetées, même pas stockées) ou <b>afficher dans Masked Alarms</b> (conservées et exportables).']},
 {q:'Tu masques des alarmes en « Discard ». Peux-tu les exporter ensuite ?',o:['Oui, depuis Masked Alarms','Non, elles n\'ont pas été stockées','Oui, depuis Event Logs'],a:1,e:'Discard = jetées. Pour garder une trace, choisis « Displayed on Masked Alarms ». Et les événements masqués sont toujours jetés.'},
 {i:'Network',h:'Corrélation',p:['Une alarme <b>racine</b> en provoque d\'autres, dites <b>corrélatives</b>.','Tu filtres les corrélatives et tu traites la racine.'],m:'Jusqu\'à 1 000 règles personnalisées. Les règles par défaut peuvent être activées ou désactivées, mais pas modifiées ni supprimées. Une alarme générée plus de 30 minutes avant d\'arriver ne correspond à aucune règle de corrélation.'},
 {i:'Zap',h:'Intermittent',p:['L\'alarme apparaît puis s\'efface en moins de la période définie.','Elle est jetée ou masquée. Conséquence : une alarme peut arriver <b>en retard</b>, le temps de voir si elle s\'efface.']},
 {q:'Période intermittente de 30 s. Une alarme apparaît et s\'efface au bout de 10 s. Que se passe-t-il ?',o:['Elle s\'affiche puis passe en historique','Elle est jetée ou masquée','Elle devient Critical'],a:1,e:'Effacée avant 30 s = intermittente. Si elle avait duré plus de 30 s, elle aurait été remontée, avec 30 s de retard.'},
 {i:'Repeat',h:'Toggling',p:['La même alarme, depuis la même source, revient un nombre de fois défini sur une période.','Actions possibles : créer une alarme de toggling, une <b>avalanche (ALM-132)</b>, ou changer la sévérité de l\'originale.'],m:'Quand le toggling s\'arrête (condition de fin atteinte), l\'alarme de toggling ou d\'avalanche s\'efface seule. Si l\'originale n\'est pas effacée, la dernière occurrence est remontée.'},
 {i:'Library',h:'Agrégation',p:['Même alarme (même ID), même source, plusieurs fois dans une période.','Regroupées en une seule. Filtre « Aggregated alarms » pour ne voir que l\'essentiel.']},
 {i:'Hash',h:'Fusion (merging)',p:['Mécanisme natif sur Current Alarms : les alarmes aux champs identiques (localisation, ID) sont fusionnées.','La colonne <b>Occurrences</b> dit combien de fois. Clique dessus pour voir l\'alarme fusionnée et les originales.']},
 {q:'Différence entre agrégation et fusion ?',o:['Aucune','L\'agrégation est une règle configurée ; la fusion est automatique sur la page Current Alarms','La fusion supprime les alarmes'],a:1,e:'La fusion ne concerne que l\'affichage des alarmes courantes. L\'agrégation est une règle que tu crées.'},
 {i:'Tag',h:'Identification et redéfinition',p:['<b>Identification</b> : marque automatiquement en maintenance ou invalid.','<b>Redéfinition</b> : change sévérité, type ou nom (affichage seulement).','<b>Severity improvement</b> : monte la sévérité des alarmes trop fréquentes, jamais effacées ou jamais acquittées.'],m:'Pour Severity improvement, la doc déconseille de l\'appliquer aux alarmes de seuil et à toutes les sources à la fois. Au-delà de 50 alarmes par seconde, la capacité de traitement est dépassée.'},
 {i:'ArrowUpFromLine',h:'Filtrage nord',p:['Décide quelles alarmes partent vers le NMS du dessus, pour ne pas le noyer.','Maximum 200 règles.']},
 {q:'Un lien tombe et 40 alarmes suivent. Quelle règle t\'aide à voir la cause ?',o:['Masquage','Corrélation','Filtrage nord'],a:1,e:'La corrélation relie les alarmes à leur racine : tu traites 1 alarme au lieu de 40.'},
 {r:['Masquage : Discard (perdues) ou Masked Alarms (gardées).','Corrélation : racine vs corrélatives.','Intermittent : disparaît vite → jetée ; peut retarder l\'affichage.','Toggling : revient trop souvent → avalanche ALM-132.','Agrégation (règle) ≠ fusion (Occurrences, automatique).','Les règles ne s\'appliquent qu\'aux nouvelles alarmes.']}
]},
{id:'a5',t:'Tempêtes et débordements',cards:[
 {i:'Waves',h:'La tempête d\'alarmes',p:['Le nombre d\'alarmes courantes a une limite.','En approchant, DigitalView a plusieurs mécanismes de protection. Les connaître évite de perdre des alarmes importantes.']},
 {i:'TrendingUp',h:'ALM-157',p:['« The Number of Current Alarms Reaches the Threshold ».','Levée à <b>85 %</b> de la capacité par défaut, effacée sous <b>80 %</b>. Seuil réglable dans Current Alarm Threshold Warning.']},
 {i:'Package',h:'Le cache plein',p:['À la limite, le système convertit des alarmes courantes en <b>historiques</b>.','Ordre : d\'abord les alarmes en maintenance, puis les normales. Dans chaque groupe : effacées + acquittées, puis effacées + non acquittées, puis ADMC acquittées non effacées. Les plus anciennes d\'abord.'],m:'Il traite au plus 30 000 alarmes par passe, ou s\'arrête quand on redescend à 90 % de la limite. En distribué, il commence par le nœud qui a le plus d\'alarmes. Les alarmes déplacées affichent &lt;System operator&gt;.'},
 {q:'Tu vois ALM-157. Que faire ?',o:['Rien, c\'est informatif','Traiter et nettoyer les alarmes courantes avant que le cache plein déplace des alarmes','Redémarrer DigitalView'],a:1,e:'ALM-157 est un avertissement : il t\'invite à agir avant le mécanisme automatique.'},
 {i:'CircleCheck',h:'Auto-acquittement',p:['Une règle acquitte automatiquement les alarmes <b>déjà effacées</b>.','Elles partent en historique et libèrent de la place. Elle ne touche que les alarmes non acquittées et effacées.']},
 {i:'Pipette',h:'ALM-999999998',p:['« Alarm Reaches Flow control threshold », <b>Critical</b>.','La file d\'attente des alarmes a atteint sa longueur max (30 000 par défaut, réglable de 10 000 à 100 000). Vérification toutes les 15 minutes.','Impact : canal bloqué, alarmes <b>jetées</b>.'],m:'Attention, la doc utilise aussi l\'ID 999999998 pour une autre alarme, dans le chapitre Licence : « The license sales item usage reaches or exceeds the threshold 100% » (Major, licence 3.00). Regarde toujours le nom de l\'alarme, pas seulement son ID.'},
 {i:'Mountain',h:'ALM-132 et ALM-832',p:['<b>ALM-132 Avalanche</b> : générée par une règle de toggling quand une alarme revient trop souvent.','<b>ALM-832 Parallel Alarm Exceeds the Limit</b> : plusieurs alarmes identiques en peu de temps, agrégées par une règle.','<b>ALM-100901, 102100–102599</b> : alarmes agrégées, l\'ID dépend de la sévérité.']},
 {q:'ALM-999999998 est levée. Quel est le vrai risque ?',o:['Des alarmes sont jetées et le canal est bloqué','La licence expire','Le NMS du dessus se déconnecte'],a:0,e:'C\'est pour ça qu\'elle est Critical : tu peux perdre des alarmes.'},
 {i:'Smartphone',h:'Notification de tempête',p:['SMS et mail quand le nombre d\'alarmes dépasse un seuil, pour tout le système ou un NE.','Maximum 100 règles.']},
 {i:'Turtle',h:'Délais en tempête',p:['En tempête, l\'[[UniAgent]] ralentit volontairement sa collecte (ajustement dynamique, puis contrôle de flux).','Résultat : le délai de remontée des alarmes augmente. C\'est un mécanisme de protection.']},
 {i:'Stethoscope',h:'ALM-100007',p:['« Abnormal Alarm Service Health Check », Major.','Anomalie dans le traitement du cache plein, le dump d\'alarmes ou la création automatique de nouvelles tables d\'historique.']},
 {r:['ALM-157 : 85 % levée, 80 % effacée.','Cache plein : déplace vers l\'historique, maintenance et effacées d\'abord.','ALM-999999998 : file pleine (30 000), alarmes jetées. Critical.','ALM-132 avalanche (toggling), ALM-832 parallèles (agrégation).','En tempête, l\'UniAgent ralentit volontairement.']}
]},
{id:'a6',t:'Au quotidien',cards:[
 {i:'Compass',h:'Les chemins à connaître',p:['<b>Monitor > Alarms > Current Alarms</b> : le temps réel.','<b>Monitor > Alarms > Alarm Settings</b> : règles, notifications, personnalisation, diagnostic, expérience, synchronisation.']},
 {i:'Search',h:'Détails d\'une alarme',p:['Sélectionne une alarme et ouvre ses détails.','Tu y trouves le nom, la localisation, les paramètres et surtout les <b>suggestions de traitement</b> et l\'expérience partagée par l\'équipe.']},
 {i:'Mail',h:'Notifications',p:['Deux étapes : configurer d\'abord l\'envoi (System Management > System Settings > Notifications : serveur SMS, modem, mail), puis créer des règles de notification.','Des modèles définissent le contenu des SMS et mails.']},
 {q:'Tes règles de notification n\'envoient rien. Premier point à vérifier ?',o:['La sévérité des alarmes','La configuration SMS/mail dans System Settings > Notifications','La topologie'],a:1,e:'C\'est un prérequis explicite : sans serveur SMS ou mail configuré, aucune règle ne peut envoyer.'},
 {i:'Ticket',h:'Work orders',p:['DigitalView peut créer des tickets dans un système de work orders connecté, à la main ou par règle.','Il faut la permission Alarm WorkOrder et un système de tickets interfacé. Alarme en cas de souci : ALM-505030000.']},
 {i:'NotebookPen',h:'Capitaliser',p:['Après une résolution, enregistre ton <b>expérience</b> (Alarm Settings > Experience).','Elle apparaît dans les détails de l\'alarme pour tous. Jusqu\'à 10 000 fiches.']},
 {i:'Plug',h:'Après une coupure',p:['Un système déconnecté n\'a pas pu envoyer ses alarmes.','Une fois reconnecté, lance une <b>synchronisation manuelle</b> (Alarm Settings > Alarm Synchronization). Il existe aussi une synchro planifiée.']},
 {q:'Un NE revient après 2 h de coupure. Que fais-tu ?',o:['Rien','Une synchronisation manuelle des alarmes','Un dump'],a:1,e:'La synchro rattrape les alarmes manquées. À noter : ces alarmes rattrapées ne passent pas par les règles intermittent/toggling si elles ont plus de 30 minutes.'},
 {i:'Search',h:'Alarme introuvable ?',p:['Deux causes classiques (FAQ officielle) :','un <b>filtre</b> ou modèle de filtre actif sur la page, ou une <b>règle de masquage</b>.']},
 {i:'Clock',h:'Les pièges d\'heure',p:['Le serveur d\'alarmes travaille en [[UTC]] et affiche en heure locale.','Recherche par heure NE pendant le passage à l\'heure d\'été ([[DST]]) : certaines alarmes peuvent manquer.','Si l\'heure du NE diffère de plus de 30 min (même fuseau), DigitalView recale l\'heure d\'occurrence.']},
 {i:'Database',h:'Gérer les données',p:['<b>Dump</b> : déplace les vieilles alarmes hors de la base (supprimées de la base, lisibles dans un fichier).','<b>Export</b> : copie pour audit, sans supprimer.','Planifiés dans System > Task Management.']},
 {q:'Dump ou export : lequel supprime les alarmes de la base ?',o:['Le dump','L\'export','Aucun'],a:0,e:'Le dump libère de la place. L\'export garde tout en base et crée une copie.'},
 {i:'ScanSearch',h:'Alarm Diagnosis',p:['Alarm Settings > Alarm Diagnosis diagnostique pourquoi un NE n\'arrive pas à remonter ses alarmes.','Il peut aussi nettoyer les alarmes empilées sur le NMS ou un agent.']},
 {r:['Détails d\'alarme = suggestions de traitement + expérience.','Notifications : configurer le canal d\'abord, les règles ensuite.','Après coupure : synchronisation manuelle.','Introuvable : filtre ou masquage.','Dump supprime de la base, export copie.']}
]}
];
var M3=[
{id:'r1',t:'Les ressources',cards:[
 {i:'Boxes',h:'Tout est ressource',p:['DigitalView traite applications, stockage, serveurs, équipements réseau et [[VM]] comme des <b>ressources</b>.','Un modèle unique pour les surveiller et les maintenir : c\'est plus simple.']},
 {i:'BookOpen',h:'Le vocabulaire',p:['<b>Ressource</b> : tout ce qui est géré. <b>[[NE]]</b> : entité matérielle + logicielle.','<b>Subnet</b> : un sous-réseau logique (par région, par type). <b>Device</b> : un équipement physique (IP, port, login). <b>Group</b> : des objets regroupés et confiés à un utilisateur.']},
 {i:'Factory',h:'Physique ou applicatif',p:['<b>Physical Resource</b> : salles, baies, châssis, cartes, serveurs, stockage, switchs, firewalls, routeurs.','<b>Application Resource</b> : serveurs Linux, bases Oracle/MySQL/GaussDB, [[Kubernetes]], [[VNFM]], DigitalFoundry, clusters VCS/HACMP…']},
 {q:'Tu veux connecter une base Oracle. Où vas-tu ?',o:['Physical Resource','Application Resource','Asset Center'],a:1,e:'Une base de données est une ressource applicative (Resource > Resource Management > Application Resource).'},
 {i:'Plug',h:'Connecter un NE : les paramètres',p:['Avant de connecter, on collecte : l\'IP, le <b>Med Gateway</b> (le nom du [[DMU]], ex. DMU1), le subnet, et les accès.','La doc recommande de garder les valeurs par défaut quand c\'est possible, pour une connexion automatique.']},
 {i:'KeyRound',h:'Les accès typiques',p:['[[SSH]] : port 22, utilisateur [[sysomc]] pour un serveur Linux.','[[SNMP]] : port 161, mode [[Auth_Priv]], SHA2_512 et AES_256.','[[IPMI]] : port 623 pour les serveurs rack.','[[JDBC]] : port de la base (ex. 1536 pour Oracle dans l\'exemple).']},
 {q:'Un serveur rack Huawei se supervise au niveau matériel via…',o:['IPMI (623) et SNMP (161)','LDAP','SMTP'],a:0,e:'IPMI accède au matériel même OS éteint, SNMP remonte l\'état et les alarmes.'},
 {i:'FlaskConical',h:'Le test de connectivité',p:['Sur la page de modification d\'un NE, le bouton <b>Connectivity Test</b> vérifie que les paramètres d\'accès marchent.','C\'est le premier réflexe quand un NE est « Offline ».']},
 {i:'RefreshCcw',h:'Synchronisation de ressources',p:['DigitalView peut synchroniser automatiquement les NE depuis DigitalFoundry, Kubernetes ou un VNFM.','Les tâches de synchro ont leur page de suivi : un échec partiel est visible ici.']},
 {i:'TriangleAlert',h:'Le piège du rmuid',p:['Supprimer puis reconnecter un NE change son [[rmuid]] (identifiant unique).','Conséquence : l\'historique et les liens peuvent ne plus correspondre. Évite les suppressions par erreur.']},
 {i:'Tag',h:'Asset Center',p:['Gestion des actifs : import, export, modification en masse, accès NE.','<b>Lifespan management</b> : suivi de la fin de vie des produits. Des alarmes préviennent (ALM-505005320 approche de fin de vie, ALM-505005321 expiré).']},
 {r:['Tout est ressource : physique ou applicative.','Connexion : IP, Med Gateway (DMU), subnet, accès.','SSH 22, SNMP 161 (Auth_Priv), IPMI 623.','Connectivity Test = premier réflexe.','Supprimer/reconnecter un NE change son rmuid.']}
]},
{id:'r2',t:'La performance',cards:[
 {i:'ChartColumn',h:'À quoi ça sert',p:['Mesurer, collecter et analyser l\'état des NE sur la durée.','Pour détecter les pannes potentielles, planifier et optimiser.']},
 {i:'BrickWall',h:'Les briques',p:['<b>[[measurement unit|Measurement unit]]</b> : un groupe de mesures liées (ex. trafic entrant).','<b>[[measurement object|Measurement object]]</b> : ce qu\'on mesure (un CPU, un port, une tablespace).','<b>[[counter|Counter]]</b> : la valeur mesurée (usage CPU).']},
 {q:'« CPU numéro 2 » et « usage CPU » : lequel est l\'objet, lequel le counter ?',o:['CPU 2 = objet, usage = counter','CPU 2 = counter, usage = objet','Les deux sont des KPI'],a:0,e:'L\'objet dit QUI on mesure, le counter dit QUOI.'},
 {i:'AlarmClock',h:'Période de collecte',p:['L\'intervalle entre deux mesures. À 5 minutes, DigitalView relève les counters toutes les 5 minutes.']},
 {i:'Target',h:'KPI',p:['Un [[KPI]] résume la qualité d\'un service, à partir de plusieurs counters.','Exemple de la doc : taux de succès SMS = (MoTotal − MoNetErr − MoUserErr) / MoTotal.']},
 {i:'Hash',h:'Scalaire ou table',p:['<b>Scalaire</b> : pas d\'objet mesuré, la valeur décrit tout le système (ex. utilisateurs en ligne).','<b>Table</b> : un ou plusieurs objets (ex. une ligne par tablespace).']},
 {i:'SquarePlus',h:'Agrégation',p:['Créer un indicateur calculé à partir d\'autres. Ex. : CAPS total = CAPS du NE A + CAPS du NE B.','Formules SUM, ANY… La période doit être <b>la même</b> que celle de l\'unité d\'origine, sinon la tâche ne démarre pas.']},
 {q:'Ta tâche d\'agrégation refuse de démarrer. Cause classique ?',o:['Période différente de celle de l\'unité d\'origine','Trop de NE','Mauvaise couleur'],a:0,e:'C\'est une règle explicite de la doc.'},
 {i:'Siren',h:'Alarmes de seuil',p:['Trois types : <b>seuil fixe</b> (dépasse X), <b>période sur période</b> (chute par rapport à la même période avant), <b>absence de données</b>.','Chemin : Monitor > Performance Monitoring.']},
 {i:'Archive',h:'Tâches de collecte',p:['Monitor > Performance Monitoring > Collection Task Management.','Actions groupées limitées à <b>100 tâches</b> à la fois. Arrête les tâches inutiles pour préserver la mémoire.']},
 {i:'Hourglass',h:'Quand ça bloque',p:['Si la collecte ralentit, les messages s\'empilent dans [[Kafka]] ([[LAG]] qui grandit).','Causes : trop d\'objets mesurés, cache mémoire saturé, grosse table qui bloque l\'écriture.'],m:'Autres causes documentées : un écart d\'heure de plus de 10 minutes entre l\'hôte UniAgent et DigitalView perturbe les tâches périodiques ; un [[DN]] de plus de 128 caractères empêche l\'affichage des données.'},
 {q:'Les données de perf d\'un NE n\'apparaissent pas, et son DN est très long. Piste ?',o:['DN de plus de 128 caractères','Licence expirée','Alarme ADMC'],a:0,e:'Le champ NE des données de performance est limité à 128 caractères.'},
 {r:['Unit (groupe) → object (qui) → counter (quoi).','KPI = indicateur de qualité calculé.','Agrégation : même période obligatoire.','Seuils : fixe, période sur période, absence de données.','Collecte bloquée : LAG Kafka, heure, DN > 128.']}
]},
{id:'r3',t:'La topologie',cards:[
 {i:'Share2',h:'La carte du réseau',p:['La topologie dessine les NE et leurs liens pour voir l\'état de tout le réseau d\'un coup d\'œil.','Monitor > Topology Management > Resource Topology.']},
 {i:'Puzzle',h:'Les objets',p:['<b>NE</b> : un équipement géré. <b>NE virtuel</b> : ajouté pour la compréhension, pas géré ou pas physique.','<b>Link</b> : connexion réelle ou logique. <b>Lien virtuel</b> : connexion non gérée.']},
 {i:'Palette',h:'La couleur qui compte',p:['Chaque NE affiche la couleur de <b>son alarme la plus grave</b>.','Un NE rouge = au moins une alarme Critical en cours sur lui.']},
 {q:'Un NE a une alarme Minor et une Critical. Il s\'affiche en…',o:['Jaune (Minor)','Rouge (Critical)','Mélange des deux'],a:1,e:'La topologie rend toujours l\'alarme la plus sévère.'},
 {i:'Settings',h:'Comment elle se construit',p:['À l\'ouverture : filtrage selon tes droits, récupération des alarmes, des icônes et de l\'état de chaque objet.','Tu ne vois que ce que tu as le droit de voir.']},
 {i:'Scissors',h:'Topologie personnalisée',p:['Crée ta propre vue avec seulement les NE qui t\'intéressent.','Parfait pour surveiller un périmètre précis, par exemple un domaine ou un site.']},
 {i:'Brush',h:'Mise en forme',p:['Formes, textes, conteneurs, disposition automatique, verrouillage, arrière-plan, style des étiquettes.','Et un panneau d\'infos avec tes raccourcis d\'actions.']},
 {i:'Eye',h:'Les alarmes sous la carte',p:['La liste des alarmes courantes s\'affiche sous la vue topologique.','Tu passes de la carte au traitement sans changer de page.']},
 {r:['Topologie = NE + liens, virtuels possibles.','Couleur = alarme la plus sévère du NE.','Filtrée par tes droits.','Topologie personnalisée = ton périmètre.']}
]},
{id:'r4',t:'Tableaux de bord',cards:[
 {i:'MonitorPlay',h:'Monitoring Dashboard',p:['Des vues créées avec le dashboard designer, regroupées pour la supervision centralisée.','Idéal pour un écran de salle de supervision.']},
 {i:'Hourglass',h:'Chargement progressif',p:['Le cadre s\'affiche d\'abord, puis chaque vue se charge.','Si c\'est lent : réduis le nombre de métriques ou de ressources interrogées.']},
 {i:'Ruler',h:'Les limites',p:['Maximum <b>500</b> tableaux de bord et <b>200</b> groupes (par tenant en multi-tenant).','Au-delà, impossible d\'en ajouter ou d\'en importer depuis le client.']},
 {q:'Tu ne peux plus créer de dashboard. Cause probable ?',o:['Limite de 500 atteinte','Licence NTP','Alarme ADMC'],a:0,e:'500 tableaux ou 200 groupes, c\'est le plafond.'},
 {i:'Telescope',h:'Auto-supervision',p:['DigitalView se surveille lui-même : mémoire JVM, OS, réseau, base, débit du module performance, [[Kafka]], processus, file d\'alarmes…','Des dashboards de self-monitoring et de cluster Kubernetes existent dans le groupe prédéfini.']},
 {i:'Monitor',h:'Mode grand écran',p:['Une vue « big screen » pour afficher réseau et ressources sur un mur d\'écrans.']},
 {r:['Dashboard = vues centralisées, chargées progressivement.','Max 500 dashboards, 200 groupes.','Self-monitoring : DigitalView se surveille lui-même.']}
]},
{id:'r5',t:'Tracing et configuration',cards:[
 {i:'Microscope',h:'Message tracing',p:['Capturer et afficher en temps réel les messages échangés entre NE, pour localiser une panne.','Le processus : créer la tâche → DigitalView la distribue au MO → le MO trace → il remonte → DigitalView analyse et affiche.']},
 {i:'DraftingCompass',h:'Les limites',p:['500 messages max affichés. 24 canaux de trace max par site.','Recommandation : pas plus de <b>4 tâches temps réel</b> simultanées. Livraison d\'une tâche : moins de 30 s en général.']},
 {q:'Combien de tâches de trace temps réel sont recommandées en même temps ?',o:['4','24','500'],a:0,e:'24 est le maximum de canaux par site, 500 le max de messages affichés. La recommandation est 4 tâches temps réel.'},
 {i:'Moon',h:'Trace planifiée',p:['Pour tracer la nuit ou quand personne ne surveille, crée une tâche planifiée.']},
 {i:'Ban',h:'En active-active',p:['En DR [[active-active]], le menu Message Trace est masqué.']},
 {i:'Settings',h:'Configuration management',p:['Configurer et ajuster les paramètres de fonctionnement des équipements et services depuis l\'interface O&M.','Outil associé : [[iCnfg]] (versions, tâches, verrous).']},
 {i:'Laptop',h:'MML Center',p:['Envoyer des commandes [[MML]] aux NE depuis DigitalView.']},
 {r:['Message tracing : créer → distribuer → tracer → remonter → afficher.','Max 500 messages, 24 canaux par site, 4 tâches temps réel conseillées.','Masqué en active-active.','Configuration : iCnfg. Commandes : MML Center.']}
]}
];
var M4=[
{id:'n1',t:'Le service de logs',cards:[
 {i:'ScrollText',h:'Pourquoi les logs',p:['Chaque service écrit ce qu\'il fait dans des logs.','Quand l\'alarme ne suffit pas, les logs racontent l\'histoire exacte de la panne.']},
 {i:'Magnet',h:'Collecter',p:['Le composant <b>LogmatrixAgent</b> lit les fichiers de logs sur les NE, selon le chemin et le nom configurés dans les plug-ins.','Il les remonte vers la couche d\'agrégation, puis stockage centralisé.']},
 {i:'Search',h:'Chercher',p:['Log Search : une recherche rapide dans des volumes massifs, en quasi temps réel.','Ensuite : graphiques de statistiques, tableaux de bord, et alarmes sur logs.']},
 {q:'Quel composant lit les fichiers de logs sur les NE ?',o:['LogmatrixAgent','DVNBI','UniEP'],a:0,e:'Le LogmatrixAgent collecte, la plateforme agrège et stocke, DVLogmatrix permet la recherche.'},
 {i:'Bell',h:'Alarme sur log',p:['Tu peux définir des conditions : si tel mot-clé apparaît X fois, une alarme est levée.','Utile pour les pannes qui ne génèrent pas d\'alarme native.']},
 {i:'LockKeyhole',h:'Données personnelles',p:['La doc insiste : ne cherche pas avec des données perso (nom, numéro, compte).','Si tu exportes des logs du réseau client, anonymise-les et supprime les copies locales après usage.']},
 {i:'Database',h:'Où est stocké',p:['Sur [[Elasticsearch]] (VSearch). Si le disque de /home/vsindex est trop plein, le service de logs devient anormal.','Le service LMStreaming ([[Flume]]) gère la collecte pour les call chains et le tracing.']},
 {r:['LogmatrixAgent collecte, DVLogmatrix recherche.','Graphiques, dashboards et alarmes sur logs.','Pas de données perso dans les recherches.','Stockage Elasticsearch : surveille /home/vsindex.']}
]},
{id:'n2',t:'Call chain et service tracing',cards:[
 {i:'Link',h:'Le problème du cloud',p:['Une seule action client peut déclencher des centaines d\'appels entre services.','Si ça échoue, où ? La <b>call chain</b> suit la chaîne d\'appels de bout en bout.']},
 {i:'Waypoints',h:'Call chain',p:['Une application appelle une série de services dans un ordre : cet enchaînement forme une chaîne d\'appels.','DigitalView relie les logs séparés de chaque composant pour une même requête.']},
 {i:'ChartColumn',h:'Overview',p:['Nombre total d\'appels et d\'appels en échec sur une période.','Un clic sur « Failed Calling Count » t\'emmène directement aux chaînes en échec.']},
 {i:'Search',h:'Le détail',p:['Pour chaque chaîne : couches d\'appel, <b>code retour</b>, délai, source, logs de chaîne et logs de tracing.','Le code d\'erreur à chaque couche t\'indique où ça casse.']},
 {q:'Un client dit : « abonnement impossible entre 8 h et 9 h ». Par quoi commencer ?',o:['Call Chain Overview sur 8 h–9 h, puis les appels en échec','Redémarrer DVAlarm','Créer une règle de masquage'],a:0,e:'C\'est le cas d\'usage décrit par la doc pour l\'overview.'},
 {i:'MonitorPlay',h:'Le cas de la doc',p:['Pour Envision Video Platform, 10 scénarios préconfigurés : publication de contenu, lecture (Authorization), login (Authenticate), abonnement en agence (BossOrder), abonnement en ligne…','On localise la panne en lisant le statut et le code d\'erreur de chaque couche.']},
 {i:'Target',h:'Service tracing',p:['Plus fin que la call chain : il trace les requêtes et réponses de chaque méthode et interface.','Tu définis une <b>condition</b> (interface, paramètre), un <b>type</b>, puis une <b>tâche</b>.']},
 {i:'TriangleAlert',h:'La règle d\'or du tracing',p:['Après avoir créé la tâche, il faut <b>reproduire</b> l\'action qui échoue.','Sans ça, aucun log de tracing valable n\'est capturé.']},
 {q:'Tu crées une tâche de tracing mais tu ne vois aucun log. Pourquoi ?',o:['Tu n\'as pas déclenché le service en échec après la création','La licence est expirée','Le NTP est faux'],a:0,e:'Les logs sont capturés seulement pour les requêtes arrivées après la création de la tâche.'},
 {i:'Bot',h:'Cloud automated testing',p:['Des sondes testent régulièrement le système comme un vrai client.','Alarmes en temps réel, graphiques de disponibilité et de qualité. Service : DVCat.']},
 {r:['Call chain : suivre une requête à travers les services.','Overview → appels en échec → code retour par couche.','Service tracing : condition → type → tâche → reproduire l\'action.','Cloud automated testing : sondes (DVCat).']}
]},
{id:'n3',t:'Les logs du système',cards:[
 {i:'Library',h:'Trois types de logs DigitalView',p:['<b>Sécurité</b> : actions qui touchent la sécurité (création d\'utilisateur, changement de mot de passe).','<b>Système</b> : actions et tâches du système (déconnexion forcée, tâche planifiée).','<b>Opération</b> : tes actions sans impact sécurité (export d\'alarmes, création de subnet).']},
 {q:'Un collègue change un mot de passe. Où le trouver ?',o:['Log de sécurité','Log d\'opération','Log système'],a:0,e:'Tout ce qui touche la sécurité des comptes va dans les logs de sécurité.'},
 {i:'Upload',h:'Transfert Syslog',p:['Les logs peuvent partir vers un serveur [[Syslog]] central.','En [[UDP]] : seulement le serveur actif. En [[TCP]]/[[TLS]] : bascule vers un serveur de secours si l\'actif ne répond pas, avec une alarme.']},
 {i:'SlidersHorizontal',h:'Les niveaux de log',p:['<b>DEBUG</b> : tout le détail, pour dépanner. <b>INFO</b> : fonctionnement normal. <b>WARN</b> : inattendu mais sans impact. <b>ERROR</b> : erreur. <b>OFF</b> : rien.']},
 {i:'Turtle',h:'Le piège du DEBUG',p:['Le niveau DEBUG ralentit le système et remplit le disque.','Active-le seulement avec l\'accord du superviseur, et désactive-le <b>dès que</b> la panne est localisée. En heure de pointe, c\'est à éviter.']},
 {q:'Tu dois activer les logs DEBUG. Bonne pratique ?',o:['Les laisser actifs pour la prochaine fois','Accord du superviseur, puis désactivation dès la panne localisée','Les activer en heure de pointe'],a:1,e:'C\'est même une opération à risque « Major » dans la liste officielle.'},
 {i:'Repeat',h:'Rotation',p:['Quand un fichier de log atteint sa taille max, il est renommé avec l\'heure et un nouveau commence.','Au-delà de 10 fichiers, le plus ancien est supprimé. Si le disque dépasse 95 %, le système nettoie.']},
 {i:'SquareTerminal',h:'Les commandes utiles',p:['<code>tail -f fichier</code> : suivre en direct.','<code>grep ERROR fichier</code> : filtrer.','<code>more fichier</code> : lire page par page. Évite <code>vi</code> sur des fichiers système (risque de modification).']},
 {r:['Logs sécurité / système / opération.','Niveaux : DEBUG, INFO, WARN, ERROR, OFF.','DEBUG : accord, puis désactiver vite.','Rotation : 10 fichiers max. tail -f et grep sont tes amis.']}
]}
];
var M5=[
{id:'s1',t:'Flow orchestration',cards:[
 {i:'Zap',h:'L\'idée',p:['Beaucoup de pannes se règlent toujours par les mêmes étapes.','On les automatise dans un <b>flow</b>, qui peut se lancer seul.']},
 {i:'Atom',h:'L\'atome',p:['Chaque étape d\'O&M est un <b>atome</b> : une vérification ou une action de réparation.','Ex. : vérifier une config, vérifier qu\'un service tourne. Un atome peut être un script sur un nœud ou un appel d\'API.']},
 {i:'Link',h:'Le flow',p:['Les atomes sont reliés selon le scénario de panne, avec des branches de décision.','On obtient un arbre : « si ceci, alors cela ».']},
 {q:'La plus petite unité d\'un flow s\'appelle…',o:['Un atome','Un counter','Un pod'],a:0,e:'Atome = une étape. Flow = des atomes reliés.'},
 {i:'TrafficCone',h:'Trois déclencheurs',p:['<b>Manuel</b>, <b>tâche planifiée</b>, ou <b>événement d\'alarme</b>.','Pour un flow donné, on choisit soit planifié, soit alarme, pas les deux.']},
 {i:'UserCheck',h:'La revue',p:['Si un flow contient des opérations à haut risque, une étape de <b>revue</b> humaine peut être exigée avant exécution.']},
 {i:'BrainCircuit',h:'Le cas de la doc',p:['Fuite mémoire [[JVM]] : des sondes testent régulièrement les pages de santé de chaque nœud.','Un flow planifié lit les résultats, trouve le nœud qui fuit, l\'isole.','Autre cas type : diagnostic et auto-réparation des [[Full GC]].']},
 {i:'Package',h:'Les packages',p:['Les flows arrivent dans des <b>flow packages</b> importés (produit, solution, opérateur).','Rôles : les développeurs créent atomes, API et flows ; l\'équipe de service importe ; l\'O&M utilise.']},
 {r:['Atome = une étape. Flow = atomes reliés avec décisions.','Déclencheurs : manuel, planifié ou alarme.','Revue possible pour le haut risque.','Service : DVIhealing.']}
]},
{id:'s2',t:'Workbench',cards:[
 {i:'MousePointerClick',h:'Le principe',p:['Exécuter des commandes ou scripts <b>en masse</b>, en un clic, sur beaucoup de VM ou applications du même type.']},
 {i:'Ruler',h:'Ce qu\'il ne fait pas',p:['Il <b>livre</b> seulement les commandes. La justesse du script, son effet et sa relance éventuelle sont de ta responsabilité.','En cas d\'échec, <b>pas de relance automatique</b> : il faut relancer à la main.']},
 {i:'CircleX',h:'Les interdits',p:['Pas de mot de passe dans les paramètres ou le contenu des scripts.','Pour démarrer, arrêter, upgrader ou installer un service, la doc recommande plutôt la gestion du cycle de vie de DigitalFoundry.']},
 {q:'Un script lancé via Workbench échoue sur 3 VM. Que se passe-t-il ?',o:['Il est relancé automatiquement','Il faut le relancer manuellement','Les VM redémarrent'],a:1,e:'Le Workbench ne relance jamais tout seul.'},
 {i:'LockKeyhole',h:'Les droits',p:['L\'accès au Workbench est donné par l\'administrateur DigitalView.','Le droit d\'exécuter des scripts dans l\'environnement du service est donné par l\'équipe du service.']},
 {r:['Workbench = commandes et scripts en masse.','Pas de relance auto, pas de mot de passe dans les scripts.','Démarrage/arrêt de services : plutôt DigitalFoundry.']}
]},
{id:'s3',t:'Collecter les infos de panne',cards:[
 {i:'Archive',h:'Pourquoi',p:['Quand une panne arrive, il faut vite rassembler logs, configs, résultats de commandes.','Le faire à la main, c\'est risquer d\'oublier des éléments ou de perdre du temps.']},

{id:'m1',t:'Maintenance courante',cards:[
 {i:'Wrench',h:'Prévenir plutôt que guérir',p:['La maintenance courante est préventive : on vérifie régulièrement, pendant que tout va bien, pour trouver les défauts avant la panne.']},
 {i:'Calendar',h:'Qui fait quoi',p:['<b>Quotidien et mensuel</b> : le personnel de maintenance courant. But : voir vite les alarmes et défauts, suivre la tendance.','<b>Trimestriel et annuel</b> : du personnel spécialement formé. But : santé long terme, vieillissement, dégradation.']},
 {i:'Sun',h:'Chaque jour',p:['Vérifier les <b>alarmes des NE</b>.','Vérifier le <b>statut de collecte des performances</b>.','Vérifier la <b>performance des NE</b>.']},
 {q:'Parmi ces tâches, laquelle est quotidienne ?',o:['Vérifier le statut de collecte des performances','Vérifier la validité des certificats','Changer les mots de passe'],a:0,e:'Certificats = annuel. Mots de passe et clés = trimestriel.'},
 {i:'HardDrive',h:'Côté OS',p:['SUSE : vérifier le [[swap]] (au moins 8 Go) et les logs système.','Commande : <code>free -m</code>.']},
 {i:'CalendarDays',h:'Chaque année',p:['Vérifier que les contrats de maintenance des équipements ne sont pas expirés.']},
 {i:'Lightbulb',h:'Les bonnes habitudes',p:['Avoir les schémas réseau logiques et physiques à jour.','Tenir un <b>registre</b> de chaque changement et panne.','Suivre la tendance de CPU, mémoire, sessions pour prédire.','Garder les documents de maintenance accessibles.']},
 {i:'Stethoscope',h:'Préventive avec MainAst',p:['L\'outil MainAst réalise des inspections préventives des serveurs (checks planifiés, résultats, rapports).','Il utilise le compte [[sysomc]].']},

 {i:'Sun',h:'Chaque jour',p:['Pas d\'utilisateur non-root avec l\'UID 0 (un faux root).','Pas d\'utilisateur système avec mot de passe vide.','Pas de fichiers ou processus malveillants, pas de nom de fichier suspect.','Pas de carte réseau en mode promiscuous (qui écouterait tout le trafic).']},

 {i:'KeyRound',h:'Chaque trimestre',p:['Changer les mots de passe et les clés.']},
 {i:'ScrollText',h:'Chaque année',p:['Vérifier la validité des certificats de sécurité.']},
