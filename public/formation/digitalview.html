 {q:'UniEP affiche des nœuds déconnectés et l\'alarme « SSH Management Channel Fault ». Piste ?',o:['Mot de passe OS expiré (ex. ossadm)','Licence expirée','NTP'],a:0,e:'C\'est un cas documenté. Modifier la durée de validité est risqué : prudence.'},

{id:'m3',t:'Sauvegarde et restauration',cards:[
 {i:'HardDriveDownload',h:'Trois couches à sauvegarder',p:['<b>OS</b> : répertoires et fichiers importants du système.','<b>Application</b> : ce qui ne change pas en temps réel (fichiers produit, applications de base de données).','<b>Données produit</b> : bases et configurations qui changent en continu.']},
 {i:'KeyRound',h:'Qui s\'en charge',p:['C\'est [[UniEP]] qui pilote les sauvegardes et restaurations, pour le produit et pour lui-même.','Les données partent vers un serveur de sauvegarde en [[SFTP]], avec signature numérique.']},
 {i:'Timer',h:'Planifié ou manuel',p:['<b>Planifié</b> : automatique, une fois ou périodiquement.','<b>Manuel</b> : un instantané à un moment choisi.','Supporte l\'incrémental (plus rapide, moins de place).']},
 {i:'BrickWall',h:'La règle d\'or de la restauration',p:['On restaure <b>de bas en haut</b>.','Avant les données produit, l\'application et l\'OS doivent être sains. Avant l\'application, l\'OS doit être sain.']},

 {i:'ClipboardList',h:'Quand sauvegarder',p:['Après installation et mise en service : planifier les sauvegardes du produit et du management plane.','Avant et après tout <b>changement majeur</b> (IP, route…) : sauvegarde complète.']},
 {i:'Info',h:'Détails utiles',p:['En All-In-One, l\'OS n\'a pas besoin d\'être sauvegardé.','Bases supportées : GaussDB et Redis. Espace total = somme des besoins de chaque produit + du management plane.']},
 {r:['OS / application / données produit.','Piloté par UniEP, transfert SFTP.','Restaurer de bas en haut.','Sauvegarder avant et après un changement majeur.']}
]},
{id:'m4',t:'Opérations à haut risque',cards:[
 {i:'Radiation',h:'Pourquoi une liste officielle',p:['Certaines actions peuvent couper le service ou détruire des données.','Huawei publie la liste avec, pour chacune, l\'impact et le niveau de risque.']},
 {i:'ScrollText',h:'Les règles générales',p:['Faire ces actions dans la fenêtre approuvée par le client ou lors d\'une panne critique.','Action testée ailleurs avant, faite ou supervisée par la maintenance, avec accord client.','Demande de changement validée dans [[iCare]]. Les opérations base de données sont évaluées par un expert base.']},
 {i:'Siren',h:'Critical côté OS',p:['Arrêter ou redémarrer l\'OS (shutdown, reboot). Changer IP, route ou nom d\'hôte (i2kadm changeip).','Couper une carte réseau (ifdown). Formater une partition. [[kill -9]] sur des processus clés.','<code>rm -rf</code>, <code>rm *</code>, find + xargs rm. Patch OS. Modifier sysctl.conf ou limits.conf.']},
 {q:'Lequel est classé Critical ?',o:['Lancer tcpdump','kill -9 sur un processus principal','Créer un dossier'],a:1,e:'tcpdump et mkdir sont « Major ». kill -9 sur un processus clé est « Critical ».'},
 {i:'OctagonAlert',h:'Major côté OS',p:['Activer les logs DEBUG. Capturer des paquets ([[tcpdump]]).','grep, tar, copie ou déplacement de fichiers de plus de 100 Mo. Transfert de plus de 100 Mo sur le réseau de service.','Se connecter directement en root. Changer l\'heure. Ajouter une [[crontab]] non validée. Uploader un fichier non scanné.']},
 {i:'Database',h:'Base de données',p:['Critical : modifier ou supprimer des fichiers dans $GSDB_HOME (hors logs), toucher aux catalogues système, au répertoire data.','Major : modifier zengine.ini à la main.']},
 {i:'SquareTerminal',h:'Commandes à haut risque',p:['<code>shutdown.sh</code>, <code>kill.sh</code>, <code>i2kadm stop</code>, <code>stopapp</code> : fonctions indisponibles.','<code>uninstall.sh</code> : désinstalle, <b>irréversible</b>.','Commandes iCnfg (stop, rollback, changement de mot de passe base) et génération de clés BCMAgent.']},
 {q:'Quelle commande est irréversible ?',o:['stopapp','uninstall.sh','p'],a:1,e:'uninstall.sh supprime l\'environnement. p ne fait que lister l\'état des processus.'},
 {i:'Eye',h:'Le réflexe lecture',p:['Pour lire un fichier système, utilise <code>more</code> ou <code>cat</code>, pas <code>vi</code>.','Avec vi, une touche malheureuse modifie le fichier.']},
 {r:['Fenêtre approuvée, accord client, change request iCare.','Critical : reboot, changement IP, kill -9, rm -rf, format.','Major : DEBUG, tcpdump, fichiers > 100 Mo, login root direct.','uninstall.sh est irréversible. Lire avec more, pas vi.']}
]}

var M8=[
{id:'t1',t:'La méthode de dépannage',cards:[
 {i:'Compass',h:'D\'où viennent les pannes',p:['<b>Réclamation client</b> : le service client trie et transmet.','<b>Alarmes DigitalView</b> : Major ou Critical = panne imminente ou en cours. Ex. CPU, mémoire, disque, base trop remplis.','<b>Maintenance courante</b> : défauts trouvés en inspection.']},
 {i:'Crosshair',h:'Une seule cause',p:['Statistiquement, une panne a presque toujours <b>une seule source</b>.','D\'où la priorité : trouver la source avant de corriger.']},
 {i:'ListOrdered',h:'Les 6 étapes',p:['1. Collecter les infos du scénario. 2. Localiser. 3. Corriger.','4. Vérifier la correction. 5. Rédiger le rapport. 6. Si besoin, contacter Huawei.']},
 {i:'NotebookPen',h:'1. Le scénario',p:['Quand et où. Le symptôme exact. Ce qui a été fait <b>avant</b> la panne. Ce qui a été fait <b>après</b> et le résultat. Les services et le périmètre touchés.']},
 {q:'Quelle info est la plus souvent oubliée et pourtant clé ?',o:['Les opérations faites juste avant la panne','La couleur de l\'alarme','Le nom du navigateur'],a:0,e:'Une modification récente est souvent la cause. C\'est explicitement demandé par la doc.'},
 {i:'Microscope',h:'2. Localiser en deux niveaux',p:['<b>Composant</b> : quel équipement (ex. la base de données).','<b>Module</b> : quelle partie (ex. le port d\'écoute de la base).','Puis collecter : version, logs, codes d\'erreur, alarmes, mémoire.']},
 {i:'TriangleAlert',h:'Les précautions',p:['Tout noter en détail. Avant une opération importante (redémarrage de processus) : vérifier, <b>sauvegarder</b>, prévoir un retour arrière.','Prudence sur : supprimer des fichiers, modifier la base ou sa config, supprimer des logs, arrêter des processus, kill, config réseau.']},
 {i:'Phone',h:'6. Contacter Huawei',p:['Préparer : nom complet du site, nom et téléphone du contact, infos du scénario, accès de maintenance à distance.','Support : support.huawei.com/carrier, ou la hotline régionale.']},
 {r:['Sources : client, alarmes, maintenance.','Une panne = presque toujours une seule cause.','Scénario : quand, quoi, avant, après, impact.','Localiser : composant puis module.','Sauvegarder avant toute opération importante.']}
]},
{id:'t2',t:'Les commandes de diagnostic',cards:[
 {i:'KeyRound',h:'Se connecter',p:['Connexion SSH en [[sysomc]], puis bascule vers [[ossuser]] pour System Monitoring, ou [[ossadm]] pour la plateforme.','En cluster, passer par l\'[[floating IP|IP flottante]] pour atteindre le nœud actif.']},
 {i:'Terminal',h:'Infos Linux',p:['<code>uname -a</code> : version du système.','<code>top</code> : CPU et mémoire en direct.','<code>more /var/log/messages</code> : erreurs système.']},
 {i:'HardDrive',h:'Disque',p:['<code>df -h</code> (ou <code>df -k</code>) : remplissage des partitions.','<code>du -sh *</code> ou <code>du -sm *</code> : qui prend la place dans un dossier.']},
 {q:'L\'alarme « Disk Usage Is High » arrive. Première commande ?',o:['df -h, puis du -sm * pour trouver le coupable','reboot','kill -9'],a:0,e:'On mesure d\'abord, on cherche le coupable ensuite. Jamais de reboot à l\'aveugle.'},
 {i:'Globe',h:'Réseau',p:['<code>ifconfig -a</code> : cartes réseau et IP. Si seul <code>lo</code> apparaît, aucune carte n\'est disponible.','<code>ping IP</code>, <code>netstat -an | grep port</code> : le service écoute-t-il ?']},
 {i:'RadioTower',h:'Lire un ping',p:['<b>Request timed out</b> : cible éteinte, carte coupée, câble débranché, pare-feu ou mauvaise passerelle.','<b>Destination host unreachable</b> : pas de route. <b>unknown host</b> : DNS.']},
 {i:'Settings',h:'System Monitoring',p:['<code>p</code> : état des processus. <code>i2kadm -v</code> : version.','<code>i2kadm check start</code> : trouve en ~2 minutes pourquoi System Monitoring ne démarre pas, avec un code d\'erreur.']},
 {q:'System Monitoring refuse de démarrer. Commande dédiée ?',o:['i2kadm check start','uname -a','helm list'],a:0,e:'Elle localise la cause en 2 minutes et donne un code à chercher dans les cas de dépannage.'},
 {i:'Archive',h:'Collecter',p:['<code>infocollect</code> ou UniEP > Maintenance > Troubleshooting > Fault Information.','Résultat dans /opt/oss/infocollect/data_log.']},
 {r:['sysomc → ossuser ou ossadm, via l\'IP flottante.','uname -a, top, /var/log/messages.','df -h puis du -sm *.','ifconfig -a, ping, netstat.','p, i2kadm -v, i2kadm check start, infocollect.']}
]},
{id:'t3',t:'Les cas classiques',cards:[
 {i:'Square',h:'Page blanche après login',p:['Cause documentée : /opt plein à <b>100 %</b> sur le nœud System Monitoring.','Correctif : <code>df -h /opt</code>, nettoyer sous <b>85 %</b>, puis redémarrer DVEamService avec ipmc_adm (en ossadm).']},
 {q:'Page blanche après login. Tu vérifies d\'abord…',o:['df -h /opt','La licence','Les couleurs d\'alarme'],a:0,e:'Un disque plein empêche le service de ressources de répondre.'},
 {i:'DoorOpen',h:'Impossible d\'ouvrir la page web',p:['Vérifier dans l\'ordre : [[TLS]] 1.2 activé dans le navigateur ; processus System Monitoring lancés ; IP et port d\'écoute corrects (netstat) ; pas de pare-feu entre toi et le serveur ; proxy du navigateur correct.']},
 {i:'Server',h:'Erreur 502',p:['Une [[502]] vient généralement de System Monitoring : processus non démarré, ou trop de threads [[Jetty]] (plus de 100).']},
 {i:'Hash',h:'Port 8088 muet, 8086 OK',p:['Mauvais script de démarrage : seul I2000 a démarré, pas le system monitor.','Relancer avec startup.sh dans $I2000_HOME/I2000/bin.']},
 {i:'Database',h:'Base « Not Running »',p:['Dans UniEP > Product > System Monitoring, une instance est « Not Running » ou « Unknown ».','Vérifier : VM arrêtée ? nœud en panne ? Sinon, démarrer l\'instance. Fichiers corrompus ou supprimés : Huawei.'],m:'Attention : si plusieurs instances sont en panne en même temps, on risque un « double master ». Quand l\'une repasse slave, la synchronisation peut perdre des données. Répare d\'abord la première instance en panne.'},
 {q:'Plusieurs instances de base sont en panne. Le risque principal ?',o:['Double master puis perte de données','Plus de son','Topologie grise'],a:0,e:'La doc recommande de corriger une instance à la fois.'},
 {i:'Clock',h:'Heures incohérentes',p:['Tu acquittes à 10 h, le log dit 9 h 30.','Causes : heure du client différente du serveur, règles d\'heure d\'été mal configurées sur l\'OS ou le JRE.']},
 {i:'Inbox',h:'Kafka empilé',p:['Page de collecte lente, [[LAG]] élevé sur DVMediation_RHM_Report.','Causes : trop d\'objets mesurés, cache mémoire plein, grosse table qui bloque. Il existe une procédure d\'urgence pour vider la file (reset des offsets).']},
 {r:['Page blanche → /opt à 100 %.','Page inaccessible → TLS, processus, netstat, pare-feu, proxy.','502 → processus arrêté ou threads Jetty.','Plusieurs bases en panne → une à la fois.','Heures incohérentes → client, DST, JRE.']}
]},
{id:'t4',t:'L\'urgence',cards:[
 {i:'Ambulance',h:'Urgence ou panne courante ?',p:['<b>Urgence</b> : indicateurs clés qui s\'effondrent, service interrompu en majorité, supervision anormale.','<b>Courante</b> : impact limité ou nul, mais menace la stabilité long terme.']},
 {i:'Ruler',h:'Les critères officiels',p:['Le réseau tombe.','Service de supervision interrompu <b>plus d\'1 heure</b>.','Counters des NE non supervisés ou faux.','<b>Alarmes importantes perdues</b>.']},
 {q:'La supervision est coupée depuis 1 h 30. C\'est…',o:['Une urgence','Une panne courante','Normal'],a:0,e:'Au-delà d\'1 heure d\'interruption du service de supervision, c\'est une urgence.'},
 {i:'Medal',h:'La priorité absolue',p:['<b>Rétablir le service d\'abord.</b>','Collecter les logs est utile, mais si ça entre en conflit avec la remise en service, la remise en service passe avant.']},
 {i:'OctagonX',h:'Ce qu\'on ne fait pas',p:['Pas de redémarrage ni de bascule <b>sans avoir localisé</b> la panne.','Pas d\'opération majeure sans l\'accord de l\'opérateur.','On garde son calme, on rend compte régulièrement, on note tout.']},
 {q:'En urgence, le système est lent. Un collègue veut redémarrer tout de suite. Tu…',o:['Acceptes, ça ira plus vite','Localises d\'abord le composant en cause','Désinstalles'],a:1,e:'La doc interdit le redémarrage ou la bascule sans localisation.'},
 {i:'Plug',h:'Après une coupure de courant',p:['Les applications doivent revenir seules en <b>30 minutes</b> via le service ossipmc01.','Sinon : vérifier les disques (<code>vgs</code>, <code>lvs</code>), activer le VG (<code>vgchange -a y</code>), monter, puis <code>ipmc_adm -cmd statusnodes</code> : tout doit être RUNNING.'],m:'Si le [[LVM]] a disparu après la coupure, il se restaure depuis /etc/lvm/backup avec pvcreate --uuid puis vgcfgrestore. Opération délicate.'},
 {i:'Dumbbell',h:'S\'entraîner',p:['La doc recommande de préparer des plans pour chaque type d\'urgence et de <b>s\'exercer une fois par trimestre</b>.']},
 {r:['Urgence : réseau down, supervision coupée > 1 h, counters faux, alarmes perdues.','Service d\'abord, logs ensuite.','Jamais de reboot ou bascule sans localisation.','Coupure de courant : retour auto en 30 min, sinon vgs/lvs/statusnodes.','Exercice d\'urgence chaque trimestre.']}
]}

var M9=[
{id:'f1',t:'Lire une fiche d\'alarme',cards:[
 {i:'BookMarked',h:'Des milliers de fiches',p:['La partie Alarm Handling contient plus de 16 000 pages, surtout des fiches d\'équipements (stockage, switchs, serveurs).','Impossible de tout apprendre. Le vrai savoir-faire : <b>lire une fiche vite et bien</b>.']},
 {i:'Puzzle',h:'La structure',p:['<b>Description</b> : quand l\'alarme est levée.','<b>Attribute</b> : ID, sévérité, type.','<b>Parameters</b> : les infos de localisation.','<b>Impact on the System</b>, <b>Possible Causes</b>, <b>Procedure</b>, <b>Clearing</b>.']},
 {i:'Target',h:'L\'ordre de lecture en service',p:['1. <b>Impact</b> : est-ce grave pour le client ?','2. <b>Parameters</b> : où exactement ?','3. <b>Possible causes</b> puis <b>Procedure</b>.','4. <b>Clearing</b> : s\'efface-t-elle seule ?']},

{id:'f2',t:'Les alarmes de connexion',cards:[
 {i:'Plug',h:'ALM-999999999',p:['« Communication between NMS and NE is abnormal ». <b>Major</b>, communications.','DigitalView n\'arrive plus à joindre un équipement ou un NE : il ne peut plus le surveiller ni lui envoyer de commandes.']},
 {i:'Search',h:'Ses causes',p:['Réseau en panne ou équipement arrêté.','Écart d\'heure de <b>plus de 3 minutes</b> entre DigitalView et l\'hôte UniAgent.']},
 {i:'ListOrdered',h:'Sa procédure',p:['Noter Alarm Source, Address, Protocol, Port dans les détails.','Physique ? Resource > Physical Resource : colonne <b>Access</b> OK ou Offline. Si Offline : l\'équipement est-il démarré ? le réseau ?']},
 {q:'ALM-999999999, le réseau est OK et l\'équipement tourne. Piste suivante ?',o:['Un écart d\'heure de plus de 3 minutes','Le son du navigateur','La topologie'],a:0,e:'C\'est une cause explicitement listée. Vérifie le NTP.'},
 {i:'Unlink',h:'ALM-440066004',p:['« Communication between NMS and Device is disconnect ». <b>Critical</b>.','Causes : l\'équipement ne répond pas au ping, ou ses paramètres d\'accès (JDBC, SSH) ont changé.','Procédure : vérifier le réseau, puis <b>Connectivity Test</b> sur la page du NE. Effacement automatique.']},
 {i:'Bot',h:'ALM-440066002',p:['« DMU Disconnected from Agent ». <b>Critical</b>.','Le [[DMU]] ne reçoit plus les battements de cœur de l\'agent, ou le certificat de l\'UniAgent est invalide.','Impact : pas de déploiement de middleware, performance non remontée.']},
 {i:'Wrench',h:'Sa procédure',p:['Sur le serveur, en utilisateur uniagent : <code>p</code>. Doivent tourner : <b>Uni-Agent</b>, <b>Watchdog</b> (+ flume et workbench si installés).','Sinon : <code>startapp</code>. Toujours là ? Vérifier la connexion vers le DMU sur le port <b>31360</b>, puis le certificat.']},
 {q:'ALM-440066002 : quels processus dois-tu voir avec p ?',o:['Uni-Agent et Watchdog','Jetty et nginx','Kafka et Redis'],a:0,e:'Plus flume et workbench si le workbench est installé.'},
 {i:'BrickWall',h:'La famille OMU/DMU',p:['ALM-440066001 OMU déconnecté du DMU. ALM-440066003 OMU déconnecté du serveur MQ.','ALM-440066005 DMU déconnecté d\'un équipement. ALM-440066006 échec de config des traps.']},
 {r:['999999999 (Major) : NMS ↔ NE. Réseau, arrêt, écart d\'heure > 3 min.','440066004 (Critical) : ping/paramètres, Connectivity Test.','440066002 (Critical) : DMU ↔ agent. p, startapp, port 31360, certificat.']}
]},
{id:'f3',t:'Les alarmes du nord',cards:[
 {i:'ArrowUpFromLine',h:'Le nord en panne',p:['Quand le NMS du dessus ne reçoit plus rien, le client s\'en aperçoit vite.','Deux alarmes clés : l\'envoi (1301) et la génération (1302).']},
 {i:'Upload',h:'ALM-505001301',p:['« NBI Communication Abnormal ».','Un fichier n\'a pas pu être envoyé au NMS. DigitalView <b>réessaie 30 minutes plus tard</b>. Succès = alarme effacée.']},
 {i:'Folder',h:'Le voyage des fichiers',p:['Échec : le fichier va dans <b>pending</b>.','Retry réussi : il part dans l\'archive des fichiers envoyés (nbiBackFile/NBI ID/date).','Trop d\'échecs : il finit dans <b>fail</b>.'],m:'Chemins : $I2000_HOME/I2000/run/var/iemp/data/dvnbiservice/NBI ID/ready, pending et fail. Archive : hofs_fuse/nbibucket/nbiBackFile. Le répertoire ready contient les fichiers en attente d\'envoi.'},
 {q:'Un fichier nord est dans « fail ». Ça signifie…',o:['Il a échoué au nombre max de tentatives','Il attend son premier envoi','Il a été envoyé'],a:0,e:'ready = en attente, pending = premier échec, fail = abandonné après les retries.'},
 {i:'FolderArchive',h:'ALM-505001302',p:['« Failed to Generate Northbound Files ». <b>Minor</b>, qualité de service.','Impact : les fichiers de perf nord de toute la période d\'alarme sont <b>perdus</b>.']},
 {i:'Search',h:'Ses causes',p:['Partition des fichiers nord à 85 % (seuil) ou 100 %.','[[inode|Inodes]] à 100 %.','[[ossuser]] sans droits de lecture/écriture sur le répertoire.','Service [[HOFS]] anormal.']},
 {q:'Disque à 40 %, mais ALM-505001302. Cause possible ?',o:['Inodes à 100 %','CPU élevé','DST'],a:0,e:'Beaucoup de petits fichiers peuvent épuiser les inodes même avec de l\'espace libre.'},
 {i:'Bell',h:'Le reste de la famille',p:['ALM-505005319 : canal socket nord anormal.','ALM-505005316 à 318 : fichiers de perf nord manquants, en retard ou incomplets.','ALM-100006 : trop d\'échecs d\'authentification SNMP NBI (verrouillage 5 min après 5 échecs en 60 min).']},
 {r:['1301 : envoi échoué, retry 30 min. ready → pending → fail.','1302 (Minor) : génération échouée. Disque 85 %, inodes, droits ossuser, HOFS.','Les fichiers perf de la période 1302 sont perdus.']}
]},
{id:'f4',t:'Les alarmes de la plateforme',cards:[
 {i:'PowerOff',h:'ALM-505001305',p:['« NMS Shutdown Unexpectedly ». <b>Major</b>, operational violation.','DVEngineeringService s\'est arrêté autrement que par UniEP, la console ou <code>i2kadm stop</code>.']},
 {i:'Search',h:'Causes et procédure',p:['Redémarrage anormal du nœud, ou processus tué par <code>kill -9</code>.','Lire le log <code>$I2000_HOME/I2000/run/var/iemp/log/root.log</code>. Si c\'est un kill -9 : prévenir l\'équipe, c\'est interdit en production.']},
 {q:'ALM-505001305 : comment s\'efface-t-elle ?',o:['Automatiquement','Manuellement, après correction','Au redémarrage'],a:1,e:'La fiche précise un effacement manuel dans Current Alarms.'},
 {i:'Inbox',h:'ALM-505005324',p:['« Kafka Connection Exception ». <b>Major</b>.','Un microservice n\'arrive pas à joindre [[Kafka]] : alarmes, performance et nord impactés.','UniEP > Panoramic Monitoring > Middleware Monitoring : si MQ est anormal, redémarrer MQAgent.']},
 {i:'ScrollText',h:'Les certificats',p:['<b>ALM-505090191</b> : va expirer. <b>ALM-505090192</b> : expiré, vérifié une fois par jour.','Sévérité de 192 : Minor (CRL), Major (trust ou identité), Critical (identité).','Un certificat expiré peut couper la communication des NE.']},
 {q:'Tu vois ALM-505090191. Que fais-tu ?',o:['Planifier le renouvellement tout de suite','Attendre ALM-505090192','Masquer l\'alarme'],a:0,e:'191 est l\'avertissement : c\'est le moment d\'agir, avant la coupure.'},
 {i:'HardDriveDownload',h:'Autres à connaître',p:['ALM-505001105 : échec du dump de base.','ALM-505005325 : fichiers core dump présents.','ALM-505005330 : trop de threads utilisateur sur l\'hôte.','ALM-505001203 : trop de handles utilisés par un processus.']},
 {r:['1305 (Major) : arrêt anormal, root.log, effacement manuel.','5324 (Major) : Kafka, redémarrer MQAgent.','191 = va expirer, 192 = expiré.','Et 157, 132, 832, 999999998 vus au module Alarmes.']}
]}

 {i:'Play',h:'Démarrer, arrêter',p:['<code>startapp</code> : démarre System Monitoring, console, MQ et DMU. <b>La base doit être démarrée avant.</b>','<code>stopapp</code> : arrête tout. Service indisponible.','<code>re</code> : redémarre tous les processus.']},
 {q:'Avant startapp, qu\'est-ce qui doit tourner ?',o:['La base de données','Le Workbench','Le navigateur'],a:0,e:'C\'est une règle d\'usage explicite de la commande.'},

 {i:'Hammer',h:'La boîte i2kadm',p:['<code>i2kadm check start</code> : diagnostic de démarrage.','<code>i2kadm log</code> : voir ou changer un niveau de log.','<code>i2kadm changepwd</code> : changer des mots de passe applicatifs.','<code>i2kadm stop</code> : arrêter (à haut risque).']},
 {i:'Wrench',h:'Les scripts utiles',p:['<code>infocollect</code> : collecte de diagnostic. <code>dv_health_check.sh</code> : bilan de santé.','<code>log_level_manager.sh</code> : niveaux de log des microservices. <code>updateAlarm.sh</code> : alarmes personnalisées d\'équipements.']},

 {i:'Users',h:'Les autres',p:['<b>sopuser</b> : connexion à distance de l\'opérateur pour la maintenance.','<b>sftpossuser</b> : transfert SFTP, sans shell.','<b>dbuser</b> : gestion de la base, login interdit.','<b>[[root]]</b> : jamais en direct sur un système durci.']},
 {q:'Quel utilisateur lance startapp ?',o:['ossuser','sftpossuser','dbuser'],a:0,e:'ossuser est l\'utilisateur de System Monitoring.'},

 {i:'FolderOpen',h:'Les chemins',p:['<b>$I2000_HOME</b> : racine de System Monitoring.','<b>.../I2000/run/var/iemp/log/root.log</b> : log principal.','<b>/opt/oss/infocollect/data_log</b> : collectes.','<b>/opt/zenith</b> : base GaussDB. <b>/var/log/messages</b> : erreurs OS.']},

 {r:['sysomc entrée, ossuser System Monitoring, ossadm plateforme.','31943 web, 22 SSH, 10162/UDP traps, 161 SNMP, 31360 DMU, 623 IPMI.','root.log, /var/log/messages, data_log.']}

var M11=[
{id:'d1',t:'Choisir le bon moniteur',cards:[
 {i:'Compass',h:'Concevoir un moniteur',p:['Concevoir un moniteur, c\'est décider <b>quoi surveiller</b>, <b>comment le mesurer</b> et <b>quand alerter</b>.','DigitalView offre plusieurs outils. Le premier savoir-faire : choisir le bon.']},
 {i:'Map',h:'La carte des outils',p:['<b>Seuil de performance</b> : un KPI existe déjà, tu veux une alarme quand il dérive.','<b>KPI personnalisé</b> : l\'indicateur n\'existe pas, tu le crées par script.','<b>Alarme personnalisée</b> : un contrôle logiciel qui lève une alarme (seuil, mot-clé, HTTP).'],m:'Cette carte de décision est une synthèse pédagogique que j\'ai construite à partir des chapitres Custom Alarms, Customizing KPIs, Configuring Threshold Alarms, Basic Infrastructure et Dashboard Designer. Elle n\'existe pas telle quelle dans la doc.'},
 {i:'Map',h:'La carte (suite)',p:['<b>Modèle de seuils d\'infrastructure</b> : régler en masse les seuils OS et bases (Linux, Oracle, GaussDB).','<b>Alarme sur log</b> : un mot-clé dans les logs.','<b>Vue de dashboard</b> : visualiser, pas alerter.','<b>Tâche AIOps</b> : détecter l\'anormal sans seuil fixe.']},
 {q:'Le KPI « taux d\'échec » existe déjà. Tu veux une alarme au-dessus de 5 %. Quel outil ?',o:['Un seuil fixe sur la tâche de collecte','Une alarme personnalisée shell','Une vue honeycomb'],a:0,e:'Le KPI existe : il suffit d\'un Fixed-Threshold-Crossing Alarm sur la tâche de collecte.'},
 {q:'Tu veux surveiller le nombre de lignes d\'une table métier. Aucun KPI ne l\'expose. Outil ?',o:['Un KPI personnalisé (script SQL)','Un seuil période sur période','Un modèle Linux'],a:0,e:'L\'indicateur n\'existe pas : tu le crées avec Customizing KPIs (SQL Scripts). Tu pourras ensuite lui poser un seuil.'},
 {q:'Tu veux être alertée si une URL de service ne répond plus. Outil le plus simple ?',o:['Alarme personnalisée de type HTTP','KPI SNMP','Vue de texte'],a:0,e:'Le type HTTP ne demande aucun script et, selon la doc, ne passe pas par l\'étape de revue.'},
 {r:['KPI existant + alerte = seuil de performance.','Indicateur inexistant = KPI personnalisé.','Contrôle logiciel = alarme personnalisée (seuil, mot-clé, HTTP).','Seuils OS/bases en masse = modèles d\'infrastructure.','Visualiser = dashboard. Anormal sans seuil = AIOps.']}
]},
{id:'d2',t:'Alarmes personnalisées : les règles',cards:[
 {i:'Hammer',h:'À quoi ça sert',p:['Surveiller un nouveau service déployé sur un NE en lui envoyant ta propre configuration d\'alarme et ton script.','Chemin : <b>Monitor > Alarms > Custom Alarms</b>. Permission requise : Custom Alarms.']},
 {i:'Construction',h:'Où ça marche',p:['Seulement sur les NE connectés via l\'[[UniAgent]]. Pas sur les OS « ordinaires ».','Pas sur les NE conteneurs connectés. Et en conteneur, si le [[pod]] est supprimé puis recréé, les alarmes personnalisées ne sont pas redéployées.']},
 {i:'Hash',h:'Les ID',p:['Les alarmes personnalisées ont des ID de <b>505002000 à 505002999</b>.','Vers le nord, elles deviennent : 888888893 (Warning), 888888894 (Minor), 888888895 (Major), 888888896 (Critical).']},
 {q:'Une alarme personnalisée Major part vers le NMS. Sous quel ID ?',o:['888888895','505002000','999999999'],a:0,e:'Le mapping nord se fait par sévérité : 893 Warning, 894 Minor, 895 Major, 896 Critical.'},
 {i:'TriangleAlert',h:'Conflit d\'ID',p:['Si un UniAgent est relié à plusieurs DigitalView, leurs ID de départ sont identiques : les alarmes entrent en conflit.','Solution : changer l\'ID de départ avec le script <code>CustomAlarmIdModify.sh</code> (en dbuser, avec l\'accord du client).']},
 {i:'Ruler',h:'La limite conseillée',p:['<b>50 alarmes personnalisées maximum</b> par UniAgent.','Et le total (personnalisées + préconfigurées) doit rester dans la baseline de performance de DigitalView.']},
 {i:'NotebookPen',h:'Les infos de base',p:['Nom, période de détection (minute par défaut, ou seconde), type, <b>ADAC ou ADMC</b>, sévérité, cause probable.'],m:'Pour bloquer l\'unité en minutes : <code>enableSecondLevelMonitoring=false</code> dans $I2000_HOME/I2000/run/etc/i2000.cmon/cmon.properties, puis synchroniser le fichier vers HOFS. En secondes, une tâche SQL a une durée max d\'1 minute par défaut.'},
 {i:'SlidersHorizontal',h:'3 types de condition',p:['<b>Threshold</b> : comparer une valeur à des seuils de levée et d\'effacement.','<b>KeyWord</b> : chercher un mot-clé (format conseillé <code>Custom_xx</code>, ex. Custom_status=nok).','<b>HTTP</b> : vérifier ce que renvoie une URL. Pas de script.']},
 {i:'Repeat',h:'Repeat Time',p:['Nombre de fois consécutives où la condition doit être vraie.','Exemple : seuil > 80 et Repeat Time = 3 : alarme seulement après 3 mesures consécutives au-dessus de 80.']},
 {i:'Globe',h:'Le cas HTTP',p:['Tu donnes l\'URL, la <b>valeur de retour</b> attendue, le nombre de retries et le timeout.','Valeur attendue absente = alarme. Code 4xx, 5xx ou timeout = alarme.'],m:'La « Return Value » n\'est pas le code HTTP : c\'est le contenu attendu. Elle n\'est vérifiée que si le code est 2xx ou 3xx.'},
 {q:'Ton moniteur HTTP attend « OK ». L\'URL renvoie un code 503. Résultat ?',o:['Alarme','Pas d\'alarme, car ce n\'est pas « OK » qui est testé','Le script plante'],a:0,e:'Un code 4xx ou 5xx déclenche toujours une alarme, quelle que soit la valeur attendue.'},
 {i:'Target',h:'Où déployer',p:['<b>Cluster</b> : sur toutes les instances d\'un type de NE.','<b>Instance</b> : sur une instance au hasard.','<b>Custom</b> : sur les instances que tu choisis.','Plus le compte qui exécute le script.']},
 {i:'UserCheck',h:'La revue obligatoire',p:['Une tâche créée ou modifiée doit être <b>revue</b> avant d\'être démarrée.','Personne ne peut revoir sa propre tâche. Permissions : Customize Alarm Review, Customizing Monitoring, Customizing Alarm Audit.','Exception : le type HTTP n\'a pas besoin de revue.']},
 {q:'Tu as créé une alarme personnalisée shell. Tu ne peux pas la démarrer. Pourquoi ?',o:['Elle attend la revue d\'un autre utilisateur','Il faut redémarrer DigitalView','Le type shell est interdit'],a:0,e:'Création ou modification = revue par quelqu\'un d\'autre, avec les bonnes permissions.'},
 {i:'Package',h:'Partager entre sites',p:['Export (Administrators seulement) : un .zip des tâches. Un seul export à la fois dans le système.','Import : avec fichier de signature, le script n\'est plus modifiable ; sans signature, la tâche passe en revue.','Puis « Automatic filling » pour créer depuis le modèle.']},
 {r:['Seulement via UniAgent, pas en conteneur.','ID 505002000–505002999. Nord : 888888893 à 896 selon sévérité.','Max conseillé : 50 par UniAgent.','Conditions : Threshold, KeyWord, HTTP (sans script).','Revue obligatoire sauf HTTP. Jamais sa propre tâche.']}
]},
{id:'d3',t:'Écrire le script d\'alarme',cards:[
 {i:'ScrollText',h:'Le contrat du script',p:['Ton script calcule une valeur, puis l\'imprime dans un format imposé que l\'agent sait lire.','Deux parties : ta logique (libre), puis un bloc standard à ne pas modifier.']},
 {i:'FileJson',h:'Le format de sortie',p:['Le script imprime la ligne <code>###pagt.call.ret#END</code> suivie d\'un JSON.','Dedans, <code>checkResultData</code> contient la paire <b>clé : valeur</b>, par exemple CPUUsage : 75.']},
 {i:'Thermometer',h:'Exemple seuil',p:['Le script de la doc mesure le CPU 5 fois et en fait la moyenne.','Seuils : Major à 70 (effacement 65), Critical à 90 (effacement 85). Résultat 75 → <b>alarme Major</b>.']},
 {q:'Avec ces seuils, le script renvoie 88. Que se passe-t-il ?',o:['Alarme Major','Alarme Critical','Rien'],a:0,e:'88 dépasse 70 (Major) mais pas 90 (Critical).'},
 {i:'Lightbulb',h:'Une subtilité',p:['Si <code>checkResultData</code> ne contient <b>qu\'une seule</b> paire clé-valeur, le système ne vérifie pas que la clé correspond au nom du seuil.','Il compare directement la valeur.']},
 {i:'Type',h:'Exemple mot-clé',p:['Le script compte les lignes ERROR dans nginx.log. S\'il y en a, il renvoie « ERROR », sinon « OK ».','Si la valeur contient le mot-clé configuré, l\'alarme est levée.']},
 {i:'CircleCheck',h:'La pré-vérification',p:['Un petit script qui répond <b>true</b> ou <b>false</b> avant le script principal.','Exemple de la doc : n\'exécuter que sur le nœud actif. Sur le standby, false : rien n\'est lancé, pas d\'alarme.','Tout autre retour = exécution anormale. Nécessite l\'UniAgent V800R024C30 ou plus.']},
 {q:'Le script de pré-vérification renvoie « yes ». Résultat ?',o:['Exécution anormale','Le script principal tourne','Il est ignoré'],a:0,e:'Seuls true et false sont acceptés.'},
 {i:'SquarePlus',h:'Le script additionnel',p:['Optionnel. Son résultat s\'affiche en <b>Clé=Valeur</b> dans « Other Information » de l\'alarme.','Parfait pour ajouter du contexte utile au diagnostic.']},
 {i:'BrickWall',h:'Le bac à sable',p:['Les scripts tournent dans un <b>sandbox</b> sur l\'UniAgent.','Interdit : ifconfig, route, et tout ce qui passe par le réseau (REST, base, SSH, SFTP, FTP, Telnet).','Lecture seulement sur certains dossiers, listés dans <code>config_monitor_custom.cfg</code>.']},
 {q:'Ton script d\'alarme appelle une API REST distante. Que va-t-il se passer ?',o:['Ça ne marchera pas : le sandbox bloque le réseau','Ça marche si l\'URL est en HTTPS','Ça marche en root'],a:0,e:'Aucune communication réseau via carte réseau n\'est permise. Pour une URL, utilise plutôt une condition HTTP.'},
 {i:'Timer',h:'Les limites de temps',p:['Un script shell : <b>1 minute max</b>. Tous les scripts shell livrés depuis l\'interface : <b>5 minutes max</b> au total.','Sinon le pool de threads de l\'UniAgent se remplit et d\'autres tâches (collecte OS) échouent.'],m:'Pour vérifier : dans $UNIAGENTLOG_DIR/Uni-Agent/stack.log, après un kill -3 sur le processus Uniagent_Main, regarder si les threads RunCommandThread-* sont RUNNABLE. On peut augmenter SHELL_EXEC_CORE_SIZE dans $UNIAGENT_HOME/conf-itpaas/paasagent.properties, au prix de plus de CPU et de mémoire (JVM_HEAP_XMS et JVM_HEAP_XMX).'},
 {i:'Braces',h:'Paramètres et utilisateurs',p:['Paramètres en <code>$1</code>, <code>$2</code>… séparés par des espaces, 1 024 caractères max au total, sans caractères chinois ni # % & ( ) + > < ; ? \\','Les utilisateurs <b>uniagent</b> et <b>root</b> ne peuvent pas être choisis pour exécuter le script.']},
 {r:['Sortie : ###pagt.call.ret#END + JSON checkResultData.','Pré-vérification : true ou false uniquement.','Sandbox : pas de réseau, pas d\'ifconfig ni route.','1 min par script, 5 min au total.','Ni root ni uniagent pour exécuter.']}
]},
{id:'d4',t:'Alarmes SQL',cards:[
 {i:'Database',h:'Surveiller par requête',p:['Une alarme personnalisée peut aussi tourner en <b>SQL</b> : une requête sur la base, comparée à un seuil ou à un mot-clé.']},
 {i:'KeyRound',h:'D\'abord le compte',p:['Il faut un compte base de données : <b>Maintenance > Common Maintenance > Basic Infrastructure > NE Account Management > Manage Accounts</b>.','Protocol type <b>DB</b>, DB type (Oracle, GaussDB, MySQL), SID, port, IP. Puis <b>Verify Login</b> : il teste aussi la connexion [[JDBC]].']},
 {i:'Hash',h:'Exemple seuil',p:['<code>select count(*) as TOTAL_COUNT from FMDB.T_CURRENT_ALARM where METYPE=\'OSS\'</code>','Le nom de colonne (TOTAL_COUNT) est le nom du contrôle, comparé aux seuils.']},
 {i:'Type',h:'Exemple mot-clé',p:['<code>select MENAME from FMDB.T_CURRENT_ALARM where METYPE=\'OSS\'</code>','Le résultat est cherché pour le mot-clé.']},
 {i:'Hourglass',h:'Le timeout',p:['1 minute par défaut, ou 30 minutes (Advanced Config).','Au-delà d\'1 minute, seulement <b>2 threads</b> pour ce genre de tâches : au-delà de 2 tâches, certaines n\'auront pas de données.'],m:'On peut changer ce nombre avec CUSTOM_LONG_TASK_THREAD_NUM dans paasagent.properties.'},
 {q:'Tu crées 4 alarmes SQL avec un timeout de 30 min. Risque ?',o:['Certaines tâches sans données, faute de threads','Aucun','Le NE redémarre'],a:0,e:'Seulement 2 threads pour les tâches au timeout supérieur à 1 minute.'},
 {i:'Ban',h:'Les contraintes',p:['Le mode Cluster n\'est pas disponible pour une tâche SQL.','La requête doit être testée avant la production : fonction et performance sont de ta responsabilité.','Compte Oracle par nom de domaine : ajouter le DNS dans /etc/resolv.conf des nœuds app et proxy de DigitalView.']},
 {r:['Compte DB dans NE Account Management, Verify Login.','Le nom de colonne = nom du contrôle.','Timeout 1 ou 30 min, 2 threads pour les longues.','Pas de mode Cluster en SQL.']}
]},
{id:'d5',t:'KPI personnalisés',cards:[
 {i:'DraftingCompass',h:'Créer un indicateur',p:['Quand l\'indicateur n\'existe pas, tu le crées : un script collecte la valeur, DigitalView la stocke comme donnée de performance.','Chemin : <b>Monitor > Performance Monitoring > Collection Task Management > Create > Custom Performance Counter</b>.']},
 {i:'Hash',h:'Scalaire ou table',p:['<b>Scalaire</b> : pas d\'objet mesuré (une valeur pour le système).','<b>Table</b> : des objets mesurés (une ligne par interface, par disque…).']},
 {i:'Puzzle',h:'4 types de script',p:['<b>Shell</b> et <b>SQL</b> : exécutés par l\'UniAgent.','<b>SNMP</b> et <b>SSH</b> : exécutés par le service de performance lui-même, sans agent.']},
 {i:'FileJson',h:'Script shell : la sortie',p:['Ligne <code>###pagt.om.perfplugin#END</code> puis un JSON.','<code>measUnit</code> : l\'ID de l\'unité de mesure. <code>dataMap</code> : les KPI et leurs valeurs. <code>measureMap</code> : les index d\'objets (pour une table).']},
 {i:'Link',h:'La règle de correspondance',p:['<b>Task ID = measUnit</b> du script.','Les ID des counters dans l\'interface = les clés de <code>dataMap</code>. Les ID d\'objets = les clés de <code>measureMap</code>.','En SQL : les noms de colonnes de la requête = ces ID.']},
 {q:'Ton script renvoie measUnit=\'SystemMonitor\'. Quel Task ID dois-tu saisir ?',o:['SystemMonitor','N\'importe lequel','CPUWaitTime'],a:0,e:'Le Task ID doit être identique au measUnit, sinon les données ne s\'associent pas.'},
 {i:'Tag',h:'Nommer les ID',p:['Commencer par une lettre ou « _ », puis lettres, chiffres, « _ ». 128 caractères max. Uniques dans la tâche.','Noms interdits : DN, CREATETIME, TIMESTAMP, ARRIVALTIME, SAVETIME, PERIOD, DISPLAYVALUE_ZH, DISPLAYVALUE_EN.']},
 {q:'Quel ID de counter est refusé ?',o:['PERIOD','cpu_rate','_wait2'],a:0,e:'PERIOD est une colonne réservée.'},
 {i:'Settings',h:'Les paramètres d\'un counter',p:['<b>Calculation type</b> : ABS ou SUM.','<b>Reduced dimension algo</b> : MAX (défaut), MIN, AVG, SUM, pour afficher sur de longues périodes.','<b>Performance counters</b> (option) : de nouveaux counters calculés par formule à partir des autres.']},
 {i:'Clock',h:'L\'horodatage',p:['Optionnel : un champ <code>timestamp</code> en millisecondes (shell) ou <code>DV_CUSTOM_TIMESTAMP</code> (SQL).','Sinon, c\'est l\'heure de collecte qui est utilisée.']},
 {i:'RadioTower',h:'Scripts SNMP et SSH',p:['On remplit un tableau de paramètres (<code>oid</code> + <code>operateType</code> en SNMP, <code>command</code> en SSH), puis <code>request -p snmp</code> ou <code>request -p ssh</code>.','On renvoie avec <code>generate_result -s</code> (scalaire) ou <code>-f</code> (table).']},
 {i:'Timer',h:'Les limites SNMP/SSH',p:['Réponse d\'une requête : 4 Ko max. Durée d\'un script : <b>1/5 de la période</b> max.','Conseil : 3 requêtes par script au plus, sinon allonger la période. Si DVPMService ou I2000 redémarre, la collecte de ce moment est perdue.']},
 {q:'Période de 5 minutes. Durée max d\'un script SNMP ?',o:['1 minute','5 minutes','30 secondes'],a:0,e:'Un cinquième de la période : 5 min / 5 = 1 min.'},
 {i:'Ruler',h:'Autres règles',p:['50 tâches personnalisées max conseillées par UniAgent.','Pas de KPI shell ou SQL pour les NE Docker.','Script : 65 535 caractères max. Nom de script non modifiable.','Revue obligatoire, comme pour les alarmes.']},
 {i:'Stethoscope',h:'Diagnose',p:['Si une tâche n\'obtient pas ses objets : <b>Diagnose</b> sur la tâche, choisir le NE, lancer.','Boîte à outils : <b>Restart NE Collect Task</b> ou <b>Export Metadata</b>.']},
 {r:['Shell/SQL via UniAgent. SNMP/SSH via le service de perf.','Task ID = measUnit. Counter IDs = clés dataMap ou colonnes SQL.','Noms réservés interdits (DN, PERIOD…).','SNMP/SSH : 4 Ko, 1/5 de la période, ≤ 3 requêtes.','Max 50 tâches par UniAgent. Diagnose en cas de souci.']}
]},
{id:'d6',t:'Les seuils de performance',cards:[
 {i:'Ruler',h:'Trois familles de seuils',p:['Sur une tâche de collecte : <b>Threshold</b>.','<b>Seuil fixe</b>, <b>période sur période</b>, <b>absence de données</b>.']},
 {i:'Fingerprint',h:'Les ID générés',p:['Un seuil enregistré génère un ID d\'alarme unique entre <b>888000000 et 888888888</b>.']},
 {i:'Calculator',h:'Seuil fixe : les réglages',p:['<b>Consecutive Times</b> : nombre de dépassements consécutifs.','<b>Alarm Time Range</b> : plage horaire d\'effet. <b>5 règles max</b>, chacune sur sa plage.','Les conditions de levée et d\'effacement ne doivent pas se chevaucher.','Pas de seuil fixe sur un counter texte.']},
 {i:'Scale',h:'Les 3 règles de calcul',p:['1. Plusieurs sévérités atteintes : seule la plus haute est levée.','2. Effacement du Critical + condition Major remplie : le Critical s\'efface, un Major est levé.','3. Plusieurs effacements remplis : toutes les alarmes concernées s\'effacent.']},
 {q:'La valeur retombe sous l\'effacement Critical mais reste au-dessus du seuil Major. Résultat ?',o:['Critical effacé, Major levé','Rien ne change','Tout s\'efface'],a:0,e:'C\'est la règle 2.'},
 {i:'EyeOff',h:'Ignore expression',p:['Une formule sur d\'autres counters : si elle est vraie pour une période, aucun calcul de seuil n\'est fait.','Utile pour ignorer les périodes sans trafic, par exemple.']},
 {i:'TrendingUp',h:'Période sur période',p:['Pour les KPI qui varient selon l\'heure ou le jour.','En % : 100 × |maintenant − avant| / avant. En différence : |maintenant − avant|.','Si « avant » vaut 0, pas d\'alarme.']},
 {i:'Calendar',h:'Ses réglages',p:['Intervalle : <b>Period, Day, Week ou Month</b>. Points d\'échantillon : 1, 2 ou 3 (moyenne).','Intervalle × points ≤ jours d\'historique. Par défaut <b>hisDataSaveDays = 32</b> ; pour Month, il faut plus de 31 jours.','<b>Wave direction</b> : hausse, baisse, ou les deux.']},
 {q:'Période précédente à 4, maintenant 10. Écart en % ?',o:['150 %','60 %','6 %'],a:0,e:'100 × |10 − 4| / 4 = 150 %. C\'est l\'exemple de la doc.'},
 {i:'CircleDashed',h:'Absence de données',p:['Alarme si aucune donnée n\'arrive pendant X périodes consécutives, effacement quand les données reviennent.','Limites : ≤ 50 tâches, ≤ 10 000 objets, ≤ 100 règles par tâche. Déclenché par le planificateur CRON, à utiliser avec prudence.']},
 {i:'Wrench',h:'Modèles d\'infrastructure',p:['<b>Maintenance > Common Maintenance > Basic Infrastructure > Alarm Threshold Settings</b>.','Modèles système : <code>linux_default_template</code>, <code>Oracle_default_template</code>, <code>Gauss_default_template</code>. On crée, puis on <b>applique</b> à des hôtes en masse.'],m:'Import : un .zip de 5 Mo max, 100 fichiers max, nom de modèle de 64 caractères max. « Use Agent Default Template » remet les valeurs par défaut de l\'agent.'},
 {i:'Terminal',h:'Seuils Linux avancés',p:['ALM-60210099 (fichiers dans un dossier) et ALM-60210100 (descripteurs par utilisateur) : activer dans le modèle, puis renseigner chemin ou utilisateur et seuil dans <code>osAlarmConfig.xml</code> sur l\'agent.','ALM-60210124 (handles par processus) : <code>./addstrategy.sh agentmgr *java* ProcHandleCount 5</code>.']},
 {r:['Seuils : fixe, période sur période, absence de données. ID 888000000–888888888.','5 règles max par plage horaire. Consecutive Times.','Règle 2 : Critical effacé + Major levé.','Période sur période : 1 à 3 points, hisDataSaveDays = 32.','Modèles d\'infra : linux, Oracle, Gauss, appliqués en masse.']}
]},
{id:'d7',t:'Concevoir un dashboard',cards:[
 {i:'Palette',h:'Le Dashboard Designer',p:['<b>Monitor > Monitoring Dashboard > Dashboard Designer</b>. Permission : Dashboard Designer.','Tu crées des dashboards dans des groupes, puis des <b>vues</b> dans chaque dashboard.']},
 {i:'Ruler',h:'Les limites',p:['500 dashboards et 200 groupes max. <b>40 vues</b> par dashboard, ou 60 pour au plus 5 dashboards (<code>oversizeDashboardNum</code>).','50 rôles max par dashboard, avec option lecture seule.']},

 {i:'TrendingDown',h:'NE monitoring view',p:['Tu choisis NE, unité de mesure, objets, puis les counters. Par type de NE ou par instance.','Option <b>Dynamic Sub-View</b> (recommandée) : sous-vues automatiques par NE. <b>Threshold line</b> : une ligne de seuil visible.']},
 {i:'AlarmClock',h:'Plage de temps et précision',p:['Pour une collecte à 1 minute : jusqu\'à 12 h, un point par minute.','1 jour : 5 min. 3 jours : 15 min. 1 semaine : 15 min. 30 jours : 1 h.','« View Origin Data » montre les données brutes.']},

 {i:'Calculator',h:'Common view (SQL)',p:['Tu choisis une source de données, tu écris le SQL, tu mappes les champs.','Par requête : 60 000 lignes max, 2 Mo max au total. Évite CLOB, BLOB et TEXT. Préfère un champ timestamp pour l\'axe X.']},

 {i:'Upload',h:'Partager',p:['Copier, référencer, exporter, importer un dashboard. Partager son URL. L\'enregistrer sur la page d\'accueil.','Sauvegarde planifiée des données de dashboard possible.']},
 {i:'TriangleAlert',h:'Le piège de l\'IP',p:['Si une vue utilise un objet identifié par IP, et que l\'IP change (changement d\'IP, migration, bascule DR), il faut <b>reconfigurer</b> la vue.']},
 {r:['500 dashboards, 200 groupes, 40 vues par dashboard.','Domain, Common (SQL), Context, AIOps, Log analysis.','Précision selon la plage : 1 min, 5 min, 15 min, 1 h.','SQL : 60 000 lignes, 2 Mo.','Drilldown 200 valeurs, 70 paramètres. Reconfigurer après un changement d\'IP.']}
]},

function mergeState(r){if(!r)return false;var before=JSON.stringify(st);
  Object.keys(r.done||{}).forEach(function(k){if(r.done[k])st.done[k]=true});
  Object.keys(r.pos||{}).forEach(function(k){if(!st.done[k]&&(st.pos[k]||0)<r.pos[k])st.pos[k]=r.pos[k]});
  Object.keys(st.pos).forEach(function(k){if(st.done[k])delete st.pos[k]});
  Object.keys(r.best||{}).forEach(function(k){if(st.best[k]==null||r.best[k]>st.best[k])st.best[k]=r.best[k]});
  (r.days||[]).forEach(function(d){if(st.days.indexOf(d)<0)st.days.push(d)});
  (r.miss||[]).forEach(function(m){if(st.miss.indexOf(m)<0)st.miss.push(m)});
  if((r.xp||0)>st.xp)st.xp=r.xp;if(r.xpInit)st.xpInit=1;
  function dnum(s){if(!s)return 0;var p=s.split('-');return +p[0]*10000+ +p[1]*100+ +p[2]}
  if(dnum(r.last)>dnum(st.last)||(r.last===st.last&&(r.streak||0)>(st.streak||0))){st.last=r.last;st.streak=r.streak||0}
  return JSON.stringify(st)!==before}

  if(ok){ctx.good++;ctx.combo++;var gain=10+(ctx.combo>1?5:0);addXP(gain);toast('+'+gain+' XP','Zap');if(mi>=0&&ctx.mode!=='lesson')st.miss.splice(mi,1)}
  else{ctx.combo=0;addXP(2);if(mi<0)st.miss.push(c.key)}
  save();return ok}
function qHTML(c,label,ans){var h='<span class="qtag pastel">'+esc(label)+'</span><h2 class="qq">'+rich(c.q)+'</h2><div class="opts">'+c.o.map(function(o,k){var cls='opt';if(ans){if(k===c.a)cls+=' good';else if(k===ans.k)cls+=' bad'}return '<button class="'+cls+'" data-k="'+k+'"'+(ans?' disabled':'')+'>'+rich(o)+'</button>'}).join('')+'</div>';
  h+='<div class="exp'+(ans?' show':'')+'">'+(ans?expHTML(c,ans.ok):'')+'</div>';return h}
function expHTML(c,ok){return '<span class="ei" style="color:'+(ok?'var(--good)':'var(--accent)')+'">'+ico(ok?'CircleCheck':'Lightbulb',20)+'</span><span><b>'+(ok?'Exact.':'Pas tout à fait.')+'</b> '+rich(c.e)+'</span>'}

  [].forEach.call(box.querySelectorAll('.opt'),function(x){x.disabled=true;if(+x.dataset.k===c.a)x.classList.add('good')});if(!ok)b.classList.add('bad');
  var ex=box.querySelector('.exp');ex.innerHTML=expHTML(c,ok);ex.classList.add('show');bindTerms(ex);if(after)after(ok)}})}

  return {nq:nq,L:lvl(st.xp),gained:st.xp-ctx.xp0,up:lvl(st.xp).n>ctx.lv0,nx:s.mod.S[s.mod.S.indexOf(s)+1]||null}}

  var r=card.getBoundingClientRect();go(e.clientX<r.left+r.width*0.3?-1:1)});
card.addEventListener('click',function(e){var mb=e.target.closest('.morebtn');if(!mb)return;var mo=mb.nextElementSibling;mo.classList.toggle('show');mb.innerHTML=mo.classList.contains('show')?ico('ChevronUp',16)+' Masquer':ico('ChevronDown',16)+' Aller plus loin'},true);
var sx=null,sy=null;card.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
card.addEventListener('touchend',function(e){if(sx==null)return;var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;if(e.target.closest('.widget'))return;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5){go(dx<0?1:-1)}});
addEventListener('keydown',function(e){if(!document.getElementById('scrim').classList.contains('hidden')){if(e.key==='Escape')hideTerm();return}
  if(story.classList.contains('hidden'))return;if(e.key==='Escape')return closeStory();
  if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
function end(){card.dataset.nav='0';comboEl.className='combo';var nq=S.cards.filter(function(c){return c.q}).length,msg,nx=null,r=null;
  if(S.mode==='lesson'){r=finishSession(S);nx=r.nx;msg=S.good===nq?'Sans faute, rien à revoir.':'Tes erreurs t\'attendent dans Révision.'}
  else{bump();if(S.mode==='final'&&S.mod&&(st.best[S.mod.id]==null||S.good>st.best[S.mod.id]))st.best[S.mod.id]=S.good;save();
    msg=S.mode==='review'?'Les questions réussies ont quitté ta liste.':S.good>=Math.ceil(nq*0.85)?'Excellent niveau, c\'est maîtrisé.':S.good>=Math.ceil(nq*0.6)?'Bonne base. Revois les sessions où tu as hésité.':'Reprends les sessions concernées, puis retente.'}
  var L=lvl(st.xp),gained=st.xp-S.xp0,up=L.n>S.lv0,good=!nq||S.good>=Math.ceil(nq*0.6);
  card.className='card in';
  card.innerHTML=coverHTML({i:good?'Trophy':'Target'})+'<div class="cbody end"><h2 style="margin:0">'+(S.mode==='lesson'?'Session terminée':S.mode==='review'?'Révision faite':'Résultat')+'</h2>'+(nq?'<div class="score">'+S.good+'/'+nq+'</div>':'')+'<p style="color:var(--muted);margin:0 0 4px">'+msg+'</p><div class="endstats"><span>'+ico('Zap',15)+' +'+gained+' XP</span><span>'+ico('Flame',15)+' '+st.streak+' jour'+(st.streak>1?'s':'')+'</span><span>'+ico('Award',15)+' Niv. '+L.n+'</span></div>'+(up?'<div class="levelup pastel">'+ico('Trophy',18)+' Nouveau niveau : '+esc(L.name)+' !</div>':'')+(nx?'<button class="cta" id="nxt">Suivante : '+esc(nx.t)+'</button>':'')+'<button class="cta alt" id="rvw">'+ico('ChevronLeft',16)+' Revoir les cartes</button><button class="cta'+(nx?' alt':'')+'" id="bk2">Retour</button></div>';
  document.getElementById('bk2').onclick=function(e){e.stopPropagation();closeStory()};
  document.getElementById('rvw').onclick=function(e){e.stopPropagation();S.idx=0;draw(-1)};
  if(nx)document.getElementById('nxt').onclick=function(e){e.stopPropagation();openSession(nx,0)};
}

var scrim=document.getElementById('scrim'),sheet=document.getElementById('sheet'),lastFocus=null;
function showTerm(k){var g=G[k];if(!g)return;lastFocus=document.activeElement;
  sheet.innerHTML='<div class="grab"></div><span class="cat">'+esc(g.c)+'</span><h3>'+esc(k)+'</h3><p>'+esc(g.d)+'</p>'+(g.a?'<p class="an">'+ico('Lightbulb',15)+' '+esc(g.a)+'</p>':'')+'<button class="cta" id="tok">Compris</button>';
  scrim.classList.remove('hidden');var tk=document.getElementById('tok');tk.focus();tk.onclick=hideTerm}
function hideTerm(){scrim.classList.add('hidden');if(lastFocus)lastFocus.focus({preventScroll:true})}
scrim.addEventListener('click',function(e){if(e.target===scrim)hideTerm()});
try{history.replaceState({v:'home'},'')}catch(e){}render();initSync();

</script>
</body>
