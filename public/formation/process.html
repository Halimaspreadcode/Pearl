<!DOCTYPE html>
<html lang="fr">
<head><script src="/formation/digitalview-bridge.js" data-course="process" data-keys="itf-state,its-state"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Process ITSM · Formation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F4F7;--surface:#FFFFFF;--surface2:#EFEFF4;--ink:#141417;--muted:#8A8A96;--line:#E6E6EC;
  --accent:#E3B20C;--good:#2FA36B;--good-soft:#DDF3E7;--bad:#E0454F;--bad-soft:#FBE3E4;
  --shadow:0 2px 6px rgba(20,20,23,.04),0 12px 30px rgba(20,20,23,.05);
  --soft:#C9CCF8;--deep:#5B5FE0;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1013;--surface:#18191E;--surface2:#22242B;--ink:#F2F2F5;--muted:#9A9AA8;--line:#2A2C34;--good-soft:#123324;--bad-soft:#3A1A1D;--shadow:0 2px 6px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0F1013;--surface:#18191E;--surface2:#22242B;--ink:#F2F2F5;--muted:#9A9AA8;--line:#2A2C34;--good-soft:#123324;--bad-soft:#3A1A1D;--shadow:0 2px 6px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.35)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--deep);outline-offset:2px;border-radius:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.86em;background:var(--surface2);padding:1px 6px;border-radius:6px;word-break:break-word}
.hidden{display:none!important}
/* pastel card helper: soft tint that stays readable in dark */
.pastel{background:var(--soft);color:#141417}
:root[data-theme="dark"] .pastel{background:color-mix(in srgb,var(--soft) 26%,#18191E);color:#F2F2F5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pastel{background:color-mix(in srgb,var(--soft) 26%,#18191E);color:#F2F2F5}}

/* layout */
.layout{min-height:100%;display:flex}
.side{display:none}
.view{flex:1;min-width:0;padding:22px 20px 120px}
.wrap{max-width:none;margin:0}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;padding:6px;border-radius:99px;background:color-mix(in srgb,var(--surface) 80%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--shadow);border:1px solid var(--line);z-index:10}
.dock button{width:52px;height:52px;border-radius:50%;border:0;background:var(--surface2);display:grid;place-items:center;color:var(--ink);position:relative}
.dock button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.dock svg,.side svg{width:22px;height:22px}
.dot{position:absolute;top:8px;right:9px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center}
@media (min-width:900px){
  .side{display:flex;flex-direction:column;gap:8px;position:sticky;top:0;height:100vh;width:240px;flex:none;padding:28px 18px;border-right:1px solid var(--line);background:var(--surface)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem;margin:0 6px 26px}
  .brand i{width:38px;height:38px;border-radius:12px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-style:normal}
  .side button{display:flex;align-items:center;gap:12px;border:0;background:none;border-radius:14px;padding:12px 14px;font-weight:700;color:var(--muted);text-align:left;position:relative}
  .side button[aria-current="page"]{background:var(--ink);color:var(--bg)}
  .side .dot{position:static;margin-left:auto}
  .side .foot{margin-top:auto;font-size:12.5px;color:var(--muted);padding:0 8px}
  .dock{display:none}
  .view{padding:34px 40px 60px}
}

/* header */
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.hdr .who b{display:block;font-size:1.05rem}
.hdr .who span{color:var(--muted);font-size:14.5px}
.avatar{width:52px;height:52px;border-radius:50%;background:#F5CE3E;color:#141417;display:grid;place-items:center;font-weight:800;font-size:1.05rem;border:0}
.h1{font-size:clamp(2rem,7vw,3rem);font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:0 0 20px}
.search{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:0 8px 0 18px;height:54px;margin-bottom:16px}
.search input{flex:1;border:0;background:none;outline:none;font-size:15px;min-width:0}
.search input::placeholder{color:var(--muted)}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.rbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.rbtn svg{width:20px;height:20px}
.chips{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;margin:0 -20px 14px;padding-left:20px;padding-right:20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;border:0;border-radius:99px;padding:10px 10px 10px 18px;font-weight:600;font-size:14.5px}
.chip i{font-style:normal;background:rgba(255,255,255,.7);color:#141417;border-radius:99px;min-width:28px;height:28px;display:grid;place-items:center;font-size:12.5px;font-weight:800}
@media (min-width:900px){.chips{margin:0 0 18px;padding:2px 0 10px;flex-wrap:wrap}}

.grid{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}.grid>div{min-width:0}
@media (min-width:900px){.grid{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 12px}
.sec h2{font-size:1.25rem;font-weight:800;letter-spacing:-.02em;margin:0}
.sec a,.sec button{border:0;background:none;color:var(--accent);font-weight:700;font-size:14.5px;padding:0}

/* featured */
.feat{position:relative;border-radius:30px;padding:26px 24px 22px;overflow:hidden;min-height:300px;display:flex;flex-direction:column}
.feat .tag{font-size:13px;font-weight:700;opacity:.65;margin-bottom:6px}
.feat h3{font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.05;letter-spacing:-.03em;margin:0;max-width:70%;font-weight:800;position:relative}
.feat .art{position:absolute;right:-4px;top:18px;font-size:clamp(3.8rem,15vw,7.5rem);line-height:1;transform:rotate(-8deg);filter:drop-shadow(0 12px 18px rgba(0,0,0,.12))}
.feat .blob{position:absolute;right:-60px;top:-50px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.35)}
.stack{display:flex;align-items:center;margin:16px 0 0}
.stack span{width:34px;height:34px;border-radius:50%;border:2px solid var(--soft);background:rgba(255,255,255,.85);display:grid;place-items:center;font-size:15px;margin-right:-8px;color:#141417}
.stack span.n{background:#141417;color:#fff;font-size:11.5px;font-weight:800;border-color:#141417}
.startbar{margin-top:auto;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.55);border-radius:99px;padding:8px 8px 8px 22px;border:0;width:100%;font-weight:600;color:inherit;position:relative;margin-top:28px}
:root[data-theme="dark"] .startbar{background:rgba(255,255,255,.08)}
.play{width:52px;height:52px;border-radius:50%;background:#141417;color:#fff;display:grid;place-items:center;flex:none}
.play svg{width:20px;height:20px;margin-left:3px}

/* list items */
.item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:0;border-radius:20px;padding:10px 14px 10px 10px;margin-bottom:10px;box-shadow:var(--shadow)}
.thumb{width:66px;height:66px;border-radius:16px;display:grid;place-items:center;font-size:1.9rem;flex:none;position:relative;overflow:hidden}
.thumb b{position:absolute;left:6px;bottom:4px;font-size:11px;font-weight:800;opacity:.6}
.item .tx{flex:1;min-width:0}
.item .tt{display:block;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sb{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.item .row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);margin-top:4px;gap:8px}
.item .pc{color:var(--good);font-weight:700;white-space:nowrap}
.item.dark{background:var(--ink);color:var(--bg)}
.item.dark .sb,.item.dark .row{color:inherit;opacity:.7}

/* calendar */
.cal{background:var(--surface);border-radius:28px;padding:18px 16px;box-shadow:var(--shadow)}
.cal .mo{display:flex;align-items:center;justify-content:center;gap:16px;font-weight:700;margin-bottom:14px}
.cal .mo button{border:0;background:none;font-size:1.3rem;width:34px;height:34px;border-radius:50%}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.day{border-radius:99px;padding:10px 0;display:flex;flex-direction:column;gap:10px;font-size:13.5px;color:var(--muted);position:relative}
.day b{color:var(--ink);font-weight:600}
.day.today{background:var(--ink);color:var(--bg)}
.day.today b{color:var(--bg)}
.day.did::after{content:"";position:absolute;bottom:3px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--accent)}
.calnote{margin:14px 4px 0;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);display:flex;justify-content:space-between}
.calnote b{color:var(--ink)}

/* progress cards */
.pcards{display:flex;gap:14px;overflow-x:auto;margin:0 -20px;padding:4px 20px 10px;scrollbar-width:none;scroll-snap-type:x mandatory}
.pcards::-webkit-scrollbar{display:none}
.pc2{flex:none;width:230px;scroll-snap-align:start;border:0;text-align:left;border-radius:26px;padding:16px 18px 18px;position:relative;overflow:hidden}
.pc2 .ib{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.85);display:grid;place-items:center;font-size:1.3rem;margin-bottom:26px;color:#141417}
.pc2 .dots3{position:absolute;right:18px;top:26px;font-weight:800;letter-spacing:2px;opacity:.7}
.pc2 .nm{font-weight:700;display:block;margin-bottom:12px;line-height:1.25;min-height:2.5em}
.pbar{display:block;height:6px;border-radius:99px;background:rgba(255,255,255,.6);overflow:hidden;margin-bottom:12px}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--deep)}
.pc2 .ft{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;opacity:.75}
.pc2 .star{position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:40% 60% 55% 45%;background:rgba(255,255,255,.3);transform:rotate(20deg)}
@media (min-width:900px){.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));overflow:visible;margin:0;padding:4px 0 0}.pc2{width:auto}}

/* module page */
.mtop{display:flex;justify-content:space-between;margin-bottom:22px}
.mtitle{font-size:clamp(1.9rem,6vw,2.8rem);font-weight:800;letter-spacing:-.03em;line-height:1.08;margin:0 0 18px;max-width:18ch}
.banner{border-radius:30px;height:220px;display:grid;place-items:center;position:relative;overflow:hidden;margin-bottom:18px}
.banner .art{font-size:6.5rem;filter:drop-shadow(0 16px 24px rgba(0,0,0,.14));position:relative;z-index:1}
.banner .c1{position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.3);left:-60px;bottom:-120px}
.banner .c2{position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.35);right:-30px;top:-40px}
.banner .pl{position:absolute;right:18px;bottom:18px;z-index:2}
.metas{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:24px}
.meta{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14.5px}
.meta .rbtn{width:46px;height:46px}
.mdesc{color:var(--muted);margin:-8px 0 22px;max-width:60ch}
@media (min-width:900px){.mgrid>div{min-width:0}.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:start}.banner{height:300px}}

/* lexique */
.lexgrid{display:grid;gap:10px}
@media (min-width:700px){.lexgrid{grid-template-columns:1fr 1fr}}
@media (min-width:1200px){.lexgrid{grid-template-columns:1fr 1fr 1fr}}
.gitem{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;align-self:start}
.gitem>button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;padding:15px 18px}
.gitem .k{font-weight:800}
.gitem .c{font-size:12px;color:var(--muted);background:var(--surface2);border-radius:99px;padding:3px 10px;margin-left:auto;white-space:nowrap}
.gitem .d{padding:0 18px 16px;font-size:14.5px;display:none}
.gitem.open .d{display:block}
.gitem .an{color:var(--muted);font-style:italic;margin-top:6px}
.fchips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 14px;padding:0 20px 6px;scrollbar-width:none}
.fchip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:600}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (min-width:900px){.fchips{margin:0 0 16px;padding:0;flex-wrap:wrap}}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.rgrid{display:grid;gap:10px}
@media (min-width:900px){.rgrid{grid-template-columns:1fr 1fr}}

/* story */
.story{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;align-items:stretch;justify-content:center}
.story-in{width:100%;max-width:600px;display:flex;flex-direction:column;min-height:0;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){.story{background:rgba(15,16,19,.55);backdrop-filter:blur(6px);align-items:center}.story-in{background:var(--bg);border-radius:34px;height:min(860px,92vh);padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.3)}}
.segs{display:flex;gap:4px;margin:2px 4px 12px}
.seg{flex:1;height:4px;border-radius:99px;background:var(--line)}
.seg.on{background:var(--ink)}
.shead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.shead .st{flex:1;min-width:0;font-weight:700;line-height:1.25;font-size:15px}
.shead .st small{display:block;color:var(--muted);font-weight:500;font-size:12.5px}
.card{flex:1;min-height:0;overflow-y:auto;background:var(--surface);border-radius:30px;box-shadow:var(--shadow);display:flex;flex-direction:column;cursor:pointer;user-select:none}
.card.in{animation:sl .25s cubic-bezier(.2,.8,.2,1)}.card.bk{animation:slb .25s cubic-bezier(.2,.8,.2,1)}
@keyframes sl{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes slb{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.cover{margin:10px 10px 0;border-radius:24px;min-height:150px;display:grid;place-items:center;font-size:4.2rem;flex:none;position:relative;overflow:hidden}
.cover::before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.3);right:-50px;top:-60px}
.cover span{position:relative;filter:drop-shadow(0 10px 16px rgba(0,0,0,.12))}
.cbody{padding:22px 22px 22px;display:flex;flex-direction:column;flex:1}
.cbody h2{font-size:clamp(1.5rem,5.6vw,1.9rem);font-weight:800;letter-spacing:-.025em;line-height:1.15;margin:0 0 12px}
.cbody p{font-size:1.07rem;line-height:1.62;margin:0 0 10px}
.term{all:unset;cursor:pointer;font-weight:700;color:var(--deep);border-bottom:2px dotted currentColor;line-height:1.2}
:root[data-theme="dark"] .term{color:color-mix(in srgb,var(--deep) 55%,#fff)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .term{color:color-mix(in srgb,var(--deep) 55%,#fff)}}
.term:focus-visible{outline:2px solid var(--deep);border-radius:4px}
.morebtn{align-self:flex-start;border:0;background:var(--surface2);border-radius:99px;padding:9px 16px;font-weight:700;font-size:14px;margin-top:6px}
.more{display:none;margin-top:10px;padding:14px 16px;border-radius:18px;background:var(--surface2);font-size:15px;line-height:1.55}
.more.show{display:block}
.hint{margin-top:auto;padding-top:14px;font-size:13px;color:var(--muted);text-align:center}
.qtag{display:inline-block;font-size:12.5px;font-weight:800;border-radius:99px;padding:5px 12px;margin-bottom:14px;align-self:flex-start}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid var(--line);border-radius:20px;padding:14px 16px;background:var(--surface);font-size:1.02rem;line-height:1.35;font-weight:600}
.opt.good{border-color:var(--good);background:var(--good-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.exp{display:none;margin-top:12px;padding:14px 16px;border-radius:18px;background:var(--surface2);font-size:15.5px}
.exp.show{display:block}
.cta{margin-top:14px;border:0;border-radius:99px;padding:16px;background:var(--ink);color:var(--bg);font-weight:800;font-size:1rem;width:100%}
.cta.alt{background:var(--surface2);color:var(--ink)}
.recap{list-style:none;padding:0;margin:0}
.recap li{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);line-height:1.45}
.recap li:last-child{border-bottom:0}
.recap li::before{content:"✓";flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:12px;font-weight:800;display:grid;place-items:center;margin-top:1px}
.end{text-align:center;align-items:center;justify-content:center}
.score{font-size:4rem;font-weight:800;letter-spacing:-.04em;margin:4px 0}
.bigemo{font-size:3.4rem}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(15,16,19,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:30px 30px 0 0;padding:10px 24px calc(26px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@media (min-width:900px){.scrim{align-items:center}.sheet{border-radius:30px;max-width:480px}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 18px}
.sheet h3{margin:4px 0 0;font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.sheet .cat{font-size:12.5px;font-weight:800;color:var(--accent)}
.sheet p{margin:10px 0 0}
.sheet .an{color:var(--muted);font-style:italic}

/* v3 refinements */
.ico{display:inline-block;vertical-align:middle;flex:none}
.chip .ci{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.65);display:grid;place-items:center;margin-left:-8px;color:var(--deep)}
.chip{padding-left:14px}
.thumb{color:var(--deep)}
:root[data-theme="dark"] .thumb.pastel{color:color-mix(in srgb,var(--deep) 45%,#fff)}
.feat .mascot{position:absolute;right:-8px;bottom:64px;width:min(46%,210px);height:auto}
.feat h3{max-width:58%}
.stack span{color:var(--deep)}
.stack span.n{color:#fff}
.banner .mascot{width:190px;height:auto;position:relative;z-index:1}
.banner .badge{position:absolute;left:22px;top:22px;width:56px;height:56px;border-radius:18px;background:rgba(255,255,255,.85);display:grid;place-items:center;color:var(--deep);z-index:2}
.pc2 .ib{color:var(--deep)}
.cover .bigico{width:92px;height:92px;border-radius:28px;background:rgba(255,255,255,.75);display:grid;place-items:center;color:var(--deep);position:relative;box-shadow:0 10px 24px rgba(0,0,0,.06)}
:root[data-theme="dark"] .cover .bigico{background:rgba(255,255,255,.1);color:color-mix(in srgb,var(--deep) 50%,#fff)}

/* ══════════════════════════════════════════════════════════════
   CONTENU DE LA FORMATION « PROCESS ITSM »
   (incidents, problèmes, changements, escalade, SLA)

   Ce fichier n'est pas chargé tel quel : tools/formation/build.js process
   l'insère dans le moteur de la formation DigitalView pour produire
   public/formation/process.html. Après modification :
       node tools/formation/build.js process

   Format (celui du moteur DigitalView) :
     G      glossaire   { terme: { c: catégorie, d: définition, a: image } }
     M1…Mn  sessions    [{ id, t, cards: [...] }]
     cartes  { i: icône, h: titre, p: [paragraphes], m: mémo }
             { q: question, o: [options], a: index bonne réponse, e: explication }
             { w: widget }            (voir W plus bas)
             { r: [points à retenir] }
     [[terme]] dans un texte ouvre la définition du glossaire.

   Le contenu suit les règles réelles d'EMOC, lues dans le tracker : types
   de tickets, matrice SLA (config.sla_hours), On Hold qui gèle le SLA,
   seuil Near Breach à 20 %, cible MTTD de 5 min, mode drill 08:30-17:30.
   Si une règle change dans le tracker, la changer ici aussi.
   ══════════════════════════════════════════════════════════════ */

var G={
/* Process */
"ITSM":{c:"Process",d:"IT Service Management : l'ensemble des process qui permettent de délivrer et de maintenir un service informatique. Incident, problème, changement et demande en sont les piliers.",a:"Le code de la route de l'exploitation."},
"ITIL":{c:"Process",d:"Le référentiel de bonnes pratiques le plus utilisé en ITSM. Nos process (incident, problème, changement) en reprennent le vocabulaire."},
"Incident":{c:"Process",d:"Une interruption ou une dégradation non prévue d'un service. Le but de la gestion des incidents : rétablir le service le plus vite possible, pas forcément trouver la cause.",a:"Le pompier : il éteint le feu d'abord."},
"Problème":{c:"Process",d:"La cause inconnue d'un ou plusieurs incidents. La gestion des problèmes cherche la cause racine pour que l'incident ne revienne pas.",a:"L'enquêteur : il cherche pourquoi le feu a pris."},
"Problem Bug":{c:"Process",d:"Dans EMOC, un problème dont la cause est un défaut logiciel. Il a deux échéances SLA : une pour le contournement, une pour la correction définitive."},
"Problem non Bug":{c:"Process",d:"Dans EMOC, un problème dont la cause n'est pas un défaut logiciel : configuration, capacité, matériel, process, erreur humaine. Une seule échéance SLA."},
"Changement":{c:"Process",d:"Tout ajout, modification ou suppression qui peut avoir un effet sur un service : mise à jour, nouvelle configuration, migration. Un changement se prépare, s'approuve et se planifie.",a:"La chirurgie programmée, par opposition aux urgences."},
"Demande de service":{c:"Process",d:"Une sollicitation standard, sans panne : un accès, une information, un export. Elle suit un circuit prévu d'avance et ne doit pas être traitée comme un incident."},
"Événement":{c:"Process",d:"Un changement d'état détecté par la supervision. Tous les événements ne sont pas des incidents : une bascule réussie est un événement, pas une panne."},
"Alarme":{c:"Process",d:"Un événement qui signale une anomalie et appelle une action. Dans EMOC, la plupart des incidents naissent d'une alarme vue en supervision (DigitalView)."},
"Incident majeur":{c:"Process",d:"Un incident à fort impact (souvent P1) qui demande une organisation dédiée : un coordinateur, un point de communication régulier, une revue après coup."},
"Erreur connue":{c:"Process",d:"Un problème dont la cause racine est identifiée et documentée, avec un contournement. Elle permet de traiter les incidents suivants beaucoup plus vite.",a:"La fiche « on connaît, voici quoi faire »."},
"Contournement":{c:"Process",d:"Une solution temporaire qui rétablit le service sans supprimer la cause. Dans EMOC, sa date se note dans Workaround Date."},
"Cause racine":{c:"Process",d:"La cause première d'un problème : celle qui, supprimée, empêche l'incident de revenir. À distinguer du symptôme et de la cause immédiate."},
"RCA":{c:"Méthode",d:"Root Cause Analysis : l'analyse qui remonte jusqu'à la cause racine. Dans EMOC, elle se résume dans RC Description et se lie dans RCA Link."},
"CAB":{c:"Process",d:"Change Advisory Board : l'instance qui examine et approuve les changements normaux, en pesant risque, impact et planning."},
"Gel des changements":{c:"Process",d:"Une période pendant laquelle on évite tout changement non urgent : fin d'année, événement client, campagne commerciale. Le risque d'un changement y coûte plus cher."},
"PIR":{c:"Méthode",d:"Post-Incident Review : la revue faite après un incident majeur. Chronologie, ce qui a marché, ce qui n'a pas marché, actions pour la suite. Sans recherche de coupable."},
/* SLA */
"SLA":{c:"SLA",d:"Service Level Agreement : l'engagement de délai pris envers le client. Dans EMOC, il dépend du type de ticket et de la priorité, et se calcule à partir de la détection.",a:"Le chrono que le client regarde."},
"Priorité":{c:"SLA",d:"P1 à P4. Elle fixe le délai SLA et l'ordre de traitement. Elle se déduit de l'impact et de l'urgence."},
"Sévérité":{c:"SLA",d:"Critical, Major, Minor, Warning. Elle décrit la gravité technique de l'alarme ou de la panne. Elle aide à fixer la priorité mais ne la remplace pas."},
"Impact":{c:"SLA",d:"Ce que la panne touche : combien d'utilisateurs, de services, de sites, et à quel point. Un des deux axes de la priorité."},
"Urgence":{c:"SLA",d:"La vitesse à laquelle l'impact devient grave si on ne fait rien. Le second axe de la priorité."},
"Near Breach":{c:"SLA",d:"Dans EMOC : le ticket est encore dans les délais, mais il reste moins de 20 % du temps SLA. C'est le signal pour escalader, pas pour attendre."},
"Breach":{c:"SLA",d:"Rupture de SLA : l'échéance est dépassée sans résolution. Une rupture se voit dans le tableau de bord, le rapport hebdo et la notation."},
"On Hold":{c:"SLA",d:"Statut qui gèle le SLA : le chrono s'arrête à la mise en attente et reprend à la sortie. À réserver aux attentes qui ne dépendent pas de nous, et à justifier."},
"Mode calendaire":{c:"SLA",d:"Tous les jours comptent, week-ends compris. C'est le cas des incidents P1 et P2 dans EMOC."},
"Mode ouvré":{c:"SLA",d:"Seuls les jours ouvrés comptent (lundi à vendredi). C'est le cas des incidents P3 et P4 et de la plupart des problèmes."},
"Mode drill":{c:"SLA",d:"Réglage global d'EMOC : seules les heures de 08:30 à 17:30 comptent, soit 9 h par jour. En mode live, toutes les heures comptent (24/7)."},
"Detection Time":{c:"SLA",d:"Le moment où l'équipe a vu l'anomalie. C'est le point de départ du SLA dans EMOC, et la fin du MTTD."},
"Occur Time":{c:"SLA",d:"Le moment où la panne s'est réellement produite (début de l'alarme). L'écart avec Detection Time, c'est le temps de détection."},
"Workaround Date":{c:"SLA",d:"La date à laquelle un contournement a rétabli le service. Pour un Problem Bug, c'est elle qui ferme la première échéance SLA."},
/* Indicateurs */
"MTTD":{c:"Indicateur",d:"Mean Time To Detect : temps moyen entre l'apparition de la panne et sa détection. La cible du Front Office EMOC : 5 minutes au plus.",a:"Le temps de réaction du guetteur."},
"MTTR":{c:"Indicateur",d:"Mean Time To Resolve : temps moyen entre l'ouverture et la résolution. Il mesure la vitesse de rétablissement."},
"Taux SLA":{c:"Indicateur",d:"La part des tickets traités dans les délais. L'objectif d'équipe se règle dans le tracker (page Objectifs)."},
"Backlog":{c:"Indicateur",d:"Les tickets encore ouverts. Un backlog qui grossit de semaine en semaine est un signal à expliquer en revue."},
"Data quality":{c:"Indicateur",d:"La complétude et la cohérence des tickets : champs obligatoires remplis, dates logiques, statut à jour. Un ticket mal rempli fausse tous les indicateurs."},
/* Rôles et outils */
"Front Office":{c:"Rôle",d:"Le niveau 1 d'EMOC, à Dakar et Abidjan : il surveille, détecte, ouvre le ticket, qualifie, fait le premier diagnostic, escalade et suit jusqu'à la clôture.",a:"La tour de contrôle."},
"Back Office":{c:"Rôle",d:"Le niveau d'expertise derrière le Front Office (BO Handling dans le ticket). Il reprend ce que le FO ne peut pas résoudre seul."},
"N2":{c:"Rôle",d:"Le deuxième niveau de support, plus expert. Dans le langage courant de l'équipe, souvent synonyme de Back Office."},
"Escalade fonctionnelle":{c:"Rôle",d:"Passer le ticket à un niveau plus expert (BO, expert produit, éditeur) parce qu'on n'a pas la compétence ou les accès."},
"Escalade hiérarchique":{c:"Rôle",d:"Prévenir le management parce que l'impact, le délai ou le client l'exigent. Elle ne remplace pas l'escalade fonctionnelle, elle s'y ajoute."},
"Coordinateur d'incident":{c:"Rôle",d:"Pendant un incident majeur, la personne qui pilote : elle ne répare pas, elle organise, décide et fait communiquer."},
"OCEANE":{c:"Outil",d:"L'outil de ticketing côté client. Son numéro (Oceane TT#) se reporte dans le ticket EMOC pour relier les deux mondes."},
"IMOC TT":{c:"Outil",d:"La référence du ticket dans l'outil IMOC, quand il existe. À reporter pour pouvoir retrouver l'échange de part et d'autre."},
"DigitalView":{c:"Outil",d:"La plateforme de supervision d'où viennent la plupart des alarmes. Sa formation dédiée est dans le menu DigitalView."},
"Handover":{c:"Outil",d:"La relève entre deux shifts : tickets ouverts, points en cours, consignes. Elle se prépare avant la fin du shift sur le Handover Board."},
"Observation":{c:"Outil",d:"Une remarque datée dans le tracker : anomalie, incident de plateforme, dérive de process. Les Observations alimentent les explications du rapport Dakar × Abidjan."},
"Daily Check-up":{c:"Outil",d:"La liste des vérifications et tâches du jour, avec leurs occurrences récurrentes. Son taux de réalisation entre dans la note de performance."},

 {i:"Layers",h:"Deux idées pour tout tenir",p:["Le [[Système de valeur des services|système de valeur des services]] montre comment une demande devient de la valeur.","Les [[Quatre dimensions|quatre dimensions]] rappellent tout ce qu'il faut regarder pour qu'un service marche vraiment."]},
 {q:"Chez EMOC, comment utiliser ITIL 4 ?",o:["En appliquant chaque pratique telle qu'écrite","En reprenant ce qui aide l'équipe et en l'adaptant à nos outils","Uniquement pour la certification"],a:1,e:"ITIL 4 se veut souple : on part de ce qui existe et on adopte ce qui améliore le service."},
 {i:"Handshake",h:"Ce qui change avec la version 4",p:["Le centre de gravité passe des process à la [[Valeur|valeur]] créée avec le client.","Agilité, DevOps, automatisation et travail en équipe y ont toute leur place."]},
 {r:["ITIL 4 : un guide de bonnes pratiques, à adapter.","Deux piliers : le système de valeur des services et les quatre dimensions.","Le but n'est pas le process, c'est la valeur pour le client."]}
]},
{id:"i2",t:"La valeur se crée à deux",cards:[
 {i:"Sparkles",h:"La valeur",p:["C'est ce que le client juge utile et important dans le service, pas ce que le fournisseur pense avoir livré.","Elle se mesure du côté de celui qui consomme le service."]},
 {i:"Users",h:"Co-créée",p:["Le fournisseur ne crée pas la valeur seul : le client y contribue.","Chez EMOC, le client décrit l'impact, donne les accès, confirme le rétablissement. Sans lui, pas de résolution rapide."]},
 {q:"Qui crée la valeur d'un service ?",o:["Le fournisseur seul","Le fournisseur et le client, ensemble","Le client seul"],a:1,e:"C'est la [[Co-création de valeur|co-création de valeur]] : chacun apporte sa part."},
 {i:"Target",h:"Livrable ou résultat ?",p:["Un [[Output|livrable]] est ce que l'on produit : un ticket fermé, un rapport envoyé.","Un [[Résultat|résultat]] est ce que le client obtient : son service qui tourne, une décision qu'il peut prendre."]},
 {q:"Un P2 est fermé dans les temps, mais le client subit encore des coupures. Qu'a-t-on livré ?",o:["Un résultat","Un livrable, sans le résultat attendu","Les deux"],a:1,e:"Le ticket fermé est un livrable. Le résultat, c'est un service stable : il n'est pas atteint."},
 {i:"Scale",h:"Coûts et risques",p:["Un service retire au client des coûts et des risques (il n'a pas à superviser lui-même).","Il lui en impose aussi : le prix, la dépendance à un prestataire. La valeur, c'est le bilan des deux."]},
 {r:["La valeur se juge côté client.","Elle se co-crée : le client a sa part dans la résolution.","Un ticket fermé est un livrable ; un service stable est un résultat."]}
]},
{id:"i3",t:"Utilité, garantie et offre",cards:[
 {i:"Puzzle",h:"L'utilité",p:["Le service répond-il au besoin ? C'est l'[[Utilité|utilité]], « adapté à l'usage ».","Exemple : la supervision voit bien les alarmes des équipements du client."]},
 {i:"ShieldCheck",h:"La garantie",p:["Le service tient-il ses promesses dans la durée ? C'est la [[Garantie|garantie]].","Disponibilité, capacité, sécurité, continuité : la supervision tourne de jour comme de nuit, même en cas de panne d'un site."]},
 {q:"La supervision détecte bien les pannes, mais l'outil tombe deux heures par semaine. Qu'est-ce qui manque ?",o:["L'utilité","La garantie","Les deux"],a:1,e:"Le service fait ce qu'il faut (utilité), mais pas de façon fiable (garantie). Il faut les deux pour créer de la valeur."},
 {i:"Package",h:"L'offre de service",p:["Ce que le fournisseur propose, sous forme de biens, d'accès à des ressources et d'actions.","Pour EMOC : l'accès au suivi des tickets, la supervision 24/7, les escalades et les rapports."]},
 {i:"Handshake",h:"La relation de service",p:["Fournir, consommer, et gérer la relation entre les deux.","Les points réguliers avec le client et le reporting font partie de la relation, pas du décor."]},
 {r:["Utilité : le service sert. Garantie : il sert de façon fiable.","Sans l'une ou l'autre, pas de valeur.","L'offre réunit biens, accès et actions ; la relation se gère aussi."]}
]},
{id:"i4",t:"Les quatre dimensions",cards:[
 {i:"Compass",h:"Regarder partout",p:["Un service ne tient pas seulement à l'outil.","ITIL 4 propose quatre angles à vérifier pour tout service ou tout changement."]},
 {w:"dims"},
 {q:"On installe un nouvel outil de supervision, sans former l'équipe. Quelle dimension est oubliée ?",o:["Information et technologie","Organisations et personnes","Partenaires et fournisseurs"],a:1,e:"L'outil est là, mais les personnes ne savent pas l'utiliser. La dimension humaine est négligée."},
 {i:"Globe",h:"Les facteurs extérieurs",p:["Politique, économie, société, technologie, droit, environnement : le contexte pèse sur les quatre dimensions.","Exemple : une règle sur les données personnelles change ce qu'on peut écrire dans un ticket."]},
 {q:"Un fournisseur d'équipements ne répond plus aux escalades. Quelle dimension est touchée ?",o:["Partenaires et fournisseurs","Flux de valeur et processus","Information et technologie"],a:0,e:"Nos résultats dépendent aussi de nos partenaires : il faut gérer cette dépendance."},
 {r:["Organisations et personnes ; information et technologie ; partenaires et fournisseurs ; flux de valeur et processus.","Oublier une dimension fragilise le service.","Le contexte extérieur pèse sur les quatre."]}
]},
{id:"i5",t:"Le système de valeur des services",cards:[
 {i:"Workflow",h:"De la demande à la valeur",p:["En entrée : une opportunité ou une demande. En sortie : de la valeur pour le client et pour l'entreprise.","Le [[Système de valeur des services|système de valeur]] décrit ce qui relie les deux."]},
 {i:"Boxes",h:"Ses cinq éléments",p:["Les [[Principes directeurs|principes directeurs]], la gouvernance, la [[Chaîne de valeur|chaîne de valeur]], les [[Pratique|pratiques]] et l'[[Amélioration continue|amélioration continue]].","Ils travaillent ensemble : aucun ne suffit seul."]},
 {q:"Quel est le principal ennemi que le système de valeur combat ?",o:["Le manque d'outils","Le travail en silos","Le nombre de tickets"],a:1,e:"Chaque équipe qui optimise dans son coin peut casser le résultat d'ensemble. Le système de valeur pousse à voir de bout en bout."},
 {i:"Building2",h:"La gouvernance",p:["Elle oriente et contrôle : priorités, règles, suivi des résultats.","Chez EMOC, ce sont les objectifs SLA fixés avec le client et la revue Dakar × Abidjan."]},
 {r:["Entrée : opportunité ou demande. Sortie : valeur.","Cinq éléments : principes, gouvernance, chaîne de valeur, pratiques, amélioration continue.","But : casser les silos, voir de bout en bout."]}
]},
{id:"i6",t:"Les sept principes directeurs",cards:[
 {i:"Flag",h:"Des repères pour décider",p:["Sept [[Principes directeurs|principes]] valables pour toute situation, quelle que soit la méthode.","Ils aident surtout quand aucune procédure ne dit quoi faire."]},
 {w:"principes"},
 {q:"On veut refaire le tableau de bord SLA. Par quoi commencer ?",o:["Tout jeter et repartir de zéro","Regarder ce qui marche déjà dans l'actuel et le garder","Acheter un nouvel outil"],a:1,e:"Commencer là où l'on est : l'existant contient souvent l'essentiel."},
 {q:"On veut automatiser l'ouverture des tickets à partir des alarmes. Que faire d'abord ?",o:["Automatiser tout de suite","Simplifier et fiabiliser la règle d'ouverture, puis automatiser","Ne jamais automatiser"],a:1,e:"Optimiser, puis automatiser : automatiser un mauvais processus ne fait que produire des erreurs plus vite."},
 {q:"Dakar améliore son taux SLA en reclassant des tickets en P4. Quel principe est oublié ?",o:["Privilégier la valeur","Rester simple","Avancer par itérations"],a:0,e:"Le chiffre s'améliore, le client n'y gagne rien. La valeur pour le client passe avant l'indicateur."},
 {r:["Valeur, existant, itérations, collaboration, vision d'ensemble, simplicité, optimiser puis automatiser.","Ils guident les décisions sans procédure.","On les combine : rarement un seul à la fois."]}
]},
{id:"i7",t:"La chaîne de valeur",cards:[
 {i:"Waypoints",h:"Six activités",p:["La [[Chaîne de valeur|chaîne de valeur]] décrit six activités qui transforment une demande en valeur.","Elles se combinent dans un ordre différent selon le besoin."]},
 {w:"chaine"},
 {i:"Siren",h:"Un flux de valeur chez nous",p:["Une alarme critique : s'engager (prévenir le client), délivrer et assurer le support (diagnostic, rétablissement), améliorer (RCA, erreur connue).","Ce parcours précis est un [[Flux de valeur|flux de valeur]]."]},
 {q:"Pendant un incident, prévenir le client et le tenir informé relève de quelle activité ?",o:["Planifier","S'engager","Obtenir/construire"],a:1,e:"S'engager, c'est la relation avec les parties prenantes : comprendre, informer, rassurer."},
 {q:"Après trois P2 identiques, on ouvre un problème et on met à jour la base de connaissances. Quelle activité ?",o:["Améliorer","Concevoir et faire la transition","Délivrer et assurer le support"],a:0,e:"On tire la leçon pour que ça ne se reproduise pas : c'est améliorer."},
 {r:["Planifier, améliorer, s'engager, concevoir et faire la transition, obtenir/construire, délivrer et assurer le support.","Un flux de valeur enchaîne certaines de ces activités pour un cas précis.","Le traitement d'une alarme est un flux de valeur."]}
]}
];

var st=gs('itf-state')||{};st.done=st.done||{};st.pos=st.pos||{};st.miss=st.miss||[];st.best=st.best||{};st.days=st.days||[];st.xp=st.xp||0;

function lvl(x){var i=0;while(i<LV.length-1&&x>=LV[i+1][0])i++;var nx=LV[i+1]?LV[i+1][0]:null;return {n:i+1,name:LV[i][1],cur:LV[i][0],next:nx,p:nx?(x-LV[i][0])/(nx-LV[i][0]):1}}

var sync={ref:null,status:'local',timer:null};
function save(){ss('itf-state',st);if(sync.ref){clearTimeout(sync.timer);sync.timer=setTimeout(push,1200)}}
function push(){if(!sync.ref)return;var body=JSON.parse(JSON.stringify(st));body.updatedAt=Date.now();sync.ref.set(body).then(function(){setSync('ok')},function(e){if(e&&e.code==='unavailable'){setTimeout(push,2500+Math.random()*1500)}else setSync('err')})}
function mergeState(r){if(!r)return false;var before=JSON.stringify(st);
  Object.keys(r.done||{}).forEach(function(k){if(r.done[k])st.done[k]=true});
  Object.keys(r.pos||{}).forEach(function(k){if(!st.done[k]&&(st.pos[k]||0)<r.pos[k])st.pos[k]=r.pos[k]});
  Object.keys(st.pos).forEach(function(k){if(st.done[k])delete st.pos[k]});
  Object.keys(r.best||{}).forEach(function(k){if(st.best[k]==null||r.best[k]>st.best[k])st.best[k]=r.best[k]});
  (r.days||[]).forEach(function(d){if(st.days.indexOf(d)<0)st.days.push(d)});
  (r.miss||[]).forEach(function(m){if(st.miss.indexOf(m)<0)st.miss.push(m)});
  if((r.xp||0)>st.xp)st.xp=r.xp;if(r.xpInit)st.xpInit=1;
  function dnum(s){if(!s)return 0;var p=s.split('-');return +p[0]*10000+ +p[1]*100+ +p[2]}
  if(dnum(r.last)>dnum(st.last)||(r.last===st.last&&(r.streak||0)>(st.streak||0))){st.last=r.last;st.streak=r.streak||0}
  return JSON.stringify(st)!==before}
function setSync(s){sync.status=s;var el=document.getElementById('syncTag');if(el)el.innerHTML=syncLabel()}

function pull(){if(!sync.ref)return Promise.resolve();return sync.ref.get().then(function(snap){var changed=snap.exists?mergeState(snap.data()):false;ss('itf-state',st);if(changed&&document.getElementById('story').classList.contains('hidden'))render();push()},function(){setSync('err')})}
function initSync(){if(!CFG.sync||!window.claude||!window.claude.use)return;setSync('wait');
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){var db=r[0],u=r[1];if(!db||!u){setSync('local');return null}
    return u.id().then(function(uid){if(!uid){setSync('local');return}sync.ref=db.doc('data/users/'+uid+'/progress');return pull()})}).catch(function(){setSync('local')});
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')pull()});}

function dstr(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function bump(){var t=dstr(new Date());if(st.days.indexOf(t)<0){st.days.push(t);if(st.days.length>400)st.days.shift()}if(st.last!==t){var y=new Date();y.setDate(y.getDate()-1);st.streak=(st.last===dstr(y))?(st.streak||0)+1:1;st.last=t}save()}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function rich(s){return s.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,function(_,k,l){var key=GL[k.toLowerCase()];if(!key)return l||k;return '<button class="term" data-k="'+esc(key)+'">'+(l||k)+'</button>'})}
function plain(s){return s.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,function(_,k,l){return l||k}).replace(/<[^>]+>/g,'')}
function hueVars(m){return '--soft:'+m.soft+';--deep:'+m.deep}
function mDone(m){return m.S.filter(function(s){return st.done[s.key]}).length}
function sPct(s){return st.done[s.key]?100:Math.round((st.pos[s.key]||0)/s.cards.length*100)}
function nextSession(){for(var i=0;i<ALLS.length;i++)if(!st.done[ALLS[i].key])return ALLS[i];return null}
function themeToggle(){var c=root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');var x=c==='dark'?'light':'dark';root.setAttribute('data-theme',x);ss('dvf-theme',x)}

function navState(){[].forEach.call(document.querySelectorAll('[data-tab]'),function(b){b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false')});
  [].forEach.call(document.querySelectorAll('.dot'),function(d){d.textContent=st.miss.length;d.classList.toggle('hidden',!st.miss.length)})}

  return '<button class="item" data-s="'+esc(s.key)+'" style="'+hueVars(m)+'"><span class="thumb pastel">'+ico(m.ic,26,1.8)+'<b>'+(j+1)+'</b></span><span class="tx"><span class="tt">'+esc(s.t)+'</span><span class="sb">'+esc(m.t)+'</span><span class="row"><span>'+s.cards.length+' cartes</span><span class="pc">'+(st.done[s.key]?'Terminé':p?p+' % fait':'Nouveau')+'</span></span></span></button>'}

function bindItems(el){[].forEach.call(el.querySelectorAll('[data-s]'),function(b){b.onclick=function(){var s=ALLS.filter(function(x){return x.key===b.dataset.s})[0];if(s)chooseMode(s)}})}
var MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'],JR=['Lu','Ma','Me','Je','Ve','Sa','Di'];
function calHTML(){
  var t=new Date(),base=new Date(t);base.setDate(t.getDate()-((t.getDay()+6)%7)+calOff*7);
  var mid=new Date(base);mid.setDate(base.getDate()+3);
  var h='<section class="cal"><div class="mo"><button id="cp" aria-label="Semaine précédente">'+ico('ChevronLeft',18)+'</button><span>'+MOIS[mid.getMonth()].replace(/^./,function(c){return c.toUpperCase()})+' '+mid.getFullYear()+'</span><button id="cn" aria-label="Semaine suivante">'+ico('ChevronRight',18)+'</button></div><div class="days">';
  for(var i=0;i<7;i++){var d=new Date(base);d.setDate(base.getDate()+i);var ds=dstr(d);h+='<div class="day'+(ds===dstr(t)?' today':'')+(st.days.indexOf(ds)>=0?' did':'')+'"><span>'+JR[i]+'</span><b>'+d.getDate()+'</b></div>'}
  var wk=0;for(var k=0;k<7;k++){var dd=new Date(base);dd.setDate(base.getDate()+k);if(st.days.indexOf(dstr(dd))>=0)wk++}
  return h+'</div><div class="calnote"><span>Jours pratiqués cette semaine</span><b>'+wk+' / 7</b></div></section>'}
function bindCal(){var p=document.getElementById('cp'),n=document.getElementById('cn');if(!p)return;p.onclick=function(){calOff--;document.querySelector('.cal').outerHTML=calHTML();bindCal()};n.onclick=function(){calOff++;document.querySelector('.cal').outerHTML=calHTML();bindCal()}}

/* ---------- shared answer logic ---------- */
function toast(txt,icn){var t=document.createElement('div');t.className='toast';t.innerHTML=ico(icn||'Zap',16)+txt;document.body.appendChild(t);setTimeout(function(){t.remove()},1500)}
function addXP(n){st.xp+=n}
function scoreAnswer(ctx,c,k){var ok=k===c.a,mi=st.miss.indexOf(c.key);
  if(ok){ctx.good++;ctx.combo++;var gain=10+(ctx.combo>1?5:0);addXP(gain);toast('+'+gain+' XP','Zap');if(mi>=0&&ctx.mode!=='lesson')st.miss.splice(mi,1)}
  else{ctx.combo=0;addXP(2);if(mi<0)st.miss.push(c.key)}
  save();return ok}
function qHTML(c,label,ans){var h='<span class="qtag pastel">'+esc(label)+'</span><h2 class="qq">'+rich(c.q)+'</h2><div class="opts">'+c.o.map(function(o,k){var cls='opt';if(ans){if(k===c.a)cls+=' good';else if(k===ans.k)cls+=' bad'}return '<button class="'+cls+'" data-k="'+k+'"'+(ans?' disabled':'')+'>'+rich(o)+'</button>'}).join('')+'</div>';
  h+='<div class="exp'+(ans?' show':'')+'">'+(ans?expHTML(c,ans.ok):'')+'</div>';return h}
function expHTML(c,ok){return '<span class="ei" style="color:'+(ok?'var(--good)':'var(--accent)')+'">'+ico(ok?'CircleCheck':'Lightbulb',20)+'</span><span><b>'+(ok?'Exact.':'Pas tout à fait.')+'</b> '+rich(c.e)+'</span>'}
function bindQ(box,c,ctx,idx,after){[].forEach.call(box.querySelectorAll('.opt'),function(b){b.onclick=function(e){e.stopPropagation();if(ctx.ans[idx])return;var k=+b.dataset.k,ok=scoreAnswer(ctx,c,k);ctx.ans[idx]={k:k,ok:ok};
  [].forEach.call(box.querySelectorAll('.opt'),function(x){x.disabled=true;if(+x.dataset.k===c.a)x.classList.add('good')});if(!ok)b.classList.add('bad');
  var ex=box.querySelector('.exp');ex.innerHTML=expHTML(c,ok);ex.classList.add('show');bindTerms(ex);if(after)after(ok)}})}
function coverHTML(c,small){
  if(typeof c.i==='string'&&c.i.charAt(0)==='#')return '<div class="cover pastel'+(small?' small':'')+'"><span class="dots"></span><span class="bigico"><span class="num">'+c.i.slice(1)+'</span></span></div>';
  return '<div class="cover pastel'+(small?' small':'')+'" aria-hidden="true"><span class="dots"></span><span class="bigico">'+ico(c.i,44,1.7)+'</span></div>'}
function bindTerms(el){[].forEach.call(el.querySelectorAll('.term'),function(t){t.onclick=function(e){e.stopPropagation();showTerm(t.dataset.k)}})}
function finishSession(ctx){var s=ctx.sess,nq=s.cards.filter(function(c){return c.q}).length,firstTime=!st.done[s.key];
  if(firstTime){addXP(30);if(nq&&ctx.good===nq)addXP(20)}
  bump();st.done[s.key]=true;delete st.pos[s.key];save();
  return {nq:nq,L:lvl(st.xp),gained:st.xp-ctx.xp0,up:lvl(st.xp).n>ctx.lv0,nx:s.mod.S[s.mod.S.indexOf(s)+1]||null}}
function newCtx(s,mode){return {sess:s,mod:s?s.mod:null,mode:mode||'lesson',good:0,combo:0,ans:{},xp0:st.xp,lv0:lvl(st.xp).n}}

/* ---------- routing (browser back works) ---------- */
var route={v:'home'};
function go2(r,replace){route=r;try{history[replace?'replaceState':'pushState'](r,'')}catch(e){}apply(r)}
function apply(r){route=r||{v:'home'};closeStoryUI();document.body.classList.remove('lms-on');
  tab=route.v==='lex'?'lex':route.v==='rev'?'rev':'home';q='';
  curMod=route.v==='mod'?MODS.filter(function(m){return m.id===route.m})[0]||null:null;
  if(route.v==='course'){var s=findS(route.s);if(s){navState();return renderCourse(s)}}
  render();scrollTo(0,0)}
function findS(k){return ALLS.filter(function(x){return x.key===k})[0]}
function back(){if(history.state&&history.length>1){history.back()}else go2({v:'home'},true)}
addEventListener('popstate',function(e){if(!story.classList.contains('hidden')&&storyPushed){storyPushed=false;closeStoryUI();apply(route);return}apply(e.state||{v:'home'})});

/* ---------- COURSE MODE (LMS) ---------- */
var C=null;
function secTitle(c){return c.h?plain(c.h):c.w?(c.h||W[c.w].t):c.r?'À retenir':null}
function renderCourse(s){var m=s.mod,mi=MODS.indexOf(m),si=m.S.indexOf(s);if(!C||C.sess!==s)C=newCtx(s,'lesson');
  document.body.classList.add('lms-on');
  var dn=mDone(m),nq=0,prev=m.S[si-1],nx=m.S[si+1];
  var h='<div class="lms" style="'+hueVars(m)+'"><aside class="lside" id="lside"><div class="lsh"><button class="lx" id="lclose" aria-label="Fermer le sommaire">'+ico('X',20)+'</button><span class="lkick">Module '+(mi+1)+'</span><b>'+esc(m.t)+'</b><div class="lprog"><span><i style="width:'+Math.round(dn/m.S.length*100)+'%"></i></span><small>'+dn+' / '+m.S.length+' sessions terminées</small></div></div><ol class="lcur">';
  m.S.forEach(function(x,k){var cur=x===s,d=st.done[x.key];
    h+='<li class="'+(cur?'cur':'')+(d?' done':'')+'"><button data-go="'+esc(x.key)+'"><span class="lst">'+(d?ico('Check',14,3):(k+1))+'</span><span class="ltt">'+esc(x.t)+'<small>'+x.cards.length+' étapes</small></span></button>';
    if(cur){h+='<ul class="lsecs">'+x.cards.map(function(c,n){var t=secTitle(c);return t?'<li><a href="#c'+n+'" data-k="'+n+'">'+esc(t)+'</a></li>':''}).join('')+'</ul>'}
    h+='</li>'});
  h+='</ol></aside><div class="lscrim" id="lscrim"></div><div class="lmain"><div class="lbar"><button class="lbtn" id="lback" aria-label="Retour">'+ico('ArrowLeft',18)+'</button><button class="lbtn lmenu" id="lmenu">'+ico('List',18)+'<span>Sommaire</span></button><span class="lcrumb">'+esc(m.t)+' <span>/</span> '+esc(s.t)+'</span><button class="lbtn" id="toCards">'+ico('GalleryVerticalEnd',18)+'<span>Mode cartes</span></button></div><div class="lread" aria-hidden="true"><i id="cbar"></i></div>';
  h+='<article class="lesson"><p class="lkick2">Session '+(si+1)+' sur '+m.S.length+' · ≈ '+Math.max(3,Math.round(s.cards.length*0.45))+' min · '+s.cards.filter(function(c){return c.q}).length+' questions</p><h1>'+esc(s.t)+'</h1>'+(st.done[s.key]?'<p class="ldone">'+ico('CircleCheck',16)+' Session terminée</p>':'');
  s.cards.forEach(function(c,k){
    if(c.q){nq++;h+='<section class="lq" id="c'+k+'" data-k="'+k+'"><div class="lqh">'+ico('CircleHelp',16)+' Vérifie ta compréhension</div>'+qHTML(c,'Question '+nq,C.ans[k])+'</section>'}
    else if(c.w){h+='<section class="lw" id="c'+k+'" data-k="'+k+'">'+widgetHTML(c)+'</section>'}
    else if(c.r){h+='<section class="lrecap" id="c'+k+'" data-k="'+k+'"><h2>À retenir</h2><ul>'+c.r.map(function(x){return '<li>'+rich(x)+'</li>'}).join('')+'</ul></section>'}
    else{h+='<section class="ls" id="c'+k+'" data-k="'+k+'"><h2>'+rich(c.h)+'</h2>'+c.p.map(function(x){return '<p>'+rich(x)+'</p>'}).join('')+(c.m?'<details class="deep"><summary>'+ico('ChevronDown',16)+' Aller plus loin</summary><div>'+rich(c.m)+'</div></details>':'')+'</section>'}
  });
  h+='<div class="lfoot" id="cend"><button class="cta" id="cfin">'+(st.done[s.key]?ico('CircleCheck',18)+' Terminée':'Marquer comme terminée')+'</button><div class="lpn">'+(prev?'<button class="lpnb" data-go="'+esc(prev.key)+'"><small>Précédente</small>'+esc(prev.t)+'</button>':'<span></span>')+(nx?'<button class="lpnb nx" data-go="'+esc(nx.key)+'"><small>Suivante</small>'+esc(nx.t)+'</button>':'')+'</div></div></article></div></div>';
  view.innerHTML=h;bindTerms(view);bindWidgets(view);
  s.cards.forEach(function(c,k){if(c.q)bindQ(document.getElementById('c'+k),c,C,k)});
  var side=document.getElementById('lside'),scr=document.getElementById('lscrim');
  function openSide(o){side.classList.toggle('open',o);scr.classList.toggle('on',o)}
  document.getElementById('lmenu').onclick=function(){openSide(true)};document.getElementById('lclose').onclick=function(){openSide(false)};scr.onclick=function(){openSide(false)};
  document.getElementById('lback').onclick=function(){go2({v:'mod',m:m.id})};
  document.getElementById('toCards').onclick=function(){openSession(s,currentSec())};
  document.getElementById('cfin').onclick=function(){if(st.done[s.key]&&!C.good)return;var r=finishSession(C);courseEnd(s,r)};
  [].forEach.call(view.querySelectorAll('[data-go]'),function(b){b.onclick=function(){var t=findS(b.dataset.go);if(t&&t!==s){C=null;go2({v:'course',s:t.key})}else openSide(false)}});

  var start=(!st.done[s.key]&&st.pos[s.key])||0;
  if(start){var t=document.getElementById('c'+start);if(t)setTimeout(function(){t.scrollIntoView({block:'start'})},30)}else scrollTo(0,0);
  onCourseScroll()}
function currentSec(){var secs=view.querySelectorAll('.lesson > section[data-k]'),best=0;[].forEach.call(secs,function(sc){if(sc.getBoundingClientRect().top<innerHeight*0.35)best=+sc.dataset.k});return best}
var cTick=null;
function onCourseScroll(){if(route.v!=='course')return;var bar=document.getElementById('cbar');if(!bar)return;var hgt=document.documentElement.scrollHeight-innerHeight;var p=hgt>0?Math.min(1,scrollY/hgt):1;bar.style.width=Math.round(p*100)+'%';
  var k=currentSec(),links=view.querySelectorAll('.lsecs a'),on=null;[].forEach.call(links,function(a){if(+a.dataset.k<=k)on=a;a.classList.remove('on')});if(on)on.classList.add('on');
  clearTimeout(cTick);cTick=setTimeout(function(){if(C&&!st.done[C.sess.key]&&k>(st.pos[C.sess.key]||0)){st.pos[C.sess.key]=k;save()}},400)}

var story=document.getElementById('story'),card=document.getElementById('card'),segs=document.getElementById('segs'),comboEl=document.getElementById('combo'),S={},lastFocusStory=null,storyPushed=false;
function openSession(s,at){S=newCtx(s,'lesson');S.cards=s.cards;S.idx=at!=null?at:((!st.done[s.key]&&st.pos[s.key])||0);if(C&&C.sess===s){S.ans=C.ans;S.good=C.good}start(s.mod,s.t,'Module '+(MODS.indexOf(s.mod)+1)+' · '+s.mod.t,true)}
function openQuiz(t,qs,m,mode){if(!qs.length)return;S=newCtx(null,mode);S.mod=m;S.cards=qs;S.idx=0;start(m,t,qs.length+' questions',false)}
function start(m,t,sub,canCourse){lastFocusStory=document.activeElement;story.setAttribute('style',hueVars(m));var si=document.getElementById('sIc');si.innerHTML=ico(m.ic,20);si.className='rbtn pastel';si.style.color='var(--deep)';
  document.getElementById('sTitle').innerHTML=esc(t)+'<small>'+esc(sub)+'</small>';comboEl.className='combo';
  document.getElementById('toCourse').classList.toggle('hidden',!canCourse);
  segs.innerHTML=S.cards.map(function(){return '<div class="seg"></div>'}).join('');
  story.classList.remove('hidden');document.body.style.overflow='hidden';
  if(!storyPushed){try{history.pushState({v:'story',from:route},'');storyPushed=true}catch(e){}}
  draw(1);document.getElementById('sClose').focus({preventScroll:true})}
function closeStoryUI(){if(story.classList.contains('hidden'))return;story.classList.add('hidden');document.body.style.overflow='';if(lastFocusStory&&document.body.contains(lastFocusStory))lastFocusStory.focus({preventScroll:true})}
function closeStory(){if(storyPushed){history.back()}else{closeStoryUI();apply(route)}}
document.getElementById('sClose').onclick=closeStory;
document.getElementById('toCourse').onclick=function(){var s=S.sess,k=Math.min(S.idx,S.cards.length-1);C=newCtx(s,'lesson');C.ans=S.ans;C.good=S.good;st.pos[s.key]=Math.max(st.pos[s.key]||0,k);storyPushed=false;closeStoryUI();try{history.replaceState({v:'course',s:s.key},'')}catch(e){}route={v:'course',s:s.key};st.pref='course';save();renderCourse(s);var t=document.getElementById('c'+k);if(t)setTimeout(function(){t.scrollIntoView({block:'start'})},40)};
function go(d){var n=S.idx+d;if(n<0||n>S.cards.length)return;var c=S.cards[S.idx];if(d>0&&c&&c.q&&!S.ans[S.idx])return;S.idx=n;if(S.mode==='lesson'&&S.sess&&n<S.cards.length){st.pos[S.sess.key]=Math.max(st.pos[S.sess.key]||0,n);save()}draw(d)}
var sPrev=document.getElementById('sPrev'),sNext=document.getElementById('sNext'),sCount=document.getElementById('sCount');
sPrev.onclick=function(){go(-1)};sNext.onclick=function(){go(1)};
function navUI(){var c=S.cards[S.idx];sPrev.disabled=S.idx===0;var locked=c&&c.q&&!S.ans[S.idx];sNext.disabled=!c||locked;
  sNext.innerHTML=(S.idx>=S.cards.length-1?'Terminer':'Suivant')+' '+ico('ChevronRight',18);sCount.textContent=Math.min(S.idx+1,S.cards.length)+' / '+S.cards.length;
  document.querySelector('.snav').classList.toggle('hidden',S.idx>=S.cards.length)}
function draw(dir){
  [].forEach.call(segs.children,function(x,i){x.classList.toggle('on',i<=S.idx)});
  card.className='card';void card.offsetWidth;card.className='card '+(dir<0?'bk':'in');card.scrollTop=0;
  if(S.idx>=S.cards.length){navUI();return end()}
  var c=S.cards[S.idx];card.dataset.nav=(c.q||c.w)?'0':'1';
  if(c.q){var qm=S.mode==='lesson'?'Question':'Question '+(S.idx+1)+' / '+S.cards.length+(c.mod&&S.mod&&S.mod.id!==c.mod.id?' · '+c.mod.t:'');
    card.innerHTML='<div class="cbody">'+qHTML(c,qm,S.ans[S.idx])+'</div>';
    bindQ(card,c,S,S.idx,function(ok){comboEl.innerHTML=ico('Flame',14)+' Combo ×'+S.combo;comboEl.className='combo'+(S.combo>1?' on':'');navUI();sNext.focus({preventScroll:true});var ex=card.querySelector('.exp');if(ex.scrollIntoView)ex.scrollIntoView({block:'nearest',behavior:'smooth'})});
  } else if(c.w){card.innerHTML='<div class="cbody">'+widgetHTML(c)+'</div>';bindWidgets(card)}
  else if(c.r){card.innerHTML=coverHTML({i:'ListChecks'},true)+'<div class="cbody"><h2>À retenir</h2><ul class="recap">'+c.r.map(function(x){return '<li><span class="rk">'+ico('Check',14,3)+'</span><span>'+rich(x)+'</span></li>'}).join('')+'</ul></div>'}
  else{var first=S.idx===0;card.innerHTML=coverHTML(c)+'<div class="cbody"><h2>'+rich(c.h)+'</h2>'+c.p.map(function(x){return '<p>'+rich(x)+'</p>'}).join('')+(c.m?'<button class="morebtn">'+ico('ChevronDown',16)+' Aller plus loin</button><div class="more">'+rich(c.m)+'</div>':'')+(first?'<div class="hint">Avance avec Suivant, un glissement ou les flèches du clavier. Les mots en couleur s\'expliquent au toucher.</div>':'')+'</div>'}
  bindTerms(card);navUI();
}
card.addEventListener('click',function(e){
  if(e.target.closest('.term,.opt,.cta,.widget,button,label,input'))return;
  var mb=e.target.closest('.morebtn');if(mb)return;
  if(card.dataset.nav!=='1')return;if(window.getSelection&&String(window.getSelection()).length)return;
  var r=card.getBoundingClientRect();go(e.clientX<r.left+r.width*0.3?-1:1)});
card.addEventListener('click',function(e){var mb=e.target.closest('.morebtn');if(!mb)return;var mo=mb.nextElementSibling;mo.classList.toggle('show');mb.innerHTML=mo.classList.contains('show')?ico('ChevronUp',16)+' Masquer':ico('ChevronDown',16)+' Aller plus loin'},true);
var sx=null,sy=null;card.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
card.addEventListener('touchend',function(e){if(sx==null)return;var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;if(e.target.closest('.widget'))return;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5){go(dx<0?1:-1)}});
addEventListener('keydown',function(e){if(!document.getElementById('scrim').classList.contains('hidden')){if(e.key==='Escape')hideTerm();return}
  if(story.classList.contains('hidden'))return;if(e.key==='Escape')return closeStory();
  if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
function end(){card.dataset.nav='0';comboEl.className='combo';var nq=S.cards.filter(function(c){return c.q}).length,msg,nx=null,r=null;
  if(S.mode==='lesson'){r=finishSession(S);nx=r.nx;msg=S.good===nq?'Sans faute, rien à revoir.':'Tes erreurs t\'attendent dans Révision.'}
  else{bump();if(S.mode==='final'&&S.mod&&(st.best[S.mod.id]==null||S.good>st.best[S.mod.id]))st.best[S.mod.id]=S.good;save();
    msg=S.mode==='review'?'Les questions réussies ont quitté ta liste.':S.good>=Math.ceil(nq*0.85)?'Excellent niveau, c\'est maîtrisé.':S.good>=Math.ceil(nq*0.6)?'Bonne base. Revois les sessions où tu as hésité.':'Reprends les sessions concernées, puis retente.'}
  var L=lvl(st.xp),gained=st.xp-S.xp0,up=L.n>S.lv0,good=!nq||S.good>=Math.ceil(nq*0.6);
  card.className='card in';
  card.innerHTML=coverHTML({i:good?'Trophy':'Target'})+'<div class="cbody end"><h2 style="margin:0">'+(S.mode==='lesson'?'Session terminée':S.mode==='review'?'Révision faite':'Résultat')+'</h2>'+(nq?'<div class="score">'+S.good+'/'+nq+'</div>':'')+'<p style="color:var(--muted);margin:0 0 4px">'+msg+'</p><div class="endstats"><span>'+ico('Zap',15)+' +'+gained+' XP</span><span>'+ico('Flame',15)+' '+st.streak+' jour'+(st.streak>1?'s':'')+'</span><span>'+ico('Award',15)+' Niv. '+L.n+'</span></div>'+(up?'<div class="levelup pastel">'+ico('Trophy',18)+' Nouveau niveau : '+esc(L.name)+' !</div>':'')+(nx?'<button class="cta" id="nxt">Suivante : '+esc(nx.t)+'</button>':'')+'<button class="cta alt" id="rvw">'+ico('ChevronLeft',16)+' Revoir les cartes</button><button class="cta'+(nx?' alt':'')+'" id="bk2">Retour</button></div>';
  document.getElementById('bk2').onclick=function(e){e.stopPropagation();closeStory()};
  document.getElementById('rvw').onclick=function(e){e.stopPropagation();S.idx=0;draw(-1)};
  if(nx)document.getElementById('nxt').onclick=function(e){e.stopPropagation();openSession(nx,0)};
}

var scrim=document.getElementById('scrim'),sheet=document.getElementById('sheet'),lastFocus=null;
function showTerm(k){var g=G[k];if(!g)return;lastFocus=document.activeElement;
  sheet.innerHTML='<div class="grab"></div><span class="cat">'+esc(g.c)+'</span><h3>'+esc(k)+'</h3><p>'+esc(g.d)+'</p>'+(g.a?'<p class="an">'+ico('Lightbulb',15)+' '+esc(g.a)+'</p>':'')+'<button class="cta" id="tok">Compris</button>';
  scrim.classList.remove('hidden');var tk=document.getElementById('tok');tk.focus();tk.onclick=hideTerm}
function hideTerm(){scrim.classList.add('hidden');if(lastFocus)lastFocus.focus({preventScroll:true})}
scrim.addEventListener('click',function(e){if(e.target===scrim)hideTerm()});
try{history.replaceState({v:'home'},'')}catch(e){}render();initSync();

</script>
</body>
</html>
