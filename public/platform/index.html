<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pearl</title>
<link rel="stylesheet" href="/platform/platform.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 34A28 28 0 0 1 34 6" fill="none" stroke="#4F6A85" stroke-width="4.5" stroke-linecap="round"/><path d="M13 34A21 21 0 0 1 34 13" fill="none" stroke="#4F6A85" stroke-width="4.5" stroke-linecap="round" opacity=".7"/><circle cx="31" cy="31" r="4.5" fill="#F2A65A"/></svg>Pearl</a>
    <nav><a class="btn sm" href="/console">Console</a></nav>
  </header>

  <section class="hero">
    <h1>Pilotez votre équipe opérationnelle, à vos couleurs.</h1>
    <p>Tickets et délais par site, plannings, absences, objectifs, formation et rapports diffusés automatiquement. Un espace par entreprise, prêt en deux minutes.</p>
    <a class="btn primary" href="/signup">Créer mon espace</a>
  </section>

  <section class="section">
    <h2>Un pack par métier</h2>
    <div class="grid" id="packs"></div>
  </section>

  <section class="section">
    <h2>Ce que chaque espace contient</h2>
    <div class="grid" id="mods"></div>
  </section>
</div>
<script>
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
fetch('/api/platform/packs').then(r => r.json()).then(list => {
  document.getElementById('packs').innerHTML = list.map(p => `<div class="card"><h3>${esc(p.label)}</h3><p>${esc(p.desc)}</p></div>`).join('');
});
fetch('/api/platform/modules').then(r => r.json()).then(list => {
  document.getElementById('mods').innerHTML = list.map(m => `<div class="card"><h3>${esc(m.label)}</h3><p>${esc(m.desc)}</p></div>`).join('');
});
</script>
</body>
</html>
