<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Console · Pearl</title>
<link rel="stylesheet" href="/platform/platform.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 34A28 28 0 0 1 34 6" fill="none" stroke="#4F6A85" stroke-width="4.5" stroke-linecap="round"/><path d="M13 34A21 21 0 0 1 34 13" fill="none" stroke="#4F6A85" stroke-width="4.5" stroke-linecap="round" opacity=".7"/><circle cx="31" cy="31" r="4.5" fill="#F2A65A"/></svg>Pearl · Console</a>
    <nav id="who"></nav>
  </header>

  <form class="panel card" id="login" hidden>
    <h2 style="margin:0 0 6px">Connexion à la console</h2>
    <p class="hint">Réservée aux administrateurs de la plateforme.</p>
    <label for="l-email">Email</label><input id="l-email" type="email" autocomplete="username" required>
    <label for="l-pw">Mot de passe</label><input id="l-pw" type="password" autocomplete="current-password" required>
    <div class="err" id="l-err" role="alert"></div>
    <button class="btn primary" style="margin-top:12px;width:100%">Se connecter</button>
  </form>

  <main id="app" hidden>
    <section class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <h2 style="margin:0">Organisations <span class="hint" id="count"></span></h2>
        <button class="btn primary sm" id="new-btn">Nouvelle organisation</button>
      </div>
      <div class="table-wrap" style="margin-top:12px">
        <table><thead><tr><th>Organisation</th><th>Pack</th><th>Statut</th><th>Membres</th><th>Créée</th><th></th></tr></thead><tbody id="rows"></tbody></table>
      </div>
    </section>

    <section class="card" id="new" hidden style="margin-top:16px">
      <h2 style="margin:0 0 6px">Nouvelle organisation</h2>
      <div class="row">
        <div><label for="n-name">Nom</label><input id="n-name" maxlength="80"></div>
        <div><label for="n-slug">Adresse (slug)</label><input id="n-slug" maxlength="40" spellcheck="false"></div>
      </div>
      <div class="row">
        <div><label for="n-pack">Pack</label><select id="n-pack"></select></div>
        <div><label for="n-plan">Offre</label><input id="n-plan" value="standard" maxlength="40"></div>
      </div>
      <div class="row">
        <div><label for="n-owner">Email du propriétaire</label><input id="n-owner" type="email"></div>
        <div><label for="n-owner-name">Nom du propriétaire</label><input id="n-owner-name" maxlength="80"></div>
      </div>
      <div class="err" id="n-err" role="alert"></div>
      <div id="n-ok"></div>
      <button class="btn primary" id="n-create" style="margin-top:8px">Créer</button>
    </section>

    <section class="card" id="edit" hidden style="margin-top:16px">
      <h2 style="margin:0 0 6px" id="e-title"></h2>
      <div class="row">
        <div><label for="e-status">Statut</label><select id="e-status"><option value="trial">Essai</option><option value="active">Active</option><option value="suspended">Suspendue</option></select></div>
        <div><label for="e-plan">Offre</label><input id="e-plan" maxlength="40"></div>
      </div>
      <label for="e-domains">Domaines personnalisés (un par ligne, ex. ops.client.com)</label>
      <textarea id="e-domains" rows="2" style="height:auto;padding:8px 12px"></textarea>
      <label>Modules</label>
      <div id="e-mods" style="display:flex;flex-wrap:wrap;gap:10px"></div>
      <div class="err" id="e-err" role="alert"></div>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
        <button class="btn primary" id="e-save">Enregistrer</button>
        <button class="btn" id="e-close">Fermer</button>
        <span style="flex:1"></span>
        <button class="btn" id="e-delete" style="color:var(--err)">Supprimer…</button>
      </div>
    </section>
  </main>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const api = async (url, method = 'GET', body) => {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || `HTTP ${r.status}`), { status: r.status });
  return j;
};
const C = { tenants: [], mods: [], packs: [], cur: null };
const STATUT = { trial: 'Essai', active: 'Active', suspended: 'Suspendue' };

async function start() {
  try {
    const me = await api('/api/platform/console/me');
    $('who').innerHTML = `<span class="hint">${esc(me.email)}</span> <button class="btn sm" id="logout">Déconnexion</button>`;
    $('logout').onclick = async () => { await api('/api/platform/console/logout', 'POST'); location.reload(); };
    $('login').hidden = true; $('app').hidden = false;
    [C.mods, C.packs] = await Promise.all([api('/api/platform/modules'), api('/api/platform/packs')]);
    $('n-pack').innerHTML = C.packs.map(p => `<option value="${esc(p.id)}">${esc(p.label)}</option>`).join('');
    await load();
  } catch (e) {
    $('login').hidden = false; $('app').hidden = true;
  }
}
async function load() {
  C.tenants = await api('/api/platform/console/tenants');
  $('count').textContent = `(${C.tenants.length})`;
  $('rows').innerHTML = C.tenants.map(t => `<tr>
    <td><b>${esc(t.name)}</b><br><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.slug)}</a></td>
    <td>${esc(t.pack || '—')}</td>
    <td><span class="pill ${esc(t.status)}">${esc(STATUT[t.status] || t.status)}</span>${t.status === 'trial' && t.trial_ends_at ? `<div class="hint">jusqu'au ${esc(t.trial_ends_at.slice(0, 10))}</div>` : ''}</td>
    <td>${t.members}</td>
    <td>${esc(String(t.created_at || '').slice(0, 10))}</td>
    <td><button class="btn sm" data-edit="${esc(t.slug)}">Gérer</button></td></tr>`).join('') || '<tr><td colspan="6" class="hint">Aucune organisation pour l’instant.</td></tr>';
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => edit(b.dataset.edit));
}
function edit(slug) {
  const t = C.tenants.find(x => x.slug === slug); C.cur = t;
  $('edit').hidden = false; $('new').hidden = true;
  $('e-title').textContent = `${t.name} (${t.slug})`;
  $('e-status').value = t.status; $('e-plan').value = t.plan || '';
  $('e-domains').value = (t.domains || []).join('\n');
  const on = new Set(t.modules && t.modules.length ? t.modules : C.mods.map(m => m.id));
  $('e-mods').innerHTML = C.mods.map(m => `<label style="display:inline-flex;gap:6px;align-items:center;margin:0;font-weight:600;color:var(--ink)"><input type="checkbox" value="${esc(m.id)}" ${on.has(m.id) ? 'checked' : ''} ${m.always ? 'disabled' : ''} style="width:auto;height:auto"> ${esc(m.label)}</label>`).join('');
  $('e-err').textContent = '';
  $('edit').scrollIntoView({ behavior: 'smooth' });
}
$('e-close').onclick = () => { $('edit').hidden = true; };
$('e-save').onclick = async () => {
  try {
    await api(`/api/platform/console/tenants/${encodeURIComponent(C.cur.slug)}`, 'PATCH', {
      status: $('e-status').value, plan: $('e-plan').value.trim(),
      domains: $('e-domains').value.split(/\s+/).filter(Boolean),
      modules: [...$('e-mods').querySelectorAll('input:checked')].map(x => x.value),
    });
    $('edit').hidden = true; await load();
  } catch (e) { $('e-err').textContent = e.message; }
};
$('e-delete').onclick = async () => {
  const s = prompt(`Suppression définitive de « ${C.cur.name} » et de toutes ses données.\nRetapez « ${C.cur.slug} » pour confirmer :`);
  if (s !== C.cur.slug) return;
  try { await api(`/api/platform/console/tenants/${encodeURIComponent(C.cur.slug)}`, 'DELETE', { confirm: s }); $('edit').hidden = true; await load(); }
  catch (e) { $('e-err').textContent = e.message; }
};
$('new-btn').onclick = () => { $('new').hidden = false; $('edit').hidden = true; $('n-ok').innerHTML = ''; $('n-err').textContent = ''; };
$('n-create').onclick = async () => {
  $('n-err').textContent = ''; $('n-ok').innerHTML = '';
  try {
    const j = await api('/api/platform/console/tenants', 'POST', {
      name: $('n-name').value.trim(), slug: $('n-slug').value.trim() || undefined, pack: $('n-pack').value, plan: $('n-plan').value.trim(),
      owner_email: $('n-owner').value.trim() || undefined, owner_name: $('n-owner-name').value.trim() || undefined,
    });
    $('n-ok').innerHTML = `<p class="ok">Créée : <a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.url)}</a></p>`
      + (j.temp_password ? `<p>Mot de passe provisoire de ${esc(j.owner.email)}, à transmettre une seule fois : <code>${esc(j.temp_password)}</code></p>` : '');
    await load();
  } catch (e) { $('n-err').textContent = e.message; }
};
$('login').addEventListener('submit', async e => {
  e.preventDefault(); $('l-err').textContent = '';
  try { await api('/api/platform/console/login', 'POST', { email: $('l-email').value.trim(), password: $('l-pw').value }); start(); }
  catch (er) { $('l-err').textContent = er.message; }
});
start();
</script>
</body>
</html>
