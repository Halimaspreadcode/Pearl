<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="stylesheet" href="/css/fonts.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analyseur de logs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
  /* Palette alignée sur le langage Material 3 / Pixel de
     l'application hôte (l'analyseur est chargé en iframe et a
     donc sa propre feuille de style). */
  :root {
    --bg: #FFFFFF;
    --surface: #F1F3F4;
    --border: #E3E3E3;
    --border-hover: #C4C7C5;
    --text: #1F1F1F;
    --text-2: #5F6368;
    --text-3: #9AA0A6;
    --primary: #C7000B;
    --primary-hover: #A0000A;
    --primary-dim: rgba(199,0,11,.08);
    --danger: #D93025;
    --danger-bg: #FCE8E6;
    --danger-border: #F5C6C2;
    --info: #1A73E8;
    --info-bg: #E8F0FE;
    --info-border: #C2D7FD;
    --warning: #F9AB00;
    --warning-bg: #FEF7E0;
    --warning-border: #FDE293;
    --ok: #1E8E3E;
    --ok-bg: #E6F4EA;
    --radius-sm: 12px;
    --radius: 20px;
    --radius-lg: 28px;
  }

  html[data-theme="dark"] {
    --bg: #131314;
    --surface: #1E1F20;
    --border: #2D2E30;
    --border-hover: #444746;
    --text: #E3E3E3;
    --text-2: #9AA0A6;
    --text-3: #6B6F73;
    --primary: #FF5C5C;
    --primary-hover: #FF8A8A;
    --primary-dim: rgba(255,92,92,.12);
    --danger: #F28B82;
    --danger-bg: #2A1618;
    --danger-border: #3B1F20;
    --info: #8AB4F8;
    --info-bg: #172033;
    --info-border: #2A3F5F;
    --warning: #FDD663;
    --warning-bg: #2A2416;
    --warning-border: #3D3620;
    --ok: #81C995;
    --ok-bg: #0F2A17;
  }

  html[data-theme="dark"] textarea,
  html[data-theme="dark"] select,
  html[data-theme="dark"] input {
    background: #1e1e1e;
    color: var(--text);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Top bar ── */
  .topbar {
    height: 52px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    flex-shrink: 0;
  }

  .topbar-logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: -.01em;
    color: var(--text);
    text-decoration: none;
  }

  .topbar-logo .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--primary);
  }

  .topbar-divider {
    width: 1px;
    height: 18px;
    background: var(--border);
  }

  .topbar-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-2);
  }

  .topbar-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-icon {
    width: 32px;
    height: 32px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text-2);
    transition: background .12s, color .12s, border-color .12s;
  }
  .btn-icon:hover {
    background: var(--border);
    color: var(--text);
    border-color: var(--border-hover);
  }

  /* ── Layout ── */
  .workspace {
    display: grid;
    grid-template-columns: 420px 1fr;
    grid-template-rows: 1fr;
    flex: 1;
    min-height: 0;
    height: calc(100vh - 52px);
  }

  /* ── Left panel ── */
  .panel-input {
    border-right: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .panel-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--text-3);
    margin-bottom: 4px;
  }

  .panel-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -.02em;
  }

  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .panel-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    display: flex;
    gap: 8px;
    align-items: center;
  }

  /* ── Textarea ── */
  textarea {
    width: 100%;
    flex: 1;
    min-height: 320px;
    resize: none;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    font-size: 12.5px;
    font-family: "SF Mono", "Fira Code", Consolas, Monaco, monospace;
    color: var(--text);
    background: var(--bg);
    line-height: 1.6;
    transition: border-color .15s, box-shadow .15s;
    outline: none;
  }
  textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-dim);
  }
  textarea::placeholder { color: var(--text-3); font-family: 'Inter', sans-serif; font-size: 13px; }

  /* ── Buttons ── */
  .btn {
    border: none;
    border-radius: var(--radius-sm);
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background .12s, color .12s, border-color .12s, opacity .12s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }

  .btn-primary {
    background: var(--text);
    color: var(--surface);
    flex: 1;
    justify-content: center;
    height: 38px;
  }
  .btn-primary:hover { opacity: .85; }

  .btn-ghost {
    background: transparent;
    color: var(--text-2);
    border: 1px solid var(--border);
    height: 38px;
  }
  .btn-ghost:hover {
    background: var(--bg);
    border-color: var(--border-hover);
    color: var(--text);
  }

  .btn-sm {
    padding: 5px 12px;
    font-size: 12px;
    height: 30px;
  }

  /* ── Right panel ── */
  .panel-results {
    background: var(--bg);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  /* ── Empty state ── */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 60px 40px;
    text-align: center;
  }

  .empty-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-3);
  }

  .empty-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-2);
  }

  .empty-sub {
    font-size: 13px;
    color: var(--text-3);
    max-width: 280px;
  }

  /* ── Results content ── */
  .results-inner {
    display: none;
    flex-direction: column;
    flex: 1;
  }
  .results-inner.visible {
    display: flex;
  }

  /* ── Summary section ── */
  .summary-section {
    padding: 24px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--text-3);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .summary-env-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 999px;
  }
  .badge-production { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-border); }
  .badge-preproduction { background: var(--info-bg); color: var(--info); border: 1px solid var(--info-border); }
  .badge-system { background: var(--warning-bg); color: var(--warning); border: 1px solid var(--warning-border); }

  .summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 16px;
  }

  .summary-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .summary-item.full { grid-column: 1 / -1; }

  .summary-item-label {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--text-3);
    margin-bottom: 6px;
  }

  .summary-item-value {
    font-size: 13px;
    color: var(--text);
    line-height: 1.55;
  }

  /* ── Fields section ── */
  .fields-section {
    padding: 24px 28px;
    flex: 1;
  }

  .fields-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
  }

  .field-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }

  .field-card-key {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--text-3);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .field-card-raw {
    font-size: 10px;
    font-weight: 400;
    color: var(--text-3);
    font-family: "SF Mono", Consolas, monospace;
    letter-spacing: 0;
    text-transform: none;
    opacity: .7;
  }

  .field-card-value {
    font-size: 13px;
    font-family: "SF Mono", "Fira Code", Consolas, monospace;
    color: var(--text);
    word-break: break-all;
    line-height: 1.5;
  }

  .field-card-glossary {
    margin-top: 4px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .glossary-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-family: 'Inter', sans-serif;
    color: var(--text-2);
    line-height: 1.4;
  }
  .glossary-tag b {
    color: var(--text);
    font-weight: 600;
  }

  /* ── Warning ── */
  .warning-banner {
    display: none;
    align-items: flex-start;
    gap: 10px;
    background: var(--warning-bg);
    border: 1px solid var(--warning-border);
    border-radius: var(--radius);
    padding: 12px 16px;
    font-size: 12.5px;
    color: var(--warning);
  }

  /* ── Copy btn row ── */
  .results-actions {
    padding: 0 28px 24px;
    display: flex;
    gap: 8px;
  }

  /* ── Notice ── */
  .notice {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-3);
    margin-top: 4px;
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

  /* ── Responsive ── */
  @media (max-width: 900px) {
    .workspace {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr;
      height: auto;
      min-height: calc(100vh - 52px);
    }
    .panel-input {
      border-right: none;
      border-bottom: 1px solid var(--border);
    }
    textarea { min-height: 180px; }
    .summary-grid, .fields-grid { grid-template-columns: 1fr; }
  }

  /* ══════════════════════════════════════════════
     ALIGNEMENT SUR LE STYLE GLOBAL (Material 3 / Pixel)
     L'analyseur est chargé en iframe : il ne peut pas hériter
     de la feuille de style de l'application, ces règles
     reproduisent donc son langage visuel.
  ══════════════════════════════════════════════ */

  /* Barre du haut : sans bordure, surface plate comme l'app */
  .topbar {
    height: 60px;
    background: var(--bg);
    border-bottom: 1px solid transparent;
    padding: 0 24px;
  }
  .topbar-logo { font-size: 15px; font-weight: 500; letter-spacing: 0; }
  .topbar-title { font-size: 14px; }
  .topbar-divider { background: var(--border); height: 16px; }

  /* Boutons icône : ronds avec state layer, pas de bordure */
  .btn-icon {
    width: 40px; height: 40px;
    border-radius: 999px;
    border: none;
    background: transparent;
  }
  .btn-icon:hover { background: var(--surface); color: var(--text); }

  /* Boutons : capsules pleines */
  .btn {
    border-radius: 999px !important;
    height: 40px;
    padding: 0 22px !important;
    font-size: 14px !important;
    font-weight: 500 !important;
    letter-spacing: .006em;
    border: none !important;
    transition: background .2s cubic-bezier(.2,0,0,1), filter .2s;
  }
  .btn-primary { box-shadow: none !important; }
  .btn-primary:hover { filter: brightness(1.08); transform: none !important; }
  .btn-ghost {
    background: transparent !important;
    border: 1px solid var(--border-hover) !important;
    color: var(--text) !important;
  }
  .btn-ghost:hover { background: var(--surface) !important; }
  .btn-sm { height: 34px; padding: 0 16px !important; font-size: 13px !important; }

  /* Champs : coins M3, surface tonale, focus à l'accent */
  textarea, input, select {
    border-radius: 16px !important;
    border: 1px solid var(--border) !important;
    background: var(--bg) !important;
    color: var(--text) !important;
    font-family: 'Inter', sans-serif;
    padding: 14px 16px !important;
  }
  textarea:focus, input:focus, select:focus {
    outline: none !important;
    border-color: var(--primary) !important;
    box-shadow: 0 0 0 1px var(--primary);
  }

  /* Panneaux et cartes : surfaces pleines, arrondis généreux,
     et beaucoup plus d'air qu'avant. */
  .field-card {
    border-radius: 20px !important;
    border: none !important;
    background: var(--surface) !important;
    padding: 18px 20px !important;
    box-shadow: none !important;
  }
  .fields-grid { gap: 12px !important; }
  .field-card-key {
    font-size: 12px !important;
    font-weight: 500 !important;
    text-transform: none !important;
    letter-spacing: .01em !important;
    color: var(--text-2) !important;
  }
  .field-card-value { font-size: 14px !important; color: var(--text) !important; }
  .field-card-raw, .field-card-glossary {
    border-radius: 12px !important;
    background: var(--bg) !important;
    border: none !important;
  }

  /* Colonnes : séparation par surface, pas par trait */
  .panel, .col-left, .col-right { border-color: var(--border) !important; }

  /* État vide : plus aéré, icône en pastille ronde */
  .empty-state { padding: 72px 24px !important; }
  .empty-icon {
    border-radius: 999px !important;
    background: var(--surface) !important;
    border: none !important;
    width: 64px !important; height: 64px !important;
  }
  .empty-title { font-size: 17px !important; font-weight: 500 !important; }
  .empty-sub { font-size: 14px !important; color: var(--text-2) !important; line-height: 1.6; }

  /* Blocs de code / logs */
  pre, code, .mono {
    border-radius: 12px;
    background: var(--surface);
    color: var(--text);
  }

  /* Tableaux éventuels */
  table { border-collapse: collapse; }
  th {
    background: var(--surface);
    font-size: 12px; font-weight: 500;
    text-transform: none; letter-spacing: .02em;
    color: var(--text-2);
    padding: 12px 16px; text-align: left;
  }
  td { padding: 12px 16px; font-size: 13px; }
  tbody tr { border-bottom: 1px solid var(--border); }

  /* Badges / pastilles */
  .badge, .tag, .pill {
    border-radius: 999px !important;
    font-size: 12px !important;
    font-weight: 500 !important;
    text-transform: none !important;
    padding: 3px 10px !important;
  }

</style>
</head>
<body>



<!-- Workspace -->
<div class="workspace">

  <!-- Left: input -->
  <aside class="panel-input">
    <div class="panel-header">
      <div class="panel-label">Entree</div>
      <div class="panel-title">Ticket / Log</div>
    </div>

    <div class="panel-body">
      <div class="warning-banner" id="multiLogWarning">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Plusieurs logs detectes. Analysez-les un par un.
      </div>
      <textarea id="logInput" placeholder="Collez la description du ticket EMOC ici…"></textarea>
      <div class="notice">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Coller strictement la description du ticket EMOC ici.
      </div>
    </div>

    <div class="panel-footer">
      <button class="btn btn-primary" id="analyzeBtn" type="button">
        Analyser
      </button>
      <button class="btn btn-ghost" id="clearBtn" type="button">Effacer</button>
    </div>
  </aside>

  <!-- Right: results -->
  <main class="panel-results">

    <!-- Empty state -->
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg>
      </div>
      <div class="empty-title">Aucune analyse</div>
      <div class="empty-sub">Collez la description d'un ticket et cliquez sur Analyser pour decoder son contenu.</div>
    </div>

    <!-- Results -->
    <div class="results-inner" id="resultsInner">

      <!-- Summary -->
      <div class="summary-section">
        <div class="section-label">
          Synthese metier
          <span id="envBadge" class="summary-env-badge badge-system">Systeme</span>
        </div>
        <div class="summary-grid" id="summaryGrid"></div>
      </div>

      <!-- Fields -->
      <div class="fields-section">
        <div class="section-label">Champs extraits</div>
        <div class="fields-grid" id="fieldsGrid"></div>
      </div>

      <!-- Copy -->
      <div class="results-actions">
        <button class="btn btn-ghost btn-sm" id="copySummaryBtn" type="button">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copier la synthese
        </button>
      </div>

    </div>
  </main>

</div>

<script>
(function () {
  "use strict";

  // ── GLOSSAIRE ──
  var DEFAULT_GLOSSARY = {
    "mdn": "Cluster Medina (Production 2)",
    "pr1": "Production 1 (Rufisque)",
    "osnpp2": "Environnement de preproduction OSN",
    "gaussdb": "Base de donnees distribuee Huawei GaussDB",
    "wallet": "Plateforme Mobile Money",
    "snmp": "Protocole de supervision reseau",
    "sftp": "Protocole de transfert de fichiers securise",
    "ocprox6000": "Baie de stockage OceanStor Pro X6000",
    "csn": "Numero de serie chassis (Chassis Serial Number)",
    "moname": "Nom de l'objet gere (Managed Object)",
    "ftp": "Protocole de transfert de fichiers",
    "vrrp": "Protocole de redondance de routeur virtuel",
    "bgp": "Protocole de routage Border Gateway Protocol",
    "ospf": "Protocole de routage a etat de liens",
    "raid": "Technologie de redondance de disques",
    "nfs": "Systeme de fichiers reseau (Network File System)",
    "cifs": "Protocole de partage de fichiers Windows",
    "san": "Reseau de stockage (Storage Area Network)",
    "nas": "Stockage en reseau (Network Attached Storage)",
    "vlan": "Reseau local virtuel",
    "cpu": "Unite centrale de traitement",
    "mem": "Memoire",
    "disk": "Disque de stockage",
    "link": "Liaison reseau",
    "down": "Hors service / inactif",
    "up": "En service / actif",
    "timeout": "Depassement de delai de reponse",
    "auth": "Authentification",
    "huawei": "Equipementier Huawei"
  };

  var GLOSSARY_STORAGE_KEY = "logAnalyzer.customGlossary";

  function loadCustomGlossary() {
    try { var r = localStorage.getItem(GLOSSARY_STORAGE_KEY); return r ? JSON.parse(r) : {}; }
    catch (e) { return {}; }
  }

  var customGlossary = loadCustomGlossary();
  var GLOSSARY = {};

  function rebuildGlossary() {
    GLOSSARY = {};
    Object.keys(DEFAULT_GLOSSARY).forEach(function (k) { GLOSSARY[k] = DEFAULT_GLOSSARY[k]; });
    Object.keys(customGlossary).forEach(function (k) { GLOSSARY[k] = customGlossary[k]; });
  }
  rebuildGlossary();

  // ── ALIAS ──
  var KEY_ALIASES = {
    "managed_object": ["moi","managed_object_name","moname","mo_name","managedobject"],
    "chassis_serial": ["csn","chassis_sn","serial_number","sn"],
    "extended_info": ["extendinfo","extend_info","additionalinformation","additional_information"],
    "task_failure": ["task_fail_details","taskfaildetails","fail_reason","failure_reason"],
    "error_detail": ["errorcode","error_code","error_details"],
    "ip_address": ["ip","ipaddr","ip_address","src_ip","source_ip","host_ip"],
    "user": ["user_name","username","user","operator"],
    "alarm_name": ["alarmname","alarm_name","event_name","eventname","alarm"],
    "severity": ["severity","level","alarm_level","perceivedseverity"],
    "timestamp": ["time","timestamp","occur_time","raisedtime","date"],
    "location": ["location_info","locationinfo","site","environment","env","cluster"],
    "device_type": ["devicetype","device_type","product","platform"]
  };

  function buildReverseAliasMap() {
    var map = {};
    Object.keys(KEY_ALIASES).forEach(function (c) {
      KEY_ALIASES[c].forEach(function (a) { map[a.toLowerCase()] = c; });
      map[c.toLowerCase()] = c;
    });
    return map;
  }
  var REVERSE_ALIAS = buildReverseAliasMap();

  function canonicalKey(rawKey) {
    var n = rawKey.trim().toLowerCase().replace(/[\s\-]+/g, "_");
    return REVERSE_ALIAS[n] || n;
  }

  // ── PARSER ──
  function extractTopLevelBraceBlocks(text) {
    var blocks = [], depth = 0, start = -1;
    for (var i = 0; i < text.length; i++) {
      if (text[i] === "{") { if (depth === 0) start = i; depth++; }
      else if (text[i] === "}") {
        if (depth > 0) { depth--; if (depth === 0 && start !== -1) { blocks.push({ start: start, end: i + 1, text: text.slice(start, i + 1) }); start = -1; } }
      }
    }
    return blocks;
  }

  function tryParseJson(text) {
    var results = [];
    var blocks = extractTopLevelBraceBlocks(text);
    blocks.forEach(function (block) {
      try {
        var obj = JSON.parse(block.text);
        if (obj && typeof obj === "object") {
          Object.keys(obj).forEach(function (k) {
            var v = obj[k];
            results.push({ key: k, value: typeof v === "object" ? JSON.stringify(v) : String(v) });
          });
        }
      } catch (e) {}
    });
    return { results: results, blocks: blocks };
  }

  function extractJsonAsKeyValue(text, blocks) {
    var results = [], consumedRanges = [];
    blocks.forEach(function (block) {
      var before = text.slice(0, block.start);
      var m = before.match(/([A-Za-z0-9_\.\-]+)\s*[:=]\s*$/);
      if (m) {
        results.push({ key: m[1], value: block.text });
        consumedRanges.push({ start: before.length - m[0].length, end: block.end });
      }
    });
    return { results: results, consumedRanges: consumedRanges };
  }

  function removeRanges(text, ranges) {
    if (!ranges.length) return text;
    var sorted = ranges.slice().sort(function (a, b) { return a.start - b.start; });
    var out = "", cursor = 0;
    sorted.forEach(function (r) { if (r.start > cursor) out += text.slice(cursor, r.start); cursor = Math.max(cursor, r.end); });
    return out + text.slice(cursor);
  }

  function looksLikeFieldName(key) {
    if (key.indexOf("_") !== -1 || key.indexOf(".") !== -1) return true;
    if (/[a-z]/.test(key) && /[A-Z]/.test(key)) return true;
    if (key === key.toUpperCase() && key.length > 1) return true;
    return false;
  }

  function findKeyPositions(text) {
    var re = /([A-Za-z][A-Za-z0-9_\.]*)\s*[:=]\s*/g, matches = [], m;
    while ((m = re.exec(text)) !== null) {
      var key = m[1], keyStart = m.index, before = text.slice(0, keyStart);
      if (/([,;\n)]|^)\s*$/.test(before) || (/\s$/.test(before) && looksLikeFieldName(key))) {
        matches.push({ key: key, keyStart: keyStart, valueStart: m.index + m[0].length });
      }
    }
    return matches;
  }

  function parseKeyValuePairs(text) {
    var matches = findKeyPositions(text), results = [];
    for (var i = 0; i < matches.length; i++) {
      var start = matches[i].valueStart;
      var end = i + 1 < matches.length ? matches[i + 1].keyStart : text.length;
      var value = text.slice(start, end).replace(/[,;\s]+$/, "").trim().replace(/^["']|["']$/g, "");
      if (matches[i].key && value) results.push({ key: matches[i].key, value: value });
    }
    return results;
  }

  function parseLog(rawText) {
    var jsonExtraction = tryParseJson(rawText);
    var asKv = extractJsonAsKeyValue(rawText, jsonExtraction.blocks);
    var textWithoutJson = removeRanges(rawText, asKv.consumedRanges);
    var fromJson = asKv.results.length > 0 ? asKv.results : jsonExtraction.results;
    var fromKv = parseKeyValuePairs(textWithoutJson);
    var all = fromJson.concat(fromKv), merged = {};
    all.forEach(function (item) {
      var canon = canonicalKey(item.key);
      if (!merged[canon]) merged[canon] = { rawKeys: [], value: item.value };
      if (merged[canon].rawKeys.indexOf(item.key) === -1) merged[canon].rawKeys.push(item.key);
    });
    return merged;
  }

  // ── DECODAGE ──
  function decodeValue(value) {
    var tokens = value.split(/[_\-\.\(\)\s,]+/).filter(Boolean), hits = [], seen = {};
    tokens.forEach(function (tok) {
      var key = tok.toLowerCase();
      if (GLOSSARY[key] && !seen[key]) { seen[key] = true; hits.push({ token: tok, meaning: GLOSSARY[key] }); }
    });
    return hits;
  }

  // ── DETECTION ENV ──
  function detectEnvironment(fields, rawText) {
    var h = rawText.toLowerCase();
    if (["osnpp2","preprod","pre-prod","préprod","staging","test"].some(function (m) { return h.indexOf(m) !== -1; })) return "preproduction";
    if (["mdn","pr1","production","wallet"].some(function (m) { return h.indexOf(m) !== -1; })) return "production";
    return "system";
  }

  // ── SYNTHESE ──
  function buildSummary(fields, rawText, env) {
    var h = rawText.toLowerCase();
    var envLabel = env === "production" ? "PRODUCTION" : env === "preproduction" ? "PREPRODUCTION" : "SYSTEME / INDETERMINE";
    var moField = fields["managed_object"], ipField = fields["ip_address"];
    var alarmField = fields["alarm_name"], failField = fields["task_failure"];
    var subject = moField ? moField.value : (ipField ? ipField.value : "l'equipement concerne");

    var reason = "Cause non determinee, analyse manuelle requise.";
    if (failField) reason = "Echec de tache : " + failField.value;
    else if (h.indexOf("timeout") !== -1) reason = "Depassement de delai (timeout) sur " + subject + ".";
    else if (h.indexOf("down") !== -1 && h.indexOf("link") !== -1) reason = "Perte de liaison reseau (link down) sur " + subject + ".";
    else if (h.indexOf("auth") !== -1 && (h.indexOf("fail") !== -1 || h.indexOf("denied") !== -1)) reason = "Echec d'authentification sur " + subject + ".";
    else if (h.indexOf("disk") !== -1 || h.indexOf("raid") !== -1) reason = "Anomalie de stockage (disque/RAID) sur " + subject + ".";
    else if (h.indexOf("gaussdb") !== -1 || h.indexOf("database") !== -1) reason = "Incident base de donnees sur " + subject + ".";
    else if (h.indexOf("wallet") !== -1) reason = "Anomalie Mobile Money (" + subject + ").";
    else if (h.indexOf("sftp") !== -1 || h.indexOf("ftp") !== -1) reason = "Echec transfert fichiers (FTP/SFTP) sur " + subject + ".";

    var impact = env === "production"
      ? "Impact critique potentiel en production. Risque d'interruption ou de degradation pour les utilisateurs finaux."
      : env === "preproduction"
      ? "Impact limite a la preproduction. Peut bloquer les tests en cours."
      : "Impact a confirmer : environnement indetermine.";

    var action = env === "production"
      ? "Prise en charge immediate par l'astreinte. Verifier l'etat de " + subject + " et escalader si impacte."
      : env === "preproduction"
      ? "Verification par l'equipe technique preprod, sans urgence critique."
      : "Qualifier l'environnement et la criticite avant toute escalade.";

    return {
      env: envLabel,
      alarm: alarmField ? alarmField.value : null,
      subject: subject,
      reason: reason,
      impact: impact,
      action: action
    };
  }

  // ── LABELS ──
  var KEY_LABELS = {
    "managed_object": "Objet gere",
    "chassis_serial": "N° de serie",
    "extended_info": "Infos etendues",
    "task_failure": "Detail echec",
    "error_detail": "Code erreur",
    "ip_address": "Adresse IP",
    "user": "Utilisateur",
    "alarm_name": "Alarme",
    "severity": "Severite",
    "timestamp": "Horodatage",
    "location": "Localisation",
    "device_type": "Type equipement"
  };

  function esc(str) {
    return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  // ── RENDER ──
  function renderSummary(s, env) {
    var badge = document.getElementById("envBadge");
    badge.className = "summary-env-badge badge-" + env;
    badge.textContent = env === "production" ? "Production" : env === "preproduction" ? "Preproduction" : "Systeme";

    var items = [];
    if (s.alarm) items.push({ label: "Alarme", value: s.alarm, full: false });
    items.push({ label: "Sujet", value: s.subject, full: false });
    items.push({ label: "Raison", value: s.reason, full: true });
    items.push({ label: "Impact", value: s.impact, full: true });
    items.push({ label: "Action", value: s.action, full: true });

    var grid = document.getElementById("summaryGrid");
    grid.innerHTML = items.map(function (it) {
      return '<div class="summary-item' + (it.full ? " full" : "") + '">'
        + '<div class="summary-item-label">' + esc(it.label) + '</div>'
        + '<div class="summary-item-value">' + esc(it.value) + '</div>'
        + '</div>';
    }).join("");
  }

  function renderFields(fields) {
    var grid = document.getElementById("fieldsGrid");
    var keys = Object.keys(fields);
    if (!keys.length) {
      grid.innerHTML = '<div style="grid-column:1/-1;color:var(--text-3);font-size:13px;padding:12px 0">Aucun champ structure extrait.</div>';
      return;
    }
    grid.innerHTML = keys.map(function (canon) {
      var entry = fields[canon];
      var label = KEY_LABELS[canon] || canon;
      var hits = decodeValue(entry.value);
      var glossaryHtml = hits.length ? '<div class="field-card-glossary">' + hits.map(function (h) {
        return '<span class="glossary-tag"><b>' + esc(h.token) + '</b> — ' + esc(h.meaning) + '</span>';
      }).join("") + '</div>' : "";
      return '<div class="field-card">'
        + '<div class="field-card-key">'
        + esc(label)
        + '<span class="field-card-raw">' + esc(entry.rawKeys.join(", ")) + '</span>'
        + '</div>'
        + '<div class="field-card-value">' + esc(entry.value) + '</div>'
        + glossaryHtml
        + '</div>';
    }).join("");
  }

  // ── CONTROLLER ──
  var currentSummaryText = "";

  function looksLikeMultipleLogs(text) {
    var blocks = text.split(/\n\s*\n+/).map(function (b) { return b.trim(); }).filter(Boolean);
    return blocks.length >= 2 && blocks.filter(function (b) { return /[A-Za-z][A-Za-z0-9_\.]*\s*[:=]/.test(b); }).length >= 2;
  }

  function runAnalysis() {
    var rawText = document.getElementById("logInput").value.trim();
    var empty = document.getElementById("emptyState");
    var results = document.getElementById("resultsInner");
    var warn = document.getElementById("multiLogWarning");

    if (!rawText) {
      results.classList.remove("visible");
      empty.style.display = "flex";
      warn.style.display = "none";
      return;
    }

    if (looksLikeMultipleLogs(rawText)) {
      results.classList.remove("visible");
      empty.style.display = "none";
      warn.style.display = "flex";
      return;
    }
    warn.style.display = "none";

    var fields = parseLog(rawText);
    var env = detectEnvironment(fields, rawText);
    var summary = buildSummary(fields, rawText, env);

    currentSummaryText = [
      "Environnement : " + summary.env,
      summary.alarm ? "Alarme : " + summary.alarm : "",
      "Sujet : " + summary.subject,
      "Raison : " + summary.reason,
      "Impact : " + summary.impact,
      "Action : " + summary.action
    ].filter(Boolean).join("\n");

    renderSummary(summary, env);
    renderFields(fields);

    empty.style.display = "none";
    results.classList.add("visible");
  }

  function applyTheme() {
    var t = localStorage.getItem("fo-theme") || "dark";
    document.documentElement.setAttribute("data-theme", t);
    // Embarquée en iframe, cette page n'a plus son propre en-tête : le
    // bouton de thème n'existe pas. Sans ce garde, applyTheme() levait sur
    // icon.innerHTML et interrompait init() — le thème n'était donc jamais
    // appliqué du tout, et les écouteurs suivants jamais enregistrés.
    var icon = document.getElementById("themeIcon");
    if (!icon) return;
    if (t === "dark") {
      icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
    } else {
      icon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
    }
  }

  function init() {
    applyTheme();

    // Idem : le bouton n'existe qu'en page autonome.
    var themeBtn = document.getElementById("themeToggle");
    if (themeBtn) themeBtn.addEventListener("click", function () {
      var current = document.documentElement.getAttribute("data-theme") || "light";
      var next = current === "dark" ? "light" : "dark";
      localStorage.setItem("fo-theme", next);
      applyTheme();
    });

    window.addEventListener("storage", function (e) {
      if (e.key === GLOSSARY_STORAGE_KEY) { customGlossary = loadCustomGlossary(); rebuildGlossary(); }
      if (e.key === "fo-theme") applyTheme();
    });

    // Quand cette page est embarquée en iframe dans le dashboard, le bouton
    // de thème du parent ne déclenche pas d'événement `storage` ici (il ne
    // part que vers les AUTRES onglets). Le parent nous prévient donc par
    // postMessage ; on relit fo-theme, déjà écrit avant l'envoi.
    window.addEventListener("message", function (e) {
      if (e.source !== window.parent) return;
      if (e.data && e.data.type === "fo-theme") applyTheme();
    });

    document.getElementById("analyzeBtn").addEventListener("click", runAnalysis);

    document.getElementById("logInput").addEventListener("keydown", function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") runAnalysis();
    });

    document.getElementById("clearBtn").addEventListener("click", function () {
      document.getElementById("logInput").value = "";
      document.getElementById("resultsInner").classList.remove("visible");
      document.getElementById("emptyState").style.display = "flex";
      document.getElementById("multiLogWarning").style.display = "none";
    });

    document.getElementById("copySummaryBtn").addEventListener("click", function () {
      if (!currentSummaryText) return;
      navigator.clipboard.writeText(currentSummaryText).then(function () {
        var btn = document.getElementById("copySummaryBtn");
        var orig = btn.textContent;
        btn.textContent = "Copie !";
        setTimeout(function () { btn.textContent = orig; }, 1500);
      });
    });
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
</body>
</html>
